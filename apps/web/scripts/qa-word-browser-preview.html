<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>HHBA 本地 DOCX 浏览器验收</title>
<link rel="stylesheet" href="/src/styles/original-resume-viewer.css"/>
<link rel="stylesheet" href="/src/styles/browser-word-preview.css"/>
<style>
body{background:#e9edf3;font-family:Arial,sans-serif;margin:0;padding:12px;box-sizing:border-box}
#qa-wrapper{max-width:1100px;margin:auto}
#status{padding:10px;background:white;margin:10px auto;max-width:1100px;font-size:13px}
</style>
</head>
<body>
<div id="status" role="status">正在载入虚构双页 DOCX……</div>
<div id="qa-wrapper" class="hhba-original-word-viewer">
 <div class="hhba-original-resume-paper hhba-word-native-preview hhba-browser-word-paper">
  <div class="hhba-original-resume-page-frame hhba-browser-word-frame">
   <div id="hhba-word-fixture" class="hhba-browser-word-output"></div>
   <div class="hhba-browser-word-overlay"></div>
  </div>
 </div>
</div>
<script type="module">
import {renderBrowserWord,browserWordAnchors,paintBrowserWordSuggestions} from '/src/services/browserWordPreview.ts';
import {inspectOriginalDocxStrict,editOriginalDocxStrict} from '/src/services/resumeDocxPreserve.mjs';
const REPEAT='虚构测试：相同职责描述';
const NEW_REPEAT='虚构测试：第二处独立职责';
const OLD='负责门店运营及日常数据整理工作';
const SPLIT='虚构测试：多节点岗位运营经历';
const PROPOSED='虚构测试：针对岗位优化后的运营经历';
const status=document.getElementById('status');
const root=document.getElementById('hhba-word-fixture');
try{
  const r=await fetch('/__hhba_word_qa.docx',{cache:'no-store'});
  if(!r.ok)throw Error('synthetic DOCX fixture missing');
  const bytes=new Uint8Array(await r.arrayBuffer());
  const pageCount=await renderBrowserWord(bytes,root);
  const anchors=browserWordAnchors(root,[OLD,SPLIT]);
  paintBrowserWordSuggestions(root,[OLD,SPLIT],[{original:SPLIT,proposed:PROPOSED,state:'pending'}]);
  const splitPreview=(root.textContent||'').includes(PROPOSED)&&browserWordAnchors(root,[OLD,SPLIT]).some(a=>a.text===SPLIT);
  paintBrowserWordSuggestions(root,[OLD,SPLIT],[]);
  const splitRestored=(root.textContent||'').includes(SPLIT)&&!(root.textContent||'').includes(PROPOSED);
  const info=await inspectOriginalDocxStrict(bytes,{allowParagraphRuns:true});
  const repeated=info.duplicate_paragraphs.filter(x=>x.text===REPEAT);
  const repeatAnchors=browserWordAnchors(root,[OLD,SPLIT],repeated).filter(a=>a.text===REPEAT);
  paintBrowserWordSuggestions(root,[OLD,SPLIT],[{original:REPEAT,proposed:NEW_REPEAT,state:'pending',occurrence:1,occurrenceCount:2}],repeated);
  const repeatPreview=(root.textContent||'').includes(NEW_REPEAT)&&(root.textContent||'').split(REPEAT).length===2&&browserWordAnchors(root,[OLD,SPLIT],repeated).filter(a=>a.text===REPEAT).length===2;
  paintBrowserWordSuggestions(root,[OLD,SPLIT],[],repeated);
  const repeatRestored=(root.textContent||'').split(REPEAT).length===3;
  const revised=await editOriginalDocxStrict(bytes,[{original:REPEAT,text:NEW_REPEAT,occurrence:1,occurrenceCount:2}],{allowExpansion:true});
  const probe=document.createElement('div');await renderBrowserWord(revised,probe);
  const repeatSaved=(probe.textContent||'').split(REPEAT).length===2&&(probe.textContent||'').includes(NEW_REPEAT);
  window.__HHBA_WORD_QA={
   state:'ok',pageCount,anchors,splitPreview,splitRestored,repeatAnchors,repeatPreview,repeatRestored,repeatSaved,
   text:root.textContent||'',
   images:root.querySelectorAll('img').length,
   scriptTags:root.querySelectorAll('script').length,
   paperMetrics:(()=>{
    const scroller=document.querySelector('.hhba-browser-word-paper');
    const firstPage=root.querySelector('section.hhba-native-docx');
    const sc=scroller.getBoundingClientRect(),pg=firstPage?.getBoundingClientRect();
    return {clientWidth:scroller.clientWidth,scrollWidth:scroller.scrollWidth,
     pageLeft:pg?.left,paperLeft:sc.left,pageWidth:pg?.width,
     fullWidth:root.scrollWidth,rootWidth:root.clientWidth};
   })(),
   remoteImageCount:[...root.querySelectorAll('img[src]')]
    .filter(x=>!/^(data:|blob:)/i.test(x.getAttribute('src')||'')).length
  };
  status.textContent='DOCX 浏览器预览已渲染（仅结构与样式近似，分页未经 Word 验证）';
}catch(e){
  window.__HHBA_WORD_QA={state:'error',error:String(e)};
  status.textContent='验收失败：'+String(e);
}
</script>
</body>
</html>
