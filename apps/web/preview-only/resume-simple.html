<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>

<meta name="color-scheme" content="light"/>
<title>HHBA · 简历查看与 Siri 优化弹窗｜前端预览</title>
<style>
 *{box-sizing:border-box}
 body{margin:0;background:#f5f7fa;color:#1e3b52;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
 .review-header{max-width:1130px;margin:0 auto;padding:20px 22px 17px;display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid #e3eaf0}
 .review-brand{font-size:22px;letter-spacing:-.045em;font-weight:850;color:#2c5572}
 .review-brand span{font-size:10px;letter-spacing:normal;color:#8497a5;font-weight:580;margin-left:10px}
 .review-kicker{color:#6d8394;font-size:11px;line-height:1.7}
 .review-main{max-width:1130px;margin:0 auto;padding:34px 22px}
 .review-eyebrow{font-weight:730;font-size:10px;letter-spacing:.15em;color:#8498a9}
 .review-main h1{font-size:clamp(23px,3vw,34px);margin:9px 0 10px;line-height:1.35;letter-spacing:-.03em}
 .review-main>p{font-size:12px;line-height:1.8;color:#71899a;max-width:760px;margin:0 0 19px}
 .review-main>small{display:block;font-size:11px;color:#94a3b1;line-height:1.9;margin:12px 0}
 @media(max-width:700px){.review-header{padding:15px 14px}.review-main{padding:21px 13px}.review-brand{font-size:20px}.review-brand span{font-size:9px}}
</style>
</head>
<body>
<header class="review-header">
 <div class="review-brand">HHBA <span>汇方职场</span></div>
 <div class="review-kicker">前端交互预览 · 非真实 AI 优化</div>
</header>
<main class="review-main">
 <div class="review-eyebrow">RESUME EXPERIENCE / FRONTEND PREVIEW</div>
 <h1>简历先呈现，优化再出现。</h1>
 <p>这是你确认的新结构：平时在页面内查看简历；点击“开始优化简历”后弹出大窗口，四周出现 Siri 彩虹流光；点击正文段落，小弹窗提供修改与确认操作。</p>
 <div id="stage"></div>
 <small>此演示仅包含虚构示例。没有连接真实求职、AI、原 Word 版式渲染、文件存储或投递服务。</small>
</main>
<script type="module" src="./resume-simple.tsx"></script>
