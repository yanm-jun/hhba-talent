[project]
name = "hhba-api"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "docling==2.138.0",
  "mcp==2.3.0",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.2,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
