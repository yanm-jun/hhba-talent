<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow,noarchive"/><meta name="referrer" content="no-referrer"/><meta name="theme-color" content="#f4f7fe"/>
<title>首次设置管理员密码 · 汇方职场 HHBA</title><link rel="stylesheet" href="/admin-login.css"/><script type="module" src="/admin-login.js"></script></head>
<body data-admin-screen="setup"><main><div class="wrap">
<div class="top"><div class="mark" aria-hidden="true"><img src="/favicon.svg" alt=""/></div><div><div class="brand">汇方职场 <span>HHBA</span></div><div class="subtitle">独立管理中心 · ADMIN WORKSPACE</div></div></div>
<p class="brand-statement">让机会与人才，找到彼此。</p>
<section class="panel"><div class="eyebrow">ACCOUNT SECURITY · HHBA</div><h1>设置你的管理员密码</h1>
<p class="desc">仅首次使用需要完成此步骤。设置以后直接访问 <strong>admin.hhba.work</strong>，输入密码即可登录，不再需要每次邮箱验证。</p>
<form id="admin-setup-form"><label for="admin-password">设置管理员密码</label><div class="input-wrap"><input id="admin-password" type="password" name="password" minlength="14" maxlength="128" autocomplete="new-password" required/><button class="eye" type="button" data-toggle-password="admin-password">显示</button></div>
<p class="hint">建议 14 位以上，混合数字、字母和特殊符号，不要与其他网站重复。</p>
<label for="admin-confirm">再次输入密码</label><input id="admin-confirm" type="password" name="confirm" minlength="14" maxlength="128" autocomplete="new-password" required/>
<button id="admin-submit" type="submit">设置密码并进入后台</button><p class="status" id="admin-message" role="status" aria-live="polite"></p></form>
<div class="help">一次性设置链接仅可使用一次。密码只在安全连接中提交，不写入浏览器地址。</div></section>
<p class="foot">未经授权的人无法使用此设置页面创建管理员账号。</p>
</div></main></body></html>
