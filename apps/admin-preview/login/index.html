<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow,noarchive"/><meta name="referrer" content="no-referrer"/><meta name="theme-color" content="#f7faf8"/>
<title>管理员登录 · 汇方职场 HHBA</title><link rel="stylesheet" href="/admin-login.css"/><script type="module" src="/admin-login.js"></script></head>
<body data-admin-screen="login"><main><div class="wrap">
<div class="top"><div class="mark">H</div><div><div class="brand">汇方职场 · HHBA</div><div class="subtitle">管理中心 · Management Console</div></div></div>
<section class="panel"><div class="eyebrow">SECURE ADMIN ACCESS</div><h1>欢迎回来</h1><p class="desc">一个固定网址，一个管理员账号。登录后即可管理招聘资源、Excel 导入和平台运营数据。</p>
<form id="admin-login-form"><label for="admin-username">管理员账号</label><input id="admin-username" value="admin" name="username" autocomplete="username" readonly required/>
<label for="admin-password">管理员密码</label><div class="input-wrap"><input id="admin-password" type="password" name="password" minlength="14" maxlength="128" autocomplete="current-password" required autofocus/><button class="eye" type="button" data-toggle-password="admin-password">显示</button></div>
<button id="admin-submit" type="submit">登录管理后台</button><p class="status" id="admin-message" role="status" aria-live="polite"></p></form>
<div class="help">仅限 HHBA 授权管理员 · HTTPS 安全连接</div></section>
<p class="foot">登录状态可保持 7 天。公共设备使用完毕，请从后台退出登录。</p>
</div></main></body></html>
