<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="15 3 170 170" role="img" aria-label="HHBA 蓝橙连接桥标志">
  <defs>
    <linearGradient id="personBlue" x1=".08" y1="0" x2=".8" y2="1" objectBoundingBox="true">
      <stop offset="0%" stop-color="#3998ff"/>
      <stop offset="53%" stop-color="#1373fa"/>
      <stop offset="100%" stop-color="#0651dc"/>
    </linearGradient>
    <linearGradient id="personOrange" x1="0" y1="0" x2=".92" y2="1" objectBoundingBox="true">
      <stop offset="0%" stop-color="#ffca44"/>
      <stop offset="50%" stop-color="#ffa92d"/>
      <stop offset="100%" stop-color="#ff811c"/>
    </linearGradient>
    <linearGradient id="blueBody" x1="0.1" y1="0" x2="0.75" y2="1">
      <stop offset="0%" stop-color="#3398ff"/>
