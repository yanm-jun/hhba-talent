  <!-- Two figures: blue represents talent, orange represents employers. -->
  <circle cx="48.5" cy="39.3" r="16.4" fill="url(#blueHead)"/>
  <circle cx="151.4" cy="39.3" r="16.4" fill="url(#orangeHead)"/>
  <path d="M29 78 C29 64 35 59 47 59 C58 59 67 66 74 79 C82 94 82 114 76 137 C74 145 69 149 61 149 L43 149 C34 149 29 142 29 133 Z" fill="url(#blueBody)"/>
  <path d="M170 78 C170 64 164 59 153 59 C142 59 133 66 126 79 C118 94 120 115 129 137 C132 145 135 149 143 149 L156 149 C166 149 170 143 170 133 Z" fill="url(#orangeBody)"/>
  <!-- Light catches the upper edge where the two figures connect. -->
  <path d="M29 115 C49 91 74 80 102 78 C82 83 50 107 29 131 Z" fill="url(#coolHighlight)"/>
  <path d="M117 80 C145 82 161 100 170 120 C155 104 137 86 117 80 Z" fill="url(#warmHighlight)"/>
  <!-- The H-like shared arch is a real vector path, not an embedded bitmap. -->
  <path d="M29 132 C47 103 72 81 101 79 C131 77 154 93 170 122 L170 135 C170 144 165 149 155 149 L142 149 C134 149 129 143 129 135 C128 115 116 98 101 98 C85 98 70 111 70 135 C70 144 65 149 57 149 L44 149 C34 149 29 143 29 132 Z" fill="url(#lowerBridge)"/>
  <!-- Satin-finished upper ribbon: blue transitions to warm gold. -->
  <path d="M29 132 C47 103 72 81 101 79 C131 77 154 93 170 122 C149 100 129 90 103 89 C76 88 50 106 29 132 Z" fill="url(#bridge)"/>
