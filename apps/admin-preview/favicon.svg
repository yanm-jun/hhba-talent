      <stop offset="50%" stop-color="#ffad35"/>
      <stop offset="100%" stop-color="#ff811d"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0%" y1="60%" x2="100%" y2="36%">
      <stop offset="0%" stop-color="#0061e6"/>
      <stop offset="23%" stop-color="#338dfa"/>
      <stop offset="42%" stop-color="#4e91e3"/>
      <stop offset="56%" stop-color="#a798a2"/>
      <stop offset="73%" stop-color="#f5ae5b"/>
      <stop offset="89%" stop-color="#ffb842"/>
      <stop offset="100%" stop-color="#ff9625"/>
    </linearGradient>
    <linearGradient id="lowerBridge" x1="0%" y1="20%" x2="100%" y2="35%">
      <stop offset="0%" stop-color="#0050ce"/>
      <stop offset="24%" stop-color="#136ded"/>
      <stop offset="43%" stop-color="#478dda"/>
      <stop offset="55%" stop-color="#cf8a75"/>
      <stop offset="66%" stop-color="#ff792d"/>
      <stop offset="85%" stop-color="#ff8e20"/>
      <stop offset="100%" stop-color="#ffad37"/>
    </linearGradient>
    <linearGradient id="coolHighlight" x1="10%" y1="0%" x2="90%" y2="100%">
