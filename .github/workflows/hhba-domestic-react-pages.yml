name: HHBA Unified React Domestic GitHub Pages Preview
on:
  push:
    branches: [feat/domestic-weekly-cache-pages-20261022]
    paths:
      - '.github/workflows/hhba-domestic-react-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: hhba-unified-react-pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Validate all 301 Xiaomi historical records
        run: node --test apps/web/scripts/domestic-preview.test.mjs
      - name: Install frontend dependencies
        run: npm ci --prefix apps/web
      - name: Build unchanged HHBA React UI against static domestic snapshot
        env:
          HHBA_GITHUB_PAGES: '1'
        run: npm run build --prefix apps/web
      - name: Check Pages artifacts and SPA deep-route fallback
        run: |
          test -f apps/web/dist/index.html
          test -f apps/web/dist/data/domestic-jobs.json
          cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
