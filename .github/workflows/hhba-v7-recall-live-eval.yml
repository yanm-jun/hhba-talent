name: HHBA V7 Preview real content recall evaluation (GitHub OIDC)
on:
  push:
    branches:
      - feature/match-v7-qualification-recall-eval-20261108
    paths:
      - '.github/workflows/hhba-v7-recall-live-eval.yml'
      - 'apps/web/functions/api/match/v7-recall-eval.js'
permissions:
  contents: read
  id-token: write
concurrency:
  group: hhba-v7-content-recall-once
  cancel-in-progress: false
jobs:
  official-live-search:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Await Cloudflare Preview route
        env:
          ROOT: https://feature-match-v7-qualificati.hhba-talent.pages.dev
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const root=process.env.ROOT;
          assert.equal(new URL(root).hostname,'feature-match-v7-qualificati.hhba-talent.pages.dev');
          let ready=false;
          for(let i=0;i<65;i++){
            try{
              const r=await fetch(root+'/api/match/v7-recall-eval',{
                redirect:'manual',signal:AbortSignal.timeout(10000)});
              if(r.status===200){
                const j=await r.json();
                if(j.kind==='HHBA_V7_RECALL_OIDC_EVAL_20261108_V1'&&
                   j.status==='PROTECTED_RECALL_EVAL_ONLY'){ready=true;break;}
              }
            }catch{}
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          assert.ok(ready,'CLOUDFLARE_PREVIEW_NOT_READY');
          console.log('HHBA_V7_RECALL_PREVIEW_READY');
          NODE
      - name: Search one fixed synthetic occupation through real provider
        env:
          ROOT: https://feature-match-v7-qualificati.hhba-talent.pages.dev
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const root=process.env.ROOT;
          const u=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          u.searchParams.set('audience','hhba-v7-recall-20261108');
          const identity=await fetch(u,{headers:{Authorization:'bearer '+
            process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN},redirect:'error',
            signal:AbortSignal.timeout(15000)});
          assert.equal(identity.status,200,'NO_GITHUB_OIDC_IDENTITY');
          const token=(await identity.json()).value;
          assert.ok(token&&token.length>100);
          const response=await fetch(root+'/api/match/v7-recall-eval',{
            method:'POST',redirect:'manual',signal:AbortSignal.timeout(150000),
            headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
            body:JSON.stringify({mode:'content'})
          });
          const value=await response.json().catch(()=>({error:'INVALID_REPLY'}));
          if(response.status!==200){
            console.log('HHBA_V7_RECALL_PROVIDER_ERROR',
              JSON.stringify({http:response.status,code:value.error||'UNKNOWN'}));
            throw Error('REAL_RECALL_EVALUATION_FAILED');
          }
          assert.equal(value.kind,'HHBA_V7_RECALL_OIDC_EVAL_20261108_V1');
          assert.equal(value.query_scope,'CONTENT_OPERATIONS_MAINLAND');
          assert.equal(value.real_provider,true);
          assert.ok(value.usage.search<=4&&value.usage.fetch<=8);
          assert.ok(value.official_candidate_count<=8);
          console.log('HHBA_V7_REAL_RECALL_EVIDENCE',JSON.stringify(value));
          NODE
