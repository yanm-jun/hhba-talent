name: HHBA S4 DeepSeek official whitelist-first search (isolated)
on:
  pull_request:
    paths:
      - 'apps/web/functions/_lib/deepseek-reviewed-scope-v1.js'
      - 'apps/web/functions/_lib/deepseek-search-match.js'
      - 'apps/web/functions/api/match-native/**'
      - 'apps/web/d1/0023_deepseek_official_whitelist_v1.sql'
      - 'apps/web/scripts/deepseek-whitelist-first-v1.contract.test.mjs'
      - 'apps/web/scripts/deepseek-reviewed-b04-b05.contract.test.mjs'
      - 'apps/web/scripts/deepseek-reviewed-b06.contract.test.mjs'
      - '.github/workflows/hhba-s4-deepseek-official-first.yml'
  workflow_dispatch:
jobs:
  deepseek-official-search-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: S1 S2 S3 S4 offline DeepSeek contract tests
        run: node --test apps/web/scripts/dual-classification-v1.contract.test.mjs apps/web/scripts/knowledge-capture-v1.contract.test.mjs apps/web/scripts/employer-enrichment-v1.contract.test.mjs apps/web/scripts/deepseek-whitelist-first-v1.contract.test.mjs apps/web/scripts/deepseek-reviewed-b04-b05.contract.test.mjs apps/web/scripts/deepseek-reviewed-b06.contract.test.mjs
