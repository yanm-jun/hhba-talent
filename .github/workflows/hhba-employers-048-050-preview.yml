name: HHBA V2 employers 048-050 isolated four-section preview
on:
  push:
    branches: [feature/employers-048-050-v2]
    paths:
      - 'apps/web/src/data/employerProfiles/cn-autumn-048.json'
      - 'apps/web/src/data/employerProfiles/cn-autumn-049.json'
      - 'apps/web/src/data/employerProfiles/cn-autumn-050.json'
      - 'apps/web/src/pages/UnifiedV2CompanyPage.tsx'
      - 'apps/web/scripts/prepare-employers-048-050-media.py'
      - 'apps/web/scripts/employers-048-050-v2.contract.test.mjs'
      - '.github/workflows/hhba-employers-048-050-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hhba-employers-048-050-isolated
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out isolated feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/employers-048-050-v2
          persist-credentials: true
      - name: Install real-image verification and CJK text tooling
        run: |
          python -m pip install pillow beautifulsoup4 cairosvg pymupdf
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Fetch and audit 9 company-associated visuals, no fake official logos
        run: python apps/web/scripts/prepare-employers-048-050-media.py
      - name: Store sourced images and SHA audit only on this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/images/employer-profiles/cn-autumn-048 \
                  apps/web/public/images/employer-profiles/cn-autumn-049 \
                  apps/web/public/images/employer-profiles/cn-autumn-050
          if ! git diff --cached --quiet; then
            git commit -m "assets(048-050): preserve authentic media, SHA proof and editorial wordmark warnings"
            git push origin HEAD:feature/employers-048-050-v2
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - name: Check company four-panel detail contracts and media provenance
        run: node scripts/employers-048-050-v2.contract.test.mjs
        working-directory: apps/web
      - name: Diagnose inherited old-company missing assets separately
        run: node scripts/employer-factory-check.mjs
        working-directory: apps/web
        continue-on-error: true
      - name: Build full HHBA V2 website without modifying main
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
          HHBA_PAGES_BASE: '/hhba-talent/'
          VITE_HHBA_DOMESTIC_REBUILD_V2: '1'
        run: npm run build
      - name: Check 9 independent image files inside static site
        run: |
          test -s apps/web/dist/index.html
          for n in 048 049 050; do
            test -s apps/web/dist/images/employer-profiles/cn-autumn-$n/logo.png
            test -s apps/web/dist/images/employer-profiles/cn-autumn-$n/photo1.jpg
            test -s apps/web/dist/images/employer-profiles/cn-autumn-$n/photo2.jpg
          done
      - name: Upload independent static preview without publishing official GitHub Pages
        uses: actions/upload-artifact@v4
        with:
          name: hhba-employers-048-050-four-section-preview
          path: apps/web/dist/
          retention-days: 14
          if-no-files-found: error
