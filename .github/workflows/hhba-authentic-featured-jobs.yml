name: HHBA authentic logos and six official featured jobs
on:
  push:
    branches: [feat/official-brand-logos-featured-20261020]
    paths:
      - 'apps/web/**'
      - '.github/workflows/hhba-authentic-featured-jobs.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/hhba-authentic-featured-jobs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  brand-and-market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Validate unchanged authentic source logos, six source identities and JD routes
        working-directory: apps/web
        run: |
          node --test scripts/featured-brand-jobs.contract.test.mjs
          node --test scripts/white-market-detail.contract.test.mjs
      - name: Build same white UI that runs on Railway
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '0'
          VITE_HHBA_VERIFIED_SNAPSHOT: '1'
          VITE_HHBA_ACCOUNT_API_ENABLED: '0'
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -s dist/brands/openai.svg
          test -s dist/brands/claude.svg
          test -s dist/brands/spacex.svg
