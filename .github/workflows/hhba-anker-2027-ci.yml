name: HHBA Anker 2027 Employer Build Gate
on:
  push:
    branches: [feat/anker-12-static-v2-20261030]
  pull_request:
    branches: [feat/hhba-unified-static-20261025]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Verify Anker source, unmodified images and existing employers
        working-directory: apps/web
        run: |
          node scripts/anker-2027.contract.test.mjs
          node scripts/domestic-rebuild-v2.contract.test.mjs
          node scripts/major-company-job-flow.contract.test.mjs
          node scripts/all-company-major-chips.contract.test.mjs
          node scripts/hypergryph-major-choices.contract.test.mjs
          node scripts/kpmg-recruitment-first.contract.test.mjs
          node scripts/schneider-recruitment-first.contract.test.mjs
      - name: Build static production site
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
          VITE_HHBA_OVERSEAS_CURATED_100: '1'
          VITE_HHBA_DOMESTIC_REBUILD_V2: '1'
          VITE_HHBA_ACCOUNT_API_ENABLED: '0'
        run: npm run build
