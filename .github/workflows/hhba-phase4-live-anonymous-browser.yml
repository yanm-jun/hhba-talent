name: HHBA Phase 4 Live Anonymous Public Pages Browser
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hhba-phase4-live-anonymous-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless Chromium
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Check production Pages routes without fake company or user data
        run: |
          python - <<'PY'
          import asyncio,json
          from playwright.async_api import async_playwright
          BASE='https://yanm-jun.github.io/hhba-talent/'
          async def run():
           async with async_playwright() as p:
            browser=await p.chromium.launch(headless=True,args=['--no-sandbox'])
            page=await browser.new_page(viewport={'width':390,'height':844},locale='zh-CN')
            errors=[]
            writes=[]
            page.on('pageerror',lambda e:errors.append(str(e)))
            page.on('request',lambda r:writes.append(r.url) if r.method not in ('GET','HEAD') else None)
            await page.goto(BASE+'employer/workspace',wait_until='domcontentloaded',timeout=60000)
            await page.get_by_role('heading',name='发布真实岗位，寻找已授权的人才。').wait_for(timeout=35000)
            assert await page.get_by_text('企业功能预览版',exact=False).count()>0
            assert await page.get_by_role('button',name='待连接企业 API 后开放保存').is_disabled()
            await page.get_by_role('button',name='授权人才搜索').click()
            assert await page.get_by_role('button',name='待企业业务服务上线后开放检索').is_disabled()
            await page.screenshot(path='/tmp/phase4-live-employer-mobile.png',full_page=True)
            await page.goto(BASE+'candidate/employer-jobs',wait_until='domcontentloaded',timeout=60000)
            await page.get_by_role('heading',name='查看经认证企业自主发布的真实招聘岗位。').wait_for(timeout=35000)
            assert await page.get_by_text('企业自主招聘接口尚未上线',exact=False).count()==1
            assert await page.locator('.employer-public-item').count()==0
            await page.screenshot(path='/tmp/phase4-live-candidate-mobile.png',full_page=True)
            assert not writes and not errors,{'writes':writes,'errors':errors}
            print('HHBA_PHASE4_LIVE_BROWSER_PASS',json.dumps({'pages':2,'fake_jobs':0,'mutations':0,'js_errors':0},ensure_ascii=False))
            await browser.close()
          asyncio.run(run())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hhba-phase4-live-mobile-screenshots
          path: |
            /tmp/phase4-live-employer-mobile.png
            /tmp/phase4-live-candidate-mobile.png
          retention-days: 14
          if-no-files-found: ignore
