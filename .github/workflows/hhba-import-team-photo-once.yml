name: HHBA one-time team photo asset import
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hhba-import-team-photo-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy-photograph:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout HHBA Pages source branch
        uses: actions/checkout@v4
        with:
          ref: feat/github-pages-white-preview-20261019
          persist-credentials: true
      - name: Copy selected team photo into the public assets directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/web/public/images
          filename="20250228_AXXES-Gent-02_KP_089__O4A2794"
          ok=0
          for url in \
            "https://www.axxes.com/uploads/442640/${filename}.jpg" \
            "https://www.axxes.com/uploads/442640/${filename}_79a5c065a5d4cbb85c9293b8fc974fbd.jpg" \
            "https://www.axxes.com/uploads/${filename}.jpg" \
            "https://www.axxes.com/uploads/_1024xAUTO_crop_center-center_none/${filename}.jpg" \
            "https://www.axxes.com/uploads/_1400xAUTO_crop_center-center_none/${filename}.jpg" \
            "https://www.axxes.com/uploads/resized/uploads/442640/${filename}_79a5c065a5d4cbb85c9293b8fc974fbd.jpg"; do
            echo "Probing known source variant: $url"
            if curl --fail --silent --show-error --location --max-time 30 \
                 --user-agent 'Mozilla/5.0' "$url" \
                 -o apps/web/public/images/hhba-team-collaboration.jpg; then
              ok=1
              break
            fi
          done
          if [ "$ok" != 1 ]; then echo 'Original photo is no longer reachable at known source paths'; exit 9; fi
          file apps/web/public/images/hhba-team-collaboration.jpg
          test "$(file --brief --mime-type apps/web/public/images/hhba-team-collaboration.jpg)" = image/jpeg
          test "$(wc -c < apps/web/public/images/hhba-team-collaboration.jpg)" -gt 15000
          python3 - <<'PY'
          from pathlib import Path
          data=Path('apps/web/public/images/hhba-team-collaboration.jpg').read_bytes()
          assert data[:3] == b'\xff\xd8\xff' and data[-2:] == b'\xff\xd9'
          print('Verified JPEG bytes:', len(data))
          PY
      - name: Commit selected photo without modifying application code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/web/public/images/hhba-team-collaboration.jpg
          if git diff --cached --quiet; then
            echo 'Photo already committed.'
            exit 0
          fi
          git commit -m 'assets(careers): preserve selected real team collaboration photo'
          git push origin HEAD:feat/github-pages-white-preview-20261019
