name: HHBA complete Chinese JD across all six job boards
on:
  workflow_dispatch:
  push:
    branches: [feat/dual-entry-recruitment-integration]
    paths:
      - 'deploy/railway/full_three_ats_jd_e2e.mjs'
      - '.github/workflows/hhba-three-ats-full-jd-e2e.yml'
  schedule:
    - cron: '55 2 * * 1'
permissions:
  contents: read
jobs:
  three-ats-translation:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all JD segments across all six ATS boards, with no untranslated English prose
        run: node deploy/railway/full_three_ats_jd_e2e.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hhba-six-boards-complete-chinese-jd
          path: three-ats-translation/
          retention-days: 14
