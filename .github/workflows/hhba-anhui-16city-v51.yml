name: HHBA Anhui 16-city V5.1 independent verification (no Pages)
on:
  push:
    branches:
      - feature/talent-anhui-v51-20261031
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hhba-anhui-16city-v51
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Check 16 cities and national V5.1 integrity
        working-directory: apps/web
        run: |
          node --experimental-strip-types scripts/test-anhui-16city-v51.mjs
          node --experimental-strip-types scripts/test-talent-city-contract-v51.mjs
          node --experimental-strip-types scripts/test-talent-cities.mjs
          node --experimental-strip-types scripts/test-talent-housing-card-coverage.mjs
          node scripts/global-talent-nav.contract.test.mjs
      - name: Isolated static compile
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '0'
          HHBA_PAGES_BASE: '/'
        run: npm run build
      - name: Confirm all 16-city data compiled into static assets
        working-directory: apps/web
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const js=fs.readdirSync('dist/assets').filter(x=>x.endsWith('.js')).map(x=>fs.readFileSync('dist/assets/'+x,'utf8')).join('');
          for(const city of ["合肥","芜湖","蚌埠","淮南","马鞍山","淮北","铜陵","安庆","黄山","滁州","阜阳","宿州","六安","亳州","池州","宣城"])if(!js.includes(city))throw Error('Missing '+city);
          for(const id of ['ah-hefei-p1-202610','ah-huaibei-p2-202610','ah-chizhou-housing-202610','ah-xuancheng-p1-202610'])if(!js.includes(id))throw Error('Missing '+id);
          if(!fs.existsSync('dist/index.html'))throw Error('index missing');console.log('ANHUI_ALL_16_STATIC_BUNDLE_OK');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: anhui-16city-v51-static-preview
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 14
