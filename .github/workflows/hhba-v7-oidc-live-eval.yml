name: HHBA V7 one-time real DeepSeek evaluation (OIDC, preview only)
on:
  push:
    branches:
      - feature/match-v7-qualification-recall-eval-20261108
    paths:
      - '.github/workflows/hhba-v7-oidc-live-eval.yml'
      - 'apps/web/functions/api/match/v7-eval.js'
      - 'apps/web/functions/api/match/**'
permissions:
  contents: read
  id-token: write
concurrency:
  group: hhba-v7-oidc-real-evaluation
  cancel-in-progress: false
jobs:
  synthetic-live-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Wait for updated Cloudflare Preview route
        env:
          PREVIEW: https://feature-match-v7-qualificati.hhba-talent.pages.dev
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const root = process.env.PREVIEW;
          assert.equal(new URL(root).hostname, 'feature-match-v7-qualificati.hhba-talent.pages.dev');
          let ready = false;
          for(let i=0;i<44;i++){
            try{
              const res=await fetch(root+'/api/match/v7-eval',{
                method:'GET',redirect:'manual',signal:AbortSignal.timeout(12000)
              });
              if(res.status===200){
                const data=await res.json();
                if(data.kind==='HHBA_V7_GITHUB_OIDC_EVAL_20261108_V1'&&
                   data.status==='AUTHENTICATED_TEST_ONLY'){
                  ready=true;break;
                }
              }
            }catch{}
            await new Promise(resolve=>setTimeout(resolve,12000));
          }
          assert.ok(ready,'Cloudflare preview acceptance route unavailable');
          console.log('V7_PREVIEW_OIDC_TEST_ROUTE_READY');
          NODE
      - name: Run only bounded, synthetic paid DeepSeek calls
        env:
          PREVIEW: https://feature-match-v7-qualificati.hhba-talent.pages.dev
          OIDC_AUDIENCE: hhba-v7-acceptance-20261108
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const root = process.env.PREVIEW;
          const modes=['check','software','transfer','search'];
          const report={};
          for(const mode of modes){
            const url=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            url.searchParams.set('audience',process.env.OIDC_AUDIENCE);
            const credential=await fetch(url,{
              headers:{Authorization:'bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN},
              redirect:'error',signal:AbortSignal.timeout(15000)
            });
            assert.equal(credential.status,200,'GitHub Actions OIDC token service rejected request');
            const jwt=(await credential.json()).value;
            assert.ok(jwt&&jwt.length>100,'GitHub OIDC JWT is absent');
            const res=await fetch(root+'/api/match/v7-eval',{
              method:'POST',redirect:'manual',signal:AbortSignal.timeout(mode==='search'?150000:90000),
              headers:{Authorization:'Bearer '+jwt,'Content-Type':'application/json'},
              body:JSON.stringify({mode})
            });
            const data=await res.json().catch(()=>({error:'INVALID_RESPONSE_JSON'}));
            if(res.status!==200){
              console.log('V7_EVAL_REJECTED',JSON.stringify({mode,status:res.status,error:data.error||'unknown'}));
              throw Error('V7 real API acceptance failed in '+mode);
            }
            assert.equal(data.kind,'HHBA_V7_GITHUB_OIDC_EVAL_20261108_V1');
            report[mode]=mode==='check'?data.provider:mode==='search'?data.discovery:data.result;
            console.log('V7_EVAL_RESULT',JSON.stringify({mode,result:report[mode]}));
            if(mode==='check')assert.equal(data.provider.state,'READY','DeepSeek key/balance not ready');
          }
          assert.ok(report.software&&report.transfer&&report.search,'Missing test cases');
          console.log('V7_REAL_DEEPSEEK_SYNTHETIC_ACCEPTANCE_COMPLETED');
          NODE
