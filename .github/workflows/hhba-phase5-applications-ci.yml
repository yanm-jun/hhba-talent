name: HHBA Phase 5 Direct Employer Application Pipeline
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hhba-phase5-applications-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase5-candidate-applications-20261020
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated HHBA API test dependencies
        run: |
          python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.28,<1' 'sqlalchemy>=2.0,<2.1' 'alembic>=1.14,<2' 'psycopg[binary]>=3.2,<4' 'pwdlib[argon2]>=0.2,<1' 'email-validator>=2.3,<3' 'python-multipart>=0.0.20' pytest
      - name: Validate isolated schema migration and original API
        run: |
          python -m py_compile apps/api/app/main.py apps/api/migrations/versions/20261020_phase5_job_applications.py apps/api/tests/test_phase5_applications.py
      - name: Prove consented job applications and immediate withdrawal without raw resume transfer
        working-directory: apps/api
        run: python -m pytest -q tests/test_phase4_employer_workspace.py tests/test_phase5_applications.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase5-candidate-applications-20261020
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify working candidate application pages and employer review panel compile on the same HHBA
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
        run: |
          npm ci
          npm run build
      - name: Assert voluntary consent, user withdrawal and employer processing are really linked
        run: |
          node -e "const fs=require('fs');const p='apps/web/src/';const check=[['main.tsx','/candidate/my-applications'],['pages/EmployerPublicJobsPage.tsx','EmployerJobApplicationForm'],['pages/EmployerWorkspacePage.tsx','EmployerApplicantPanel'],['components/EmployerJobApplicationForm.tsx','api.applyEmployerJob'],['pages/MyEmployerApplicationsPage.tsx','withdrawEmployerApplication'],['components/EmployerApplicantPanel.tsx','updateEmployerApplicationStatus']];for(const [file,part] of check)if(!fs.readFileSync(p+file,'utf8').includes(part))throw Error(file+' missing '+part);console.log('HHBA_CANDIDATE_EMPLOYER_APPLICATION_UX_LINKED_PASS')"
