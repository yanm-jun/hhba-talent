name: HHBA employers 102-104 independent V2 static review
on:
  push:
    branches: [feature/employers-102-104-v2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hhba-employers-102-104-isolated-review
  cancel-in-progress: true
jobs:
  static-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install reproducible dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Verify new 102–104 company identities, records, major-specific search and evidence
        working-directory: apps/web
        run: |
          node scripts/employers-102-104-v2.contract.test.mjs
          node scripts/employer-job-level-search.contract.test.mjs
          node scripts/major-direct-role-results.contract.test.mjs
          node scripts/recruitment-market-source-invalid.regression.test.mjs
      - name: Compile existing approved four-block layout and materialize static company routes
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
          HHBA_PAGES_BASE: '/hhba-talent/'
          VITE_HHBA_DOMESTIC_REBUILD_V2: '1'
        run: |
          npm run build
          node scripts/materialize-company-route-entries.mjs
      - name: Validate direct links, 2 non-real images each, and media provenance
        run: |
          test -s apps/web/dist/index.html
          for id in 102 103 104; do
            test -s "apps/web/dist/companies/autumn/cn-autumn-$id/index.html"
            test -s "apps/web/dist/images/employer-profiles/cn-autumn-$id/logo.svg"
            test -s "apps/web/dist/images/employer-profiles/cn-autumn-$id/photo1.svg"
            test -s "apps/web/dist/images/employer-profiles/cn-autumn-$id/photo2.svg"
            test -s "apps/web/dist/images/employer-profiles/cn-autumn-$id/media-sources.json"
          done
      - name: Upload complete independently reviewable static build - never deploy main GitHub Pages
        uses: actions/upload-artifact@v4
        with:
          name: hhba-employers-102-104-independent-static-review
          path: apps/web/dist/
          retention-days: 14
          if-no-files-found: error
      - name: Preserve official recruitment evidence and unlicensed photo audit for review
        uses: actions/upload-artifact@v4
        with:
          name: hhba-employers-102-104-source-media-audit
          path: |
            apps/web/public/images/employer-profiles/cn-autumn-102/media-sources.json
            apps/web/public/images/employer-profiles/cn-autumn-103/media-sources.json
            apps/web/public/images/employer-profiles/cn-autumn-104/media-sources.json
            docs/HHBA_EMPLOYERS_102_104_SOURCE_AUDIT_20261103.md
          retention-days: 30
          if-no-files-found: error
