name: HHBA V2 Guangzhilv isolated preview
on:
  push:
    branches:
      - feat/employer-v2-gzl-027-20261030
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder
        run: python -m pip install --quiet Pillow
      - name: Obtain source-backed local Guangzhilv media
        run: python apps/web/scripts/prepare-guangzhilv-media.py
      - name: Verify V2 employer JSON and three real image assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('apps/web/src/data/employerProfiles/cn-autumn-027.json').read_text())
          assert p['id']=='cn-autumn-027' and p['name']=='广之旅'
          assert len(p['jobs'])==8 and len({j['id'] for j in p['jobs']})==8
          assert all(j['currentOpenVerified'] is False and j['evidenceUrl'].startswith('https://') for j in p['jobs'])
          for image in [p['media']['logo'], *[x['path'] for x in p['media']['photos']]]:
              assert (Path('apps/web/public')/image).stat().st_size>2000, image
          print('HHBA_GUANGZHILV_V2_MEDIA_AND_8_RECORDS_OK')
          PY
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Verify shared V2 contracts
        working-directory: apps/web
        run: |
          node scripts/domestic-rebuild-v2.contract.test.mjs
          node scripts/all-company-major-chips.contract.test.mjs
          node scripts/major-company-job-flow.contract.test.mjs
      - name: Build isolated candidate preview
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
          VITE_HHBA_OVERSEAS_CURATED_100: '1'
          VITE_HHBA_DOMESTIC_REBUILD_V2: '1'
          VITE_HHBA_ACCOUNT_API_ENABLED: '0'
        run: npm run build
      - name: Confirm image files appear in static build
        run: |
          test -s apps/web/dist/images/employer-profiles/cn-autumn-027/logo.png
          test -s apps/web/dist/images/employer-profiles/cn-autumn-027/photo1.jpg
          test -s apps/web/dist/images/employer-profiles/cn-autumn-027/photo2.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: hhba-v2-guangzhilv-preview
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 14
