name: HHBA Pages Real Job Detail Browser Acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hhba-pages-jd-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jd-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/github-pages-white-preview-20261019
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and Playwright
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Test online full-job audit status plus real English and Chinese JD
        run: python scripts/check_pages_jd_browser.py
      - name: Retain visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hhba-live-jd-original-and-translation
          path: /tmp/hhba-jd-browser/*.png
          retention-days: 7
          if-no-files-found: warn
