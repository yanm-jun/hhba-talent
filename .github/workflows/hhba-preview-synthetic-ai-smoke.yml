name: HHBA Preview synthetic AI smoke (one-shot)
on:
  push:
    branches:
      - feature/resume-targeted-optimization-foundation-20261119
    paths:
      - '.github/workflows/hhba-preview-synthetic-ai-smoke.yml'
permissions:
  contents: read
jobs:
  once:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: One no-PII synthetic DeepSeek probe on immutable Preview
        env:
          PREVIEW_URL: https://752205a1.hhba-talent.pages.dev
        run: |
          node --input-type=module <<'EOF'
          // This endpoint uses server-owned fixed synthetic text only.
          // No real CV, bearer credentials, user data, API keys or retries.
          const origin=process.env.PREVIEW_URL;
          let response;
          try {
            response=await fetch(origin+'/api/preview-deepseek-diagnostic?mode=synthetic',{
              method:'POST',headers:{Origin:origin,'Sec-Fetch-Site':'same-origin'},
              redirect:'manual',signal:AbortSignal.timeout(45000)
            });
          } catch(e) {
            console.log(JSON.stringify({kind:'HHBA_PREVIEW_AI_SMOKE',network_error:true}));
            process.exitCode=1;
          }
          if(response){
            const data=await response.json().catch(()=>({}));
            const result={kind:'HHBA_PREVIEW_AI_SMOKE',http_status:response.status,
              code:typeof data.code==='string'?data.code:'INVALID_RESPONSE',
              ok:data.ok===true,suggestion_count:Number.isInteger(data.suggestion_count)?data.suggestion_count:null};
            console.log(JSON.stringify(result));
            if(response.status!==200||data.code!=='SYNTHETIC_AI_GENERATION_OK')process.exitCode=1;
          }
          EOF
