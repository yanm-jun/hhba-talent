name: HHBA Tencent Official Job Discovery
on:
  push:
    branches: [feat/dual-entry-recruitment-integration]
    paths:
      - 'deploy/railway/collect_tencent_official_sample.mjs'
      - '.github/workflows/hhba-tencent-official-collector.yml'
  pull_request:
    paths:
      - 'deploy/railway/collect_tencent_official_sample.mjs'
      - '.github/workflows/hhba-tencent-official-collector.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect at most 120 verified-format Tencent official listing observations
        run: node deploy/railway/collect_tencent_official_sample.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hhba-tencent-official-public-observations
          path: domestic-discovery-evidence/
          retention-days: 14
          if-no-files-found: ignore
