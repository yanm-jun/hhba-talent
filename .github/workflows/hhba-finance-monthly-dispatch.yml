name: HHBA monthly finance disclosure dispatch
on:
  schedule:
    # Beijing 21st 10:00–23:55, every five minutes. UTC date is also 21st.
    - cron: '*/5 2-15 21 * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hhba-finance-dispatch
  cancel-in-progress: false
jobs:
  publish-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Dispatch only reviewed real reports, no sample data
        env:
          HHBA_FIN_DISPATCH_SECRET: ${{ secrets.HHBA_FIN_DISPATCH_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${HHBA_FIN_DISPATCH_SECRET:-}" ]; then
            echo "Finance dispatch secret not configured; no email sent."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 --max-time 120 --request POST \
            --header "Authorization: Bearer ${HHBA_FIN_DISPATCH_SECRET}" \
            --header "Content-Type: application/json" \
            "https://hhba.work/api/transparency/dispatch" \
            --data '{}'
