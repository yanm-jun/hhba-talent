name: HHBA Energy 100 candidate recruitment sources
on:
  pull_request:
    paths:
      - 'apps/web/d1/0029_energy_recruitment_candidate_links_100_v1.sql'
      - 'apps/web/functions/_lib/energy-recruitment-batch-001-100.js'
      - 'apps/web/functions/_lib/energy-candidate-scope-v1.js'
      - 'apps/web/scripts/energy-100-candidates.contract.test.mjs'
      - '.github/workflows/hhba-energy-100-candidates.yml'
  workflow_dispatch:
jobs:
  energy-candidate-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 100 links, classification and preview isolation
        run: node --test apps/web/scripts/energy-100-candidates.contract.test.mjs
      - name: Check SQLite migration, nine categories and idempotence
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          con=sqlite3.connect(':memory:')
          con.execute('PRAGMA foreign_keys=ON')
          con.execute('CREATE TABLE hhba_library_halls(hall_id TEXT PRIMARY KEY)')
          con.execute("INSERT INTO hhba_library_halls VALUES('energy')")
          con.execute('CREATE TABLE hhba_library_hall_sections(section_id TEXT PRIMARY KEY, hall_id TEXT NOT NULL REFERENCES hhba_library_halls(hall_id), display_name TEXT NOT NULL, sort_order INTEGER NOT NULL)')
          migration=Path('apps/web/d1/0029_energy_recruitment_candidate_links_100_v1.sql').read_text()
          con.executescript(migration)
          con.executescript(migration)
          count=con.execute('SELECT COUNT(*) FROM hhba_library_energy_recruitment_candidates').fetchone()[0]
          distinct=con.execute('SELECT COUNT(DISTINCT candidate_url) FROM hhba_library_energy_recruitment_candidates').fetchone()[0]
          remaining=con.execute("SELECT COUNT(*) FROM hhba_library_energy_recruitment_candidates WHERE source_status='UNVERIFIED'").fetchone()[0]
          groups=dict(con.execute('SELECT section_id,COUNT(*) FROM hhba_library_energy_recruitment_candidates GROUP BY section_id').fetchall())
          expected={'energy-grid':3,'energy-generation':12,'energy-nuclear':5,'energy-hydro':5,'energy-engineering':20,'energy-solar':18,'energy-wind':10,'energy-storage':15,'energy-equipment':12}
          assert (count,distinct,remaining)==(100,100,100),(count,distinct,remaining)
          assert groups==expected,(groups,expected)
          assert con.execute("SELECT COUNT(*) FROM hhba_library_hall_sections WHERE hall_id='energy'").fetchone()[0]==9
          print('HHBA energy source migration OK:',count,groups)
          PY
