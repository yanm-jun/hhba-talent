name: HHBA Durable Overseas JD Queue Safety Tests
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hhba-durable-jd-queue-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/durable-overseas-jd-sync-20261019
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Test persistent queue, source version, no false full-translation claims
        working-directory: ops/legacy-marketplace
        run: bun test jd-sync-store.test.mjs jd-sync-runner.test.mjs
      - name: Verify deployed Bun Docker server bundles the persistent worker and queue
        working-directory: ops/legacy-marketplace
        run: |
          bun install
          cp railway-function-20261018.ts server.ts
          sed -i 's/"html-to-text@9"/"html-to-text"/;s/"sanitize-html@2"/"sanitize-html"/' server.ts
          bun build --target=bun server.ts --outdir /tmp/hhba-durable-sync
