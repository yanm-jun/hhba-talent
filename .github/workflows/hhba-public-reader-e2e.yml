name: HHBA Public JD Chinese Reader E2E
on:
  workflow_dispatch:
  push:
    branches: [feat/dual-entry-recruitment-integration]
    paths:
      - 'deploy/railway/public_reader_e2e.mjs'
      - '.github/workflows/hhba-public-reader-e2e.yml'
permissions:
  contents: read
jobs:
  public-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live job details page and translate official JD over public HTTPS
        run: node --test deploy/railway/public_reader_e2e.mjs
