name: HHBA V8 final one-shot real DeepSeek Search Fetch audit (GitHub OIDC)
on:
  push:
    branches:
      - feature/match-v8-deepseek-dynamic-official-discovery-20261108
    paths:
      - '.github/workflows/hhba-v8-final-live-audit.yml'
      - 'apps/web/functions/api/match/v8-final-live-audit.js'
permissions:
  contents: read
  id-token: write
concurrency:
  group: hhba-v8-final-live-audit-one-shot
  cancel-in-progress: false
jobs:
  official-live-search:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Await Cloudflare Preview route
        env:
          ROOT: https://feature-match-v8-deepseek-dy.hhba-talent.pages.dev
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const root=process.env.ROOT;
          assert.equal(new URL(root).hostname,'feature-match-v8-deepseek-dy.hhba-talent.pages.dev');
          let ready=false;
          for(let i=0;i<65;i++){
            try{
              const r=await fetch(root+'/api/match/v8-final-live-audit',{
                redirect:'manual',signal:AbortSignal.timeout(10000)});
              if(r.status===200){
                const j=await r.json();
                if(j.kind==='HHBA_V8_FINAL_LIVE_AUDIT_20261108_V7'&&
                   j.status==='PROTECTED_DYNAMIC_EVAL_ONLY'){ready=true;break;}
              }
            }catch{}
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          assert.ok(ready,'CLOUDFLARE_PREVIEW_NOT_READY');
          console.log('HHBA_V8_FINAL_LIVE_AUDIT_PREVIEW_READY');
          NODE
      - name: Run one bounded synthetic role through DeepSeek V4 Pro Search and Fetch
        env:
          ROOT: https://feature-match-v8-deepseek-dy.hhba-talent.pages.dev
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const root=process.env.ROOT;
          const u=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          u.searchParams.set('audience','hhba-v8-final-live-audit-20261108');
          const identity=await fetch(u,{headers:{Authorization:'bearer '+
            process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN},redirect:'error',
            signal:AbortSignal.timeout(15000)});
          assert.equal(identity.status,200,'NO_GITHUB_OIDC_IDENTITY');
          const token=(await identity.json()).value;
          assert.ok(token&&token.length>100);
          const response=await fetch(root+'/api/match/v8-final-live-audit',{
            method:'POST',redirect:'manual',signal:AbortSignal.timeout(300000),
            headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
            body:JSON.stringify({mode:'workplace'})
          });
          const value=await response.json().catch(()=>({error:'INVALID_REPLY'}));
          if(response.status!==200){
            console.log('HHBA_V8_FINAL_LIVE_AUDIT_PROVIDER_ERROR',
              JSON.stringify({http:response.status,code:value.error||'UNKNOWN'}));
            throw Error('REAL_V8_EVALUATION_FAILED');
          }
          assert.equal(value.kind,'HHBA_V8_FINAL_LIVE_AUDIT_20261108_V7');
          assert.equal(value.query_scope,'CONTENT_OPERATIONS_MAINLAND');
          assert.equal(value.real_provider,true);
          assert.ok(value.usage.model<=4&&value.usage.search<=8&&value.usage.fetch<=20);
          assert.ok((value.candidates||[]).length<=10);
          assert.ok(value.cost_estimate?.estimated_total_cny>=0);
          console.log('HHBA_V8_FINAL_LIVE_AUDIT_REAL_EVIDENCE',JSON.stringify(value));
          NODE
