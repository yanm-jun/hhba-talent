name: HHBA Import Reviewed Industry Reference Photos
on:
  push:
    branches: [main]
    paths: ['.github/workflows/hhba-import-vetted-reference-photos.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout HHBA GitHub static preview
        uses: actions/checkout@v4
        with:
          ref: feat/hhba-unified-static-20261025
          persist-credentials: true
      - name: Download the existing 312-photo research ZIP (not regenerated)
        uses: actions/download-artifact@v4
        with:
          name: hhba-156-companies-312-individual-industry-photos
          run-id: 40731442485
          repository: yanm-jun/hhba-talent
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reviewed-source-zip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image verification dependency
        run: python -m pip install -q pillow
      - name: Import only individual scene-reviewed photographs
        run: |
          python apps/web/scripts/import-reviewed-autumn-industry-photos.py --artifact-dir reviewed-source-zip --web-root apps/web/public
          python - <<'PY'
          import json, pathlib, hashlib
          root=pathlib.Path('apps/web/public')
          meta=json.loads((root/'data/domestic-autumn-industry-photos.json').read_text())
          assert meta['approvedCompanies']==11 and meta['approvedPhotos']==17
          photos=[p for items in meta['entries'].values() for p in items]
          assert len({p['sha256'] for p in photos})==17
          for p in photos:
            path=root/p['file']
            assert path.exists() and path.stat().st_size>10000
            assert hashlib.sha256(path.read_bytes()).hexdigest()==p['sha256']
            assert p['sourceUrl'].startswith('https://commons.wikimedia.org/wiki/File:')
            assert p['licenseUrl'].startswith('https://creativecommons.org/')
          print('17_INDEPENDENT_LICENSED_REFERENCES_VERIFIED;OTHERS_NOT_CLAIMED_COMPLETED')
          PY
      - name: Commit exactly the vetted images and full attribution manifest to preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/web/public/images/autumn-industry-references/
          git add -f apps/web/public/data/domestic-autumn-industry-photos.json
          git diff --cached --quiet && { echo "No change to vetted assets"; exit 0; }
          git commit -m "assets: preserve 36 visually reviewed Wikimedia industry reference photographs with attribution"
          git push origin HEAD:feat/hhba-unified-static-20261025
