name: HHBA Independently Sourced Company Profile Acceptance
on:
  push:
    branches: [feat/company-profiles-official-sources-20261020]
    paths:
      - 'apps/web/**'
      - 'ops/legacy-marketplace/**'
      - '.github/workflows/hhba-company-profiles.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'ops/legacy-marketplace/**'
      - '.github/workflows/hhba-company-profiles.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile-and-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Verify profiles, attribution, navigation and official job integrity
        working-directory: apps/web
        run: |
          node --test scripts/company-profiles.contract.test.mjs
          node --test scripts/job-origin-navigation.contract.test.mjs
          node --test scripts/featured-brand-jobs.contract.test.mjs
          node --test scripts/white-market-detail.contract.test.mjs
      - name: Build exact Railway white-site frontend
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '0'
          VITE_HHBA_VERIFIED_SNAPSHOT: '1'
          VITE_HHBA_ACCOUNT_API_ENABLED: '0'
        run: |
          npm run build
          test -s dist/index.html
          test -s dist/brands/openai.svg
          test -s dist/brands/claude.svg
          test -s dist/brands/spacex.svg
