name: HHBA Birmingham University Deep Profile Validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hhba-study-birmingham-validation.yml'
      - 'apps/web/src/data/studyBirmingham.ts'
      - 'apps/web/src/components/BirminghamUniversityPage.tsx'
      - 'apps/web/src/components/StudyUniversityDirectory.tsx'
      - 'apps/web/src/styles/study-birmingham.css'
      - 'apps/web/scripts/package-birmingham-campus-photos.py'
      - 'apps/web/scripts/birmingham.contract.test.mjs'
      - 'apps/web/scripts/birmingham.browser.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hhba-birmingham-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Verify Birmingham deep profile, legal real photos, accurate 2027 fee & interactions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Verify full school/program evidence, photo credits and no homepage changes
        working-directory: apps/web
        run: node --experimental-strip-types --test scripts/birmingham.contract.test.mjs scripts/study-universities.contract.test.mjs scripts/study-abroad.contract.test.mjs
      - name: Download and attribute three genuine licensed Birmingham university photographs
        run: python apps/web/scripts/package-birmingham-campus-photos.py
      - name: Compile exact main HHBA React site
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
          HHBA_PAGES_BASE: '/hhba-talent/'
        run: npm run build
      - name: Install Chromium for actual site UX
        working-directory: apps/web
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser check desktop/mobile deep pages, photographs, international fees, application steps
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
          HHBA_PAGES_BASE: '/hhba-talent/'
          HHBA_TEST_BASE: 'http://127.0.0.1:4173/hhba-talent/'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/hhba-birmingham.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS "$HHBA_TEST_BASE" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS "$HHBA_TEST_BASE" >/dev/null
          node scripts/birmingham.browser.mjs
      - name: Save desktop/mobile screenshots and test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hhba-birmingham-deep-profile-proof
          path: apps/web/mainline-v2-browser-proof/
          retention-days: 14
          if-no-files-found: ignore
