name: HHBA V8 single-run Browser Run and official DeepSeek live acceptance (OIDC)
on:
  push:
    branches:
      - feature/match-v8-deepseek-dynamic-official-discovery-20261108
    paths:
      - '.github/workflows/hhba-v8-native-browser-acceptance.yml'
      - 'apps/web/functions/api/match/v8-native-browser-acceptance.js'
permissions:
  contents: read
  id-token: write
concurrency:
  group: hhba-v8-native-browser-one-shot
  cancel-in-progress: false
jobs:
  official-live-search:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Await Cloudflare Preview route
        env:
          ROOT: https://feature-match-v8-deepseek-dy.hhba-talent.pages.dev
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const root=process.env.ROOT;
          assert.equal(new URL(root).hostname,'feature-match-v8-deepseek-dy.hhba-talent.pages.dev');
          let ready=false;
          for(let i=0;i<65;i++){
            try{
              const r=await fetch(root+'/api/match/v8-native-browser-acceptance',{
                redirect:'manual',signal:AbortSignal.timeout(10000)});
              if(r.status===200){
                const j=await r.json();
                if(j.kind==='HHBA_V8_NATIVE_BROWSER_ACCEPTANCE_20261109'&&
                   j.status==='PROTECTED_ONE_SHOT_PREVIEW_ONLY'){ready=true;break;}
              }
            }catch{}
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          assert.ok(ready,'CLOUDFLARE_PREVIEW_NOT_READY');
          console.log('HHBA_V8_NATIVE_BROWSER_PREVIEW_READY');
          NODE
      - name: Run single Browser Run rendered Tencent public JD smoke (one-shot)
        env:
          ROOT: https://feature-match-v8-deepseek-dy.hhba-talent.pages.dev
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const root=process.env.ROOT;
          const u=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          u.searchParams.set('audience','hhba-v8-native-browser-20261109');
          const identity=await fetch(u,{headers:{Authorization:'bearer '+
            process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN},redirect:'error',
            signal:AbortSignal.timeout(15000)});
          assert.equal(identity.status,200,'NO_GITHUB_OIDC_IDENTITY');
          const token=(await identity.json()).value;
          assert.ok(token&&token.length>100);
          const response=await fetch(root+'/api/match/v8-native-browser-acceptance',{
            method:'POST',redirect:'manual',signal:AbortSignal.timeout(300000),
            headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
            body:JSON.stringify({mode:'render_probe'})
          });
          const value=await response.json().catch(()=>({error:'INVALID_REPLY'}));
          if(response.status!==200){
            console.log('HHBA_V8_NATIVE_RENDER_PROVIDER_ERROR',
              JSON.stringify({http:response.status,code:value.error||'UNKNOWN'}));
            throw Error('REAL_V8_EVALUATION_FAILED');
          }
          assert.equal(value.kind,'HHBA_V8_NATIVE_BROWSER_ACCEPTANCE_20261109');
          assert.equal(value.real_browser,true);
          assert.equal(value.mode,'render_probe');
          assert.equal(value.accounted,true);
          console.log('HHBA_V8_NATIVE_RENDER_REAL_EVIDENCE',JSON.stringify(value));
          NODE
      - name: Execute one bounded DeepSeek plus Browser Run full official discovery
        env:
          ROOT: https://feature-match-v8-deepseek-dy.hhba-talent.pages.dev
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const root=process.env.ROOT;
          const u=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          u.searchParams.set('audience','hhba-v8-native-browser-20261109');
          const identity=await fetch(u,{headers:{Authorization:'bearer '+
            process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN},redirect:'error',
            signal:AbortSignal.timeout(15000)});
          assert.equal(identity.status,200,'NO_GITHUB_OIDC_IDENTITY');
          const token=(await identity.json()).value;
          assert.ok(token&&token.length>100);
          const response=await fetch(root+'/api/match/v8-native-browser-acceptance',{
            method:'POST',redirect:'manual',signal:AbortSignal.timeout(300000),
            headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
            body:JSON.stringify({mode:'full_e2e'})
          });
          const value=await response.json().catch(()=>({error:'INVALID_REPLY'}));
          if(response.status!==200){
            console.log('HHBA_V8_NATIVE_E2E_PROVIDER_ERROR',
              JSON.stringify({http:response.status,code:value.error||'UNKNOWN'}));
            throw Error('REAL_V8_EVALUATION_FAILED');
          }
          assert.equal(value.kind,'HHBA_V8_NATIVE_BROWSER_ACCEPTANCE_20261109');
          assert.equal(value.real_provider,true);
          assert.equal(value.mode,'full_e2e');
          assert.ok((value.stats?.browser_render?.attempts||0)<=2);
          assert.ok(value.usage.model<=4&&value.usage.search<=8&&value.usage.fetch<=20);
          assert.ok((value.candidates||[]).length<=10);
          assert.ok(value.cost_estimate?.estimated_total_cny>=0);
          console.log('HHBA_V8_NATIVE_E2E_REAL_EVIDENCE',JSON.stringify(value));
          NODE
