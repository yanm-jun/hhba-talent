name: HHBA R2 Cloudflare Resume AI Match P0
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'docs/RESUME_MATCH_R2_CLOUDFLARE_P0_20261107.md'
      - '.github/workflows/hhba-cloudflare-resume-matching-p0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Install pinned web dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts
      - name: Contract and API syntax tests
        working-directory: apps/web
        run: |
          node --check 'functions/api/match/[[path]].js'
          node --check functions/_lib/resume-match-core.js
          node --check functions/_lib/resume-tenure.js
          node --check functions/_lib/mainland-job-location.js
          node --check 'functions/api/match-native/[[path]].js'
          node --check functions/api/match-native/_middleware.js
          node --check 'functions/api/match-next/[[path]].js'
          node --check functions/_lib/clean-match-v2.js
          node --check functions/_lib/match-hard-qualification.js
          node --check functions/_lib/openai-match-adapter.js
          node --check functions/_lib/agent-v3-provider.js
          node --check functions/_lib/agent-v3-understanding.js
          node --check functions/api/agent-v3/[[path]].js
          node --check functions/_lib/resume-ai-provider.js
          node --check functions/_lib/resume-jd-match-agent.js
          node --check functions/_lib/resume-rewrite-provider.js
          node --check functions/_lib/clean-match-v2-jd-bridge.js
          node --check functions/_lib/clean-match-v2-provider-check.js
          node --check functions/_lib/deepseek-native-match.js
          node --check functions/_lib/deepseek-search-match.js
          node --check functions/_lib/match-job-quality.js
          node --check functions/_lib/match-employer-source.js
          node --check functions/_lib/match-history.js
          node --check 'functions/api/match-history/[[path]].js'
          node --check functions/_lib/resume-role-evidence.js
          node --check functions/_lib/professional-credentials.js
          node --test scripts/resume-pre-match-storage.contract.test.mjs scripts/saved-resume-picker.contract.test.mjs scripts/match-v5-credentials.contract.test.mjs scripts/match-audit-hardgates.contract.test.mjs scripts/resume-tenure.contract.test.mjs scripts/resume-match-cloudflare.contract.test.mjs scripts/resume-match-endtoend.test.mjs scripts/match-native-web.contract.test.mjs scripts/match-legacy-retirement.contract.test.mjs scripts/openai-clean-match.contract.test.mjs scripts/agent-v3-relay.contract.test.mjs scripts/match-hard-qualification.contract.test.mjs scripts/resume-optimization.route.test.mjs scripts/resume-word.route.test.mjs scripts/resume-docx-preserve.contract.test.mjs scripts/clean-match-v2.contract.test.mjs scripts/clean-match-v2-jd-bridge.contract.test.mjs scripts/clean-match-v2-provider-check.contract.test.mjs scripts/clean-match-v2-route.contract.test.mjs scripts/match-search-first.contract.test.mjs scripts/match-history.contract.test.mjs scripts/demo-account.contract.test.mjs scripts/candidate-apply-assistant-workbench.contract.test.mjs
      - name: TypeScript and Vite bundle
        working-directory: apps/web
        run: npm run build
