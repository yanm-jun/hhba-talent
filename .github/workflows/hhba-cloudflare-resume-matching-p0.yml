name: HHBA R2 Cloudflare Resume AI Match P0
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'docs/RESUME_MATCH_R2_CLOUDFLARE_P0_20261107.md'
      - '.github/workflows/hhba-cloudflare-resume-matching-p0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Install pinned web dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts
      - name: Contract and API syntax tests
        working-directory: apps/web
        run: |
          node --check 'functions/api/match/[[path]].js'
          node --check functions/_lib/resume-match-core.js
          node --check functions/_lib/resume-tenure.js
          node --check functions/_lib/mainland-job-location.js
          node --check 'functions/api/match-native/[[path]].js'
          node --check functions/_lib/deepseek-native-match.js
          node --check functions/_lib/deepseek-search-match.js
          node --check functions/_lib/talent-search-providers.js
          node --check functions/_lib/talent-search-career-graph.js
          node --check functions/_lib/talent-search-official-proof.js
          node --check functions/_lib/talent-search-orchestrator.js
          node --check scripts/talent-search-live-benchmark.mjs
          node --check functions/_lib/talent-search-employer-store.js
          node --check functions/_lib/talent-search-evidence-fit.js
          node --check functions/_lib/talent-search-jd-extract.js
          node --check functions/_lib/talent-search-page-reader.js
          node --check functions/_lib/talent-search-verifier-pipeline.js
          node --check functions/_lib/match-job-quality.js
          node --check functions/_lib/match-employer-source.js
          node --check functions/_lib/match-history.js
          node --check 'functions/api/match-history/[[path]].js'
          node --check functions/_lib/resume-role-evidence.js
          node --check functions/_lib/professional-credentials.js
          node --test scripts/match-v5-credentials.contract.test.mjs scripts/match-audit-hardgates.contract.test.mjs scripts/resume-tenure.contract.test.mjs scripts/resume-match-cloudflare.contract.test.mjs scripts/resume-match-endtoend.test.mjs scripts/match-native-web.contract.test.mjs scripts/match-search-first.contract.test.mjs scripts/match-history.contract.test.mjs scripts/talent-search-providers.contract.test.mjs scripts/demo-account.contract.test.mjs scripts/candidate-apply-assistant-workbench.contract.test.mjs
      - name: TypeScript and Vite bundle
        working-directory: apps/web
        run: npm run build

  talent-search-provider-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Install pinned web dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts
      - name: Validate provider adapter and isolated contract tests
        working-directory: apps/web
        run: |
          node --check functions/_lib/talent-search-providers.js
          node --test scripts/talent-search-providers.contract.test.mjs scripts/talent-search-career-graph.contract.test.mjs scripts/talent-search-official-proof.contract.test.mjs scripts/talent-search-orchestrator.contract.test.mjs scripts/talent-search-page-reader.contract.test.mjs scripts/talent-search-endtoend.contract.test.mjs scripts/talent-search-verifier-pipeline.contract.test.mjs scripts/talent-search-jd-extract.contract.test.mjs scripts/talent-search-evidence-fit.contract.test.mjs scripts/talent-search-employer-store.contract.test.mjs scripts/talent-search-live-benchmark.contract.test.mjs scripts/talent-search-complete-poc.contract.test.mjs
