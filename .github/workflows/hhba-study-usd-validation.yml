name: HHBA USD University Deep Profile Validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hhba-study-usd-validation.yml'
      - 'apps/web/src/components/SouthDakotaUniversityPage.tsx'
      - 'apps/web/src/components/StudyUniversityDirectory.tsx'
      - 'apps/web/src/data/studySouthDakota.ts'
      - 'apps/web/src/styles/study-south-dakota.css'
      - 'apps/web/scripts/package-usd-campus-photos.py'
      - 'apps/web/scripts/south-dakota.contract.test.mjs'
      - 'apps/web/scripts/south-dakota.browser.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hhba-usd-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Real school dossier, licensed photo packaging and real Chromium UX
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact site dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Validate school source facts, programme depth, 2027 dates and homepage isolation
        working-directory: apps/web
        run: node --experimental-strip-types --test scripts/south-dakota.contract.test.mjs scripts/study-universities.contract.test.mjs scripts/study-abroad.contract.test.mjs
      - name: Package 3 true campus photos with clear Commons rights and creator attribution
        run: python apps/web/scripts/package-usd-campus-photos.py
      - name: Build the exact HHBA main React app
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
          HHBA_PAGES_BASE: '/hhba-talent/'
        run: npm run build
      - name: Install real browser
        working-directory: apps/web
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test real compiled site on desktop/mobile, images, links, degree pages
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
          HHBA_PAGES_BASE: '/hhba-talent/'
          HHBA_TEST_BASE: 'http://127.0.0.1:4173/hhba-talent/'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/hhba-usd-preview.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS "$HHBA_TEST_BASE" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS "$HHBA_TEST_BASE" >/dev/null
          node scripts/south-dakota.browser.mjs
      - name: Save browser screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hhba-usd-university-deep-profile-proof
          path: apps/web/mainline-v2-browser-proof/
          if-no-files-found: ignore
          retention-days: 14
