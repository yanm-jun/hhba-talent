name: Jiangsu 13-city V5.1 isolated static acceptance
on:
  push:
    branches:
      - feature/talent-jiangsu
  pull_request:
    paths:
      - 'apps/web/src/data/jiangsu*.ts'
      - 'apps/web/src/data/talentPolicyRecords.ts'
      - 'apps/web/src/data/talentHousingRecords.ts'
      - 'apps/web/src/pages/TalentServiceRoutes.tsx'
      - 'apps/web/src/components/talent/UnifiedTalentRecordDetail.tsx'
      - 'apps/web/scripts/test-jiangsu-city-v51.mjs'
      - '.github/workflows/hhba-jiangsu-branch-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hhba-jiangsu-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-jiangsu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install site dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Verify all Jiangsu policy and housing records
        working-directory: apps/web
        run: node --experimental-strip-types scripts/test-jiangsu-city-v51.mjs
      - name: Verify national V5.1 integrity, never overwrite other cities
        working-directory: apps/web
        run: node --experimental-strip-types scripts/test-talent-city-contract-v51.mjs
      - name: Verify national city search
        working-directory: apps/web
        run: node --experimental-strip-types scripts/test-talent-cities.mjs
      - name: Build complete HHBA site for isolated static preview
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
          HHBA_PAGES_BASE: '/hhba-talent/'
        run: npm run build
      - name: Archive full static build without deploying to main site
        uses: actions/upload-artifact@v4
        with:
          name: jiangsu-13-city-v51-static-preview
          path: apps/web/dist/
          retention-days: 14
          if-no-files-found: error
