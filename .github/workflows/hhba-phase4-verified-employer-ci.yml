name: HHBA Phase 4 Verified Employer Workspace
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hhba-phase4-verified-employer-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase4-employer-workspace-isolated-20261020
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal HHBA API test environment
        run: |
          python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.28,<1' 'sqlalchemy>=2.0,<2.1' 'alembic>=1.14,<2' 'psycopg[binary]>=3.2,<4' 'pwdlib[argon2]>=0.2,<1' 'email-validator>=2.3,<3' 'python-multipart>=0.0.20' pytest
      - name: Compile backend and new phase 4 migration without executing unsafe data changes
        run: |
          python -m py_compile apps/api/app/main.py apps/api/migrations/versions/20261020_phase4_employer_postings.py apps/api/tests/test_phase4_employer_workspace.py
      - name: Verify reviewed employer postings, SQL authorization, private talent search and immediate revoke
        working-directory: apps/api
        run: python -m pytest -q tests/test_phase4_employer_workspace.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase4-employer-workspace-isolated-20261020
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install existing frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Compile full HHBA employer public + admin workflow without duplicate API actions
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
        run: npm run build
      - name: Verify standalone public employer jobs and independent reviewer pages
        run: |
          test -f apps/web/src/pages/EmployerPublicJobsPage.tsx
          test -f apps/web/src/pages/EmployerReviewPage.tsx
          test -f apps/web/src/styles/employer-public-jobs.css
          test -f apps/web/src/styles/employer-review.css
      - name: Verify employer dashboard and admin review are both integrated without changing official ATS search
        run: |
          node -e "const fs=require('fs');const ui=fs.readFileSync('apps/web/src/pages/EmployerWorkspacePage.tsx','utf8');const router=fs.readFileSync('apps/web/src/main.tsx','utf8');for(const k of ['api.createPosting','api.submitPosting','api.talentSearch','api.closePosting','/recruiter/onboarding'])if(!ui.includes(k))throw Error('missing employer action '+k);if(!router.includes('/employer/workspace')||!router.includes('/admin/employer-review'))throw Error('workspace or reviewer route absent');console.log('HHBA_EMPLOYER_WORKSPACE_CONTRACT_PASS');"
