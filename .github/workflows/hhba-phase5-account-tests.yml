name: HHBA employer and candidate Phase5 synthetic security tests
on:
  push:
    branches: [feat/white-employer-api-recovery-20261020]
    paths:
      - 'apps/api/**'
      - '.github/workflows/hhba-phase5-account-tests.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/hhba-phase5-account-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-consent-and-employer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only the minimal account HTTP API test requirements
        run: |
          python -m pip install --disable-pip-version-check             'fastapi>=0.115,<1' 'sqlalchemy>=2.0,<2.1'             'psycopg[binary]>=3.2,<4' 'pwdlib[argon2]>=0.2,<1'             'email-validator==2.3.0' 'python-multipart>=0.0.20,<1'             'httpx>=0.28,<1' 'pytest>=8,<10'
      - name: Test employer review, consent revocation, candidate withdrawal and privacy
        working-directory: apps/api
        env:
          HHBA_TEST_ONLY: '1'
          HHBA_VERIFICATION_ROOT: /tmp/hhba-synthetic-verification
          HHBA_UPLOAD_ROOT: /tmp/hhba-synthetic-resumes
        run: python -m pytest -q tests/test_phase4_employer_workspace.py tests/test_phase5_applications.py
