name: HHBA employers 072-074 source-backed isolated preview
on:
  push:
    branches: [feature/employers-072-074-v2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hhba-employers-072-074-preview
  cancel-in-progress: true
jobs:
  full-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow for genuine image file validation
        run: python -m pip install --quiet Pillow
      - name: Fetch 072-074 actual-company / government-source photography and SHA-256
        working-directory: apps/web
        run: python scripts/prepare-employers-072-074-sourced-media.py
      - name: Fetch inherited 069-070 official-source real images
        working-directory: apps/web
        run: python scripts/prepare-employers-069-071-source-media.py
      - name: Fetch inherited 066/068 source-backed company photos
        working-directory: apps/web
        run: python scripts/prepare-employers-066-068-real-media.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Run legacy and all seven latest enterprise batch contract checks
        working-directory: apps/web
        run: |
          node scripts/employers-054-056-v2.contract.test.mjs
          node scripts/employers-057-059-v2.contract.test.mjs
          node scripts/employers-060-062-v2.contract.test.mjs
          node scripts/employers-063-065-v2.contract.test.mjs
          node scripts/employers-066-068-v2.contract.test.mjs
          node scripts/employers-069-071-v2.contract.test.mjs
          node scripts/employers-072-074-v2.contract.test.mjs
          node scripts/recruitment-market-source-invalid.regression.test.mjs
      - name: Build full independent static site without touching official Pages
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
          HHBA_PAGES_BASE: '/hhba-talent/'
          VITE_HHBA_DOMESTIC_REBUILD_V2: '1'
        run: |
          npm run build
          node scripts/materialize-company-route-entries.mjs
      - name: Verify direct company detail routes and images actually ship
        run: |
          test -s apps/web/dist/index.html
          for id in 072 073 074; do
            test -s "apps/web/dist/companies/autumn/cn-autumn-$id/index.html"
            test -s "apps/web/dist/images/employer-profiles/cn-autumn-$id/logo.svg"
            test -s "apps/web/dist/images/employer-profiles/cn-autumn-$id/media-sources.json"
          done
      - name: Publish inspectable image provenance report
        uses: actions/upload-artifact@v4
        with:
          name: hhba-072-074-company-real-photo-source-report
          path: |
            apps/web/public/images/employer-profiles/cn-autumn-072/media-sources.json
            apps/web/public/images/employer-profiles/cn-autumn-073/media-sources.json
            apps/web/public/images/employer-profiles/cn-autumn-074/media-sources.json
          retention-days: 30
          if-no-files-found: error
      - name: Save full review-only static website
        uses: actions/upload-artifact@v4
        with:
          name: hhba-employers-072-074-full-static-review
          path: apps/web/dist/
          retention-days: 14
          if-no-files-found: error
