name: HHBA public search-index SEO checks and IndexNow
on:
  push:
    branches:
      - main
      - "feature/search-*"
    paths:
      - 'README.md'
      - 'apps/web/index.html'
      - 'apps/web/public/robots.txt'
      - 'apps/web/public/_headers'
      - 'apps/web/scripts/build-search-index-assets.mjs'
      - 'apps/web/scripts/search-index-assets.contract.test.mjs'
      - 'apps/web/scripts/audit-live-search-crawlers.mjs'
      - 'apps/web/scripts/submit-indexnow-from-sitemap.mjs'
      - 'apps/web/scripts/submit-indexnow-from-sitemap.contract.test.mjs'
      - 'apps/web/src/data/employerProfiles/**'
      - 'apps/web/src/data/talent**'
      - 'apps/web/scripts/cloudflare-pages-build.py'
      - '.github/workflows/hhba-search-index-assets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seo-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public crawling and sitemap generation
        working-directory: apps/web
        run: |
          node --check scripts/build-search-index-assets.mjs
          node --check scripts/submit-indexnow-from-sitemap.mjs
          node --test scripts/search-index-assets.contract.test.mjs scripts/submit-indexnow-from-sitemap.contract.test.mjs
  notify-indexnow:
    if: github.ref == 'refs/heads/main'
    needs: seo-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for the exact production commit and published sitemap
        shell: bash
        run: |
          set -euo pipefail
          key='9a3c3cf5a998f8d7e916078a3e4255efee04cc25'
          for attempt in $(seq 1 60); do
            published=$(curl -fsSL --max-time 12 "https://hhba.work/$key.txt" || true)
            map=$(curl -fsSL --max-time 12 https://hhba.work/sitemap.xml || true)
            release=$(curl -fsSL --max-time 12 https://hhba.work/seo-release.json || true)
            if [[ "$published" == "$key" && "$map" == *'<urlset'* && "$release" == *"$GITHUB_SHA"* ]]; then
              echo "Production $GITHUB_SHA and XML sitemap confirmed"
              exit 0
            fi
            sleep 15
          done
          echo 'Production SEO artifacts not yet deployed'; exit 1
      - name: Notify IndexNow with every deployed public sitemap URL
        working-directory: apps/web
        run: node scripts/submit-indexnow-from-sitemap.mjs
