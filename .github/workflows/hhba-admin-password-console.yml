name: HHBA standalone admin password console
on:
  push:
    branches:
      - feat/admin-password-console-20261112
    paths:
      - 'apps/web/functions/_lib/console-password.js'
      - 'apps/web/functions/_lib/admin-access.js'
      - 'apps/web/functions/_middleware.js'
      - 'apps/web/functions/api/console-auth/**'
      - 'apps/web/scripts/admin-password-console.test.mjs'
      - 'apps/web/scripts/admin-brand-consistency.test.mjs'
      - 'apps/web/scripts/build-standalone-admin.py'
      - 'apps/admin-preview/**'
      - '.github/workflows/hhba-admin-password-console.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secure-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript security endpoints and UI
        run: |
          node --check apps/web/functions/_lib/console-password.js
          node --check apps/web/functions/_lib/admin-access.js
          node --check apps/web/functions/_middleware.js
          node --check 'apps/web/functions/api/console-auth/[action].js'
          node --check apps/admin-preview/admin-login.js
          node --check apps/admin-preview/admin-console-ui.js
          node --check apps/admin-preview/library.js
      - name: Verify password setup and session security
        run: |
          node --test apps/web/scripts/admin-password-console.test.mjs
          node --test apps/web/scripts/admin-recruitment-library.test.mjs
          node --test apps/web/scripts/admin-library-excel.test.mjs
          node --test apps/web/scripts/admin-brand-consistency.test.mjs
      - name: Build isolated admin console assets
        run: |
          cd apps/web
          CF_PAGES_BRANCH=feat/admin-password-console-20261112 python3 scripts/build-standalone-admin.py
          test -s dist/admin-preview/library.js
          test -s dist/login/index.html
          test -s dist/setup/index.html
          test -s dist/favicon.svg
          grep -q 'HHBA' dist/favicon.svg
          ! grep -q 'HHBA_ADMIN_SETUP_SHA256' dist/login/index.html
