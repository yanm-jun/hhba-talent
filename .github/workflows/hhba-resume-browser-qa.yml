name: HHBA Resume Browser QA
on:
  push:
    branches:
      - feature/resume-targeted-optimization-foundation-20261119
    paths:
      - '.github/workflows/hhba-resume-browser-qa.yml'
      - 'apps/web/qa/**'
      - 'apps/web/scripts/resume-browser.qa.mjs'
      - 'apps/web/scripts/generate-cjk-native-pdf-qa.py'
      - 'apps/web/src/services/resumePdfCjkFont.*'
      - 'apps/web/src/services/resumePdfNativeVerify.*'
      - 'apps/web/scripts/resume-preview-browser.qa.mjs'
      - 'apps/web/src/components/CandidateMatchNativeDialog.tsx'
      - 'apps/web/src/components/CandidateJourneySteps.tsx'
      - 'apps/web/src/styles/candidate-journey.css'
      - 'apps/web/src/services/officialApplicationUrl.*'
      - 'apps/web/src/components/TargetedResumeOptimization.tsx'
      - 'apps/web/src/components/ResumePrintSheet.tsx'
      - 'apps/web/src/services/resumeDocx.ts'
      - 'apps/web/src/services/resumeDocument.ts'
      - 'apps/web/src/styles/resume-print.css'
      - 'apps/web/src/styles/targeted-resume-optimization.css'
      - 'apps/web/src/styles/resume-match-dialog.css'
  pull_request:
    paths:
      - '.github/workflows/hhba-resume-browser-qa.yml'
      - 'apps/web/qa/**'
      - 'apps/web/scripts/resume-browser.qa.mjs'
      - 'apps/web/scripts/generate-cjk-native-pdf-qa.py'
      - 'apps/web/src/services/resumePdfCjkFont.*'
      - 'apps/web/src/services/resumePdfNativeVerify.*'
      - 'apps/web/scripts/resume-preview-browser.qa.mjs'
      - 'apps/web/src/components/CandidateMatchNativeDialog.tsx'
      - 'apps/web/src/components/CandidateJourneySteps.tsx'
      - 'apps/web/src/styles/candidate-journey.css'
      - 'apps/web/src/services/officialApplicationUrl.*'
      - 'apps/web/src/components/TargetedResumeOptimization.tsx'
      - 'apps/web/src/components/ResumePrintSheet.tsx'
      - 'apps/web/src/services/resumeDocx.ts'
      - 'apps/web/src/services/resumeDocument.ts'
      - 'apps/web/src/styles/resume-print.css'
      - 'apps/web/src/styles/targeted-resume-optimization.css'
      - 'apps/web/src/styles/resume-match-dialog.css'
permissions:
  contents: read
jobs:
  ui-regression:
    name: Real Chromium AI/edit/save/print/mobile
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked app dependencies and isolated browser driver
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright-core@1.56.1
          command -v google-chrome || command -v chromium
      - name: Install actual Chinese fonts for Chromium PDF verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-arphic-gbsn00lp
          fc-cache -f
          fc-match "Noto Sans CJK SC"
      - name: Generate real embedded Chinese font PDF (QA only)
        run: |
          python3 -m venv /tmp/hhba-cjk-qa-venv
          /tmp/hhba-cjk-qa-venv/bin/pip install -q fonttools==4.63.0
          /tmp/hhba-cjk-qa-venv/bin/python scripts/generate-cjk-native-pdf-qa.py qa/generated-cjk-original.pdf
          test -s qa/generated-cjk-original.pdf
      - name: Start Vite development server with only synthetic QA data
        run: |
          VITE_HHBA_REAL_AUTH_ENABLED=1 npm run dev -- --host 127.0.0.1 --port 3000 > /tmp/hhba-resume-qa-vite.log 2>&1 &
          for i in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:3000/qa/resume-flow.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hhba-resume-qa-vite.log
          exit 1
      - name: Run real browser editing and A4 PDF assertions
        env:
          QA_OUTPUT: /tmp/hhba-resume-browser-qa
        run: node scripts/resume-browser.qa.mjs
      - name: Render full AI-written Word to real PDF and verify all sections
        run: |
          test -s /tmp/hhba-resume-browser-qa/whole-resume-ai-review-export.docx
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libreoffice-writer poppler-utils
          fi
          mkdir -p /tmp/hhba-resume-browser-qa/word-to-pdf
          libreoffice -env:UserInstallation=file:///tmp/hhba-whole-resume-lo-profile \
            --headless --convert-to pdf \
            --outdir /tmp/hhba-resume-browser-qa/word-to-pdf \
            /tmp/hhba-resume-browser-qa/whole-resume-ai-review-export.docx
          test -s /tmp/hhba-resume-browser-qa/word-to-pdf/whole-resume-ai-review-export.pdf
          pdfinfo /tmp/hhba-resume-browser-qa/word-to-pdf/whole-resume-ai-review-export.pdf | grep 'Pages:'
          pdftotext -layout /tmp/hhba-resume-browser-qa/word-to-pdf/whole-resume-ai-review-export.pdf \
            /tmp/hhba-resume-browser-qa/word-to-pdf/whole-resume-ai-review-export.txt
          python3 -c 'from pathlib import Path; import re; p=Path("/tmp/hhba-resume-browser-qa/word-to-pdf/whole-resume-ai-review-export.txt"); text=re.sub(r"\s+","",p.read_text(encoding="utf-8")); expected=["REWRITTENWORDRESUME","虚构经历段落8","职业概述与个人优势"]; missing=[x for x in expected if x not in text]; print("PDF characters:",len(text),"missing:",missing,"text head:",text[:420]); assert not missing, "Word-to-PDF conversion lost expected authored content"'
          pdftoppm -f 1 -l 3 -scale-to 1000 -png \
            /tmp/hhba-resume-browser-qa/word-to-pdf/whole-resume-ai-review-export.pdf \
            /tmp/hhba-resume-browser-qa/word-to-pdf/page
      - name: Live Cloudflare Preview Chromium smoke (desktop and mobile, no PII)
        env:
          HHBA_PREVIEW_URL: https://a5a230af.hhba-talent.pages.dev
          QA_OUTPUT: /tmp/hhba-resume-live-preview-qa
        run: node scripts/resume-preview-browser.qa.mjs
      - name: Preserve real Preview anonymous screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hhba-resume-live-preview-browser-qa
          path: /tmp/hhba-resume-live-preview-qa/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve synthetic screenshots and generated PDFs on failure or success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hhba-resume-synthetic-browser-qa
          path: /tmp/hhba-resume-browser-qa/
          if-no-files-found: ignore
          retention-days: 7
