name: HHBA Mainland Dual-Source Top10 Fusion V1
on:
  pull_request:
    paths:
      - 'apps/web/functions/_lib/domestic-match-fusion.js'
      - 'apps/web/functions/_lib/deepseek-official-job-agent.js'
      - 'apps/web/functions/_lib/cf-job-browser-preview.js'
      - 'apps/web/functions/_lib/mainland-job-workplace-evidence.js'
      - 'apps/web/functions/_lib/deepseek-job-search-quality.js'
      - 'apps/web/functions/_lib/deepseek-discovery-billing.js'
      - 'apps/web/d1/0019_match_v8_discovery_accounting.sql'
      - 'apps/web/scripts/match-v8-deepseek-agent.contract.test.mjs'
      - 'apps/web/scripts/match-v8-browser-preview.contract.test.mjs'
      - 'apps/web/scripts/match-v8-search-quality.contract.test.mjs'
      - 'apps/web/scripts/match-v8-employer-evidence.contract.test.mjs'
      - 'apps/web/scripts/match-v8-workplace-evidence.contract.test.mjs'
      - 'apps/web/scripts/match-v8-discovery-cost.contract.test.mjs'
      - 'apps/web/functions/_lib/job-qualification-evidence.js'
      - 'apps/web/functions/_lib/resume-match-core.js'
      - 'apps/web/functions/api/match/**'
      - 'apps/web/src/pages/CandidateMatchPage.tsx'
      - 'apps/web/src/styles/resume-match-dialog.css'
      - 'apps/web/scripts/match-v6-tristate-intent.contract.test.mjs'
      - 'apps/web/scripts/match-v7-guardrails-quality.contract.test.mjs'
      - 'apps/web/scripts/match-v7-preview-live.smoke.mjs'
      - 'apps/web/functions/_lib/career-transfer-evidence.js'
      - 'apps/web/functions/_lib/match-ranking.js'
      - 'apps/web/functions/_lib/match-explanation.js'
      - 'apps/web/scripts/match-v3-calibration.contract.test.mjs'
      - 'apps/web/scripts/match-v4-cross-discipline.contract.test.mjs'
      - 'apps/web/functions/_lib/professional-credentials.js'
      - 'apps/web/functions/_lib/match-quality-evaluator.js'
      - 'apps/web/scripts/match-v5-credentials.contract.test.mjs'
      - 'apps/web/scripts/match-v5-quality-evaluation.contract.test.mjs'
      - 'apps/web/functions/_lib/resume-role-evidence.js'
      - 'apps/web/functions/_lib/job-skill-evidence.js'
      - 'apps/web/functions/_lib/mainland-job-location.js'
      - 'apps/web/functions/_lib/resume-role-evidence.js'
      - 'apps/web/scripts/match-audit-hardgates.contract.test.mjs'
      - 'apps/web/scripts/job-skill-evidence.contract.test.mjs'
      - 'apps/web/functions/_lib/resume-tenure.js'
      - 'apps/web/scripts/resume-tenure.contract.test.mjs'
      - 'apps/web/scripts/match-ranking-v2.contract.test.mjs'
      - 'apps/web/scripts/domestic-match-fusion.contract.test.mjs'
      - 'apps/web/scripts/domestic-search-fetch.contract.test.mjs'
      - 'apps/web/functions/_lib/domestic-search-fetch.js'
      - 'apps/web/src/services/resumeMatch.ts'
      - 'apps/web/src/components/CandidateMatchResultDialog.tsx'
      - 'apps/web/scripts/domestic-search-preview-http.smoke.mjs'
      - '.github/workflows/hhba-domestic-match-fusion-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-fusion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Install pinned dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts
      - name: Verify source guards and deterministic ranking
        working-directory: apps/web
        run: |
          node --check functions/_lib/deepseek-official-job-agent.js
          node --check functions/_lib/cf-job-browser-preview.js
          node --check functions/_lib/mainland-job-workplace-evidence.js
          node --check functions/_lib/deepseek-job-search-quality.js
          node --check functions/_lib/deepseek-discovery-billing.js
          node --check functions/_lib/domestic-search-fetch.js
          node --check functions/_lib/domestic-match-fusion.js
          node --check functions/_lib/match-ranking.js
          node --check functions/_lib/match-explanation.js
          node --check functions/_lib/professional-credentials.js
          node --check functions/_lib/match-quality-evaluator.js
          node --check functions/_lib/job-skill-evidence.js
          node --check functions/_lib/job-qualification-evidence.js
          node --check functions/_lib/career-transfer-evidence.js
          node --check functions/_lib/mainland-job-location.js
          node --check functions/_lib/resume-role-evidence.js
          node --check functions/_lib/resume-tenure.js
          node --test scripts/match-v8-browser-preview.contract.test.mjs scripts/match-v8-workplace-evidence.contract.test.mjs scripts/match-v8-employer-evidence.contract.test.mjs scripts/match-v8-search-quality.contract.test.mjs scripts/match-v8-discovery-cost.contract.test.mjs scripts/match-v8-deepseek-agent.contract.test.mjs scripts/match-v7-guardrails-quality.contract.test.mjs scripts/match-v6-tristate-intent.contract.test.mjs scripts/match-v5-credentials.contract.test.mjs scripts/match-v5-quality-evaluation.contract.test.mjs scripts/match-v4-cross-discipline.contract.test.mjs scripts/match-v3-calibration.contract.test.mjs scripts/match-audit-hardgates.contract.test.mjs scripts/job-skill-evidence.contract.test.mjs scripts/resume-tenure.contract.test.mjs scripts/match-ranking-v2.contract.test.mjs scripts/domestic-match-fusion.contract.test.mjs scripts/domestic-search-fetch.contract.test.mjs scripts/domestic-search-fetch.route.test.mjs
      - name: Check HHBA web production build
        working-directory: apps/web
        run: npm run build
      - name: Real HTTPS Preview smoke (disabled pilot, no charge)
        working-directory: apps/web
        run: node scripts/domestic-search-preview-http.smoke.mjs
      - name: Real HTTPS Preview smoke (flag on, anonymous requests denied, no charge)
        working-directory: apps/web
        env:
          HHBA_DOMESTIC_PILOT_PREVIEW: https://69dffa55.hhba-talent.pages.dev
          HHBA_DOMESTIC_PILOT_EXPECT_ENABLED: '1'
        run: node scripts/domestic-search-preview-http.smoke.mjs
      - name: Real V7 branch HTTPS Preview routes and anonymous API guard (no AI spend)
        working-directory: apps/web
        env:
          HHBA_MATCH_V7_PREVIEW: https://feature-match-v7-qualificati.hhba-talent.pages.dev
        run: node scripts/match-v7-preview-live.smoke.mjs
