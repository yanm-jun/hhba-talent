name: HHBA True Brand Browser Rendering Acceptance
on:
  push:
    branches: [test/official-logo-browser-20261020]
    paths: ['.github/workflows/hhba-brand-browser-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visible-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install temporary browser (not a project dependency)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Open real Railway HHBA and inspect rendered first six cards and actual SVG pixels
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          try{
           const page=await browser.newPage({viewport:{width:1440,height:1000}});
           page.on('pageerror',err=>console.warn('WEB_JS_ERROR',err.message.slice(0,160)));
           await page.goto('https://hhba-web-production-024c.up.railway.app/candidate/jobs',{waitUntil:'domcontentloaded',timeout:90000});
           await page.waitForFunction(()=>document.querySelectorAll('.unified-job-card').length>=6,{timeout:90000});
           const cards=await page.locator('.unified-job-card').evaluateAll(elements=>elements.slice(0,6).map(node=>{
             const image=node.querySelector('.unified-brand-logo img');
             return {
               company:node.querySelector('.unified-company-brand strong')?.textContent?.trim(),
               title:node.querySelector('h3')?.textContent?.trim(),
               logo:image?.getAttribute('src')||null,
               complete:!!image?.complete,
               width:image?.naturalWidth||0
             };
           }));
           console.log('HHBA_RENDERED_FIRST_SIX',JSON.stringify(cards));
           assert.deepEqual(cards.map(c=>c.company),['OpenAI','OpenAI','Anthropic','Anthropic','SpaceX','SpaceX']);
           for(const [i,c] of cards.entries()){
             assert.ok(c.title.length>=4,'real title missing '+i);
             assert.ok(c.logo?.startsWith('/brands/'),'authentic logo not bound '+i);
             assert.ok(c.complete&&c.width>0,'brand image not loaded '+i);
           }
           await page.locator('.unified-job-card').first().locator('h3 a').click();
           await page.waitForURL(/\/candidate\/jobs\/ashby-openai-/, {timeout:25000});
           await page.locator('.unified-detail-employer img').waitFor({timeout:25000});
           const brand=await page.locator('.unified-detail-employer img').evaluate(e=>({src:e.getAttribute('src'),loaded:e.complete&&e.naturalWidth>0}));
           assert.equal(brand.loaded,true,'detail page original logo missing');
           console.log('HHBA_BRAND_BROWSER_ACCEPTED',JSON.stringify({cardCount:cards.length,companies:3,logosLoaded:6,detailLogoLoaded:true}));
          }finally{await browser.close()}
          NODE
