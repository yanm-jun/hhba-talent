name: HHBA Current ATS Board Live Acceptance
on:
  push:
    branches: [feat/dual-entry-recruitment-integration]
    paths:
      - 'deploy/railway/30_board_live_acceptance.mjs'
      - '.github/workflows/hhba-30-board-acceptance.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * *'
permissions:
  contents: read
jobs:
  live-market:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check every configured ATS board and one original JD per source
        run: node deploy/railway/30_board_live_acceptance.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hhba-current-ats-live-boards
          path: current-board-audit/
          retention-days: 21
