name: HHBA Verified ATS Source Build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hhba-verified-six-ats-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/verified-six-ats-boards-20261019
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Verify existing plus six new official ATS sources
        working-directory: ops/legacy-marketplace
        run: node verify-six-boards.mjs
      - name: Install Bun dependencies only in CI
        working-directory: ops/legacy-marketplace
        run: bun install
      - name: Check Bun production source compiles
        working-directory: ops/legacy-marketplace
        run: |
          cp railway-function-20261018.ts server.ts
          sed -i 's/"html-to-text@9"/"html-to-text"/;s/"sanitize-html@2"/"sanitize-html"/' server.ts
          bun build --target=bun server.ts --outdir /tmp/hhba-ats-brand-build
      - name: Verify official boards remain readable
        working-directory: ops/legacy-marketplace
        run: |
          node -e "
          const boards=[['greenhouse','spacex'],['greenhouse','spacexglobal'],['greenhouse','anthropic'],['greenhouse','doordashusa'],['ashby','deepgram'],['ashby','cohere']];
          const make=(platform,s)=> platform==='greenhouse'?'https://boards-api.greenhouse.io/v1/boards/'+s+'/jobs':'https://api.ashbyhq.com/posting-api/job-board/'+s;
          (async()=>{for(const [p,s] of boards){
            const r=await fetch(make(p,s),{signal:AbortSignal.timeout(26000),redirect:'error'});
            if(!r.ok)throw Error(p+':'+s+' official HTTP '+r.status);
            const data=await r.json();const rows=data.jobs;
            if(!Array.isArray(rows)||!rows.length)throw Error(p+':'+s+' no jobs');
            console.log('VERIFIED_ATS_SOURCE',JSON.stringify({platform:p,slug:s,positions:rows.length}));
          }})().catch(e=>{console.error(e);process.exit(1)});
          "
