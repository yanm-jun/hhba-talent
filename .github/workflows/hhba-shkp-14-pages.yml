name: HHBA SHKP 14 isolated Pages preview
on:
  push:
    branches: [feat/shkp-14-static-v2-20261030]
    paths:
      - '.github/workflows/hhba-shkp-14-pages.yml'
      - 'apps/web/scripts/shkp-14.browser.mjs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: hhba-shkp-14-isolated-preview
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shkp-14-static-v2-20261030
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked web dependencies
        run: npm ci --prefix apps/web --no-audit --no-fund
      - name: Protect 158 domestic roles, 100 overseas roles and all existing company contracts
        working-directory: apps/web
        run: |
          node scripts/shkp-14.contract.test.mjs
          node scripts/laifen-13.contract.test.mjs
          node scripts/anker-2027.contract.test.mjs
          node scripts/domestic-rebuild-v2.contract.test.mjs
          node scripts/major-company-job-flow.contract.test.mjs
          node scripts/all-company-major-chips.contract.test.mjs
          node scripts/hypergryph-major-choices.contract.test.mjs
      - name: Build SHKP preview with existing market/major search
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
          HHBA_PAGES_BASE: '/hhba-talent/preview-shkp/'
          VITE_HHBA_VERIFIED_SNAPSHOT: '1'
          VITE_HHBA_OVERSEAS_CURATED_100: '1'
          VITE_HHBA_DOMESTIC_REBUILD_V2: '1'
          VITE_HHBA_ACCOUNT_API_ENABLED: '0'
          VITE_DEMO_ACCOUNT_ENABLED: '0'
        run: |
          npm run build
          cp dist/index.html dist/404.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const shkp=JSON.parse(fs.readFileSync('src/data/domesticShkp2026SourcedRoles20261030.json','utf8'));
          const paths=['companies/autumn/cn-autumn-010','candidate/jobs',...shkp.jobs.map(j=>'candidate/jobs/cn-v2-shkp-'+j.id)];
          if(paths.length!==10)throw Error('Missing SHKP routes');
          for(const path of paths){fs.mkdirSync('dist/'+path,{recursive:true});fs.copyFileSync('dist/index.html','dist/'+path+'/index.html')}
          fs.writeFileSync('dist/.nojekyll','');
          console.log('SHKP_10_REFRESH_SAFE_ROUTES');
          NODE
          for f in shkp-logo.webp shkp-icc.webp shkp-mall.webp; do test -s "dist/images/shkp-user/$f"; done
          test -s dist/curated/v1/jobs.json
          grep -q '/hhba-talent/preview-shkp/assets/' dist/index.html
          mv dist shkp-dist
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser-test SHKP logo, original images, job search, major chips and mobile
        working-directory: apps/web
        env:
          HHBA_PAGES_BASE: '/hhba-talent/preview-shkp/'
        run: |
          mv shkp-dist dist
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/shkp-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/hhba-talent/preview-shkp/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/shkp-14.browser.mjs
          mv dist shkp-dist
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hhba-shkp-desktop-mobile-qa
          path: apps/web/shkp-review/
          if-no-files-found: ignore
          retention-days: 14
      - name: Build Laifen preview too, so all prior 13 employer pages remain accessible
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
          HHBA_PAGES_BASE: '/hhba-talent/preview-laifen/'
          VITE_HHBA_VERIFIED_SNAPSHOT: '1'
          VITE_HHBA_OVERSEAS_CURATED_100: '1'
          VITE_HHBA_DOMESTIC_REBUILD_V2: '1'
          VITE_HHBA_ACCOUNT_API_ENABLED: '0'
          VITE_DEMO_ACCOUNT_ENABLED: '0'
        run: |
          npm run build
          cp dist/index.html dist/404.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const jobs=JSON.parse(fs.readFileSync('src/data/domesticLaifenSourcedRoles20261030.json','utf8')).jobs;
          const routes=['companies/autumn/cn-autumn-009','candidate/jobs',...jobs.map(j=>'candidate/jobs/cn-v2-laifen-'+j.id)];
          for(const route of routes){fs.mkdirSync('dist/'+route,{recursive:true});fs.copyFileSync('dist/index.html','dist/'+route+'/index.html')}
          fs.writeFileSync('dist/.nojekyll','');
          NODE
          test -s dist/images/laifen-user/laifen-logo.webp
          test -s dist/images/laifen-user/laifen-dryer.webp
          test -s dist/images/laifen-user/laifen-toothbrush.webp
          mv dist laifen-dist
      - name: Recover verified prior GitHub Pages artifact (without rewriting root or Anker)
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 40995682305
          github-token: ${{ github.token }}
          path: prior-pages
      - name: Compare live root and Anker to preserved artifact; add only separate previews
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find prior-pages -type f -name 'artifact.tar*' -print -quit)
          test -n "$archive"
          mkdir -p published
          if [[ "$archive" == *.gz ]]; then tar -xzf "$archive" -C published; else tar -xf "$archive" -C published; fi
          test -s published/index.html
          test -s published/preview-anker/index.html
          curl -fsSL --retry 3 --max-time 45 'https://yanm-jun.github.io/hhba-talent/' -o /tmp/hhba-root-before
          curl -fsSL --retry 3 --max-time 45 'https://yanm-jun.github.io/hhba-talent/preview-anker/' -o /tmp/hhba-anker-before
          cmp published/index.html /tmp/hhba-root-before
          cmp published/preview-anker/index.html /tmp/hhba-anker-before
          mkdir -p published/preview-shkp published/preview-laifen
          cp -a apps/web/shkp-dist/. published/preview-shkp/
          cp -a apps/web/laifen-dist/. published/preview-laifen/
          cmp published/index.html /tmp/hhba-root-before
          cmp published/preview-anker/index.html /tmp/hhba-anker-before
          test -s published/preview-shkp/companies/autumn/cn-autumn-010/index.html
          test -s published/preview-shkp/images/shkp-user/shkp-logo.webp
          test -s published/preview-laifen/companies/autumn/cn-autumn-009/index.html
          touch published/.nojekyll
          echo HHBA_ROOT_ANKER_PRESERVED_LAIFEN_AND_SHKP_PREVIEW_ADDED
      - uses: actions/upload-pages-artifact@v3
        with:
          path: published
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: hhba-company200-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live SHKP and Laifen URLs, their images, root and Anker
        run: |
          set -euo pipefail
          root='https://yanm-jun.github.io/hhba-talent'
          for i in 1 2 3 4 5 6; do
            if curl -fsSL "$root/preview-shkp/" -o /tmp/shkp-html &&
               curl -fsSL "$root/preview-shkp/images/shkp-user/shkp-logo.webp" -o /tmp/shkp-logo &&
               curl -fsSL "$root/preview-shkp/images/shkp-user/shkp-icc.webp" -o /tmp/shkp-icc &&
               curl -fsSL "$root/preview-shkp/images/shkp-user/shkp-mall.webp" -o /tmp/shkp-mall &&
               curl -fsSL "$root/preview-laifen/companies/autumn/cn-autumn-009/" -o /tmp/laifen-html; then break; fi
            if [ "$i" = 6 ]; then exit 1; fi
            sleep 10
          done
          grep -q '/hhba-talent/preview-shkp/assets/' /tmp/shkp-html
          grep -q '/hhba-talent/preview-laifen/assets/' /tmp/laifen-html
          test $(wc -c </tmp/shkp-logo) -gt 3000
          test $(wc -c </tmp/shkp-icc) -gt 9000
          test $(wc -c </tmp/shkp-mall) -gt 15000
          curl -fsSL "$root/" -o /tmp/root-live
          curl -fsSL "$root/preview-anker/" -o /tmp/anker-live
          grep -q '/hhba-talent/assets/' /tmp/root-live
          grep -q '/hhba-talent/preview-anker/assets/' /tmp/anker-live
          echo HHBA_SHKP_LAIFEN_ONLINE_ROOT_ANKER_UNTOUCHED
