name: HHBA Apply Credits Product and Payment Safety
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/pages/PersonalCenterPage.tsx'
      - 'apps/web/src/components/ApplyAssistantProduct.tsx'
      - 'apps/web/src/services/applyCredits.ts'
      - 'apps/web/src/styles/apply-assistant-product.css'
      - 'apps/web/functions/api/apply/**'
      - 'apps/web/functions/_lib/apply-billing.js'
      - 'apps/web/functions/_lib/apply-credit-ledger.js'
      - 'apps/web/functions/_lib/apply-payment-reconciliation.js'
      - 'apps/web/functions/_lib/apply-ai-suggest.js'
      - 'apps/web/functions/_lib/apply-ai-runtime.js'
      - 'apps/web/functions/_lib/apply-ai-usage.js'
      - 'apps/web/d1/0013_apply_ai_usage_audit.sql'
      - 'apps/web/scripts/apply-ai-v06.contract.test.mjs'
      - 'apps/web/functions/_lib/apply-extension-pairing.js'
      - 'apps/web/d1/0012_apply_extension_pairing.sql'
      - 'apps/web/scripts/apply-pairing.contract.test.mjs'
      - 'apps/web/d1/0010_apply_refund_requests.sql'
      - 'apps/web/d1/0011_apply_ai_requests.sql'
      - 'apps/web/scripts/apply-payments-v2.contract.test.mjs'
      - 'apps/web/scripts/apply-ai-v05.contract.test.mjs'
      - 'apps/browser-extension/**'
      - 'apps/web/d1/0009_apply_credits_orders.sql'
      - 'apps/web/scripts/apply-credits*'
      - 'apps/web/scripts/apply_credits_schema_test.py'
      - 'apps/web/scripts/candidate-apply-assistant-workbench.contract.test.mjs'
      - '.github/workflows/hhba-apply-credits-product.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-commerce-foundations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked web packages
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Check APIs, payment signature rules and workbench links
        working-directory: apps/web
        run: |
          node --check 'functions/_lib/apply-billing.js'
          node --check 'functions/_lib/apply-credit-ledger.js'
          node --check 'functions/_lib/apply-payment-reconciliation.js'
          node --check 'functions/_lib/apply-ai-suggest.js'
          node --check 'functions/_lib/apply-ai-runtime.js'
          node --check 'functions/_lib/apply-ai-usage.js'
          node --check 'functions/_lib/apply-extension-pairing.js'
          node --check 'functions/api/apply/[[path]].js'
          node --test scripts/apply-credits.contract.test.mjs scripts/apply-payments-v2.contract.test.mjs scripts/apply-ai-v05.contract.test.mjs scripts/apply-ai-v06.contract.test.mjs scripts/apply-pairing.contract.test.mjs scripts/candidate-apply-assistant-workbench.contract.test.mjs
      - name: Verify the additive D1 schema with SQLite
        working-directory: apps/web
        run: python3 scripts/apply_credits_schema_test.py
      - name: Compile TypeScript and build the current UI
        working-directory: apps/web
        run: npm run build

  verify-browser-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify extension JavaScript and low-risk autofill contracts
        working-directory: apps/browser-extension
        run: |
          node --check content.js
          node --check popup.js
          node --check account.mjs
          node --check core.mjs
          node --test tests/core.test.mjs tests/quickfill.contract.test.mjs tests/account.contract.test.mjs tests/ai-map.contract.test.mjs
      - name: Install Chromium and Playwright for actual DOM acceptance
        run: |
          python3 -m pip install --quiet --disable-pip-version-check 'playwright>=1.55,<2'
          python3 -m playwright install --with-deps chromium
      - name: Verify synthetic recruitment page fill, events, sensitive-field skips, undo
        working-directory: apps/browser-extension
        run: timeout 90s python3 -u tests/browser_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hhba-apply-v05-browser-acceptance
          path: /tmp/hhba-domestic-apply-browser.png
          if-no-files-found: ignore
          retention-days: 7
