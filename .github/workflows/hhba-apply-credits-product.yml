name: HHBA Apply Credits Product and Payment Safety
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/pages/PersonalCenterPage.tsx'
      - 'apps/web/src/components/ApplyAssistantProduct.tsx'
      - 'apps/web/src/services/applyCredits.ts'
      - 'apps/web/src/styles/apply-assistant-product.css'
      - 'apps/web/functions/api/apply/**'
      - 'apps/web/functions/_lib/apply-billing.js'
      - 'apps/web/functions/_lib/apply-credit-ledger.js'
      - 'apps/web/functions/_lib/apply-payment-reconciliation.js'
      - 'apps/web/functions/_lib/apply-ai-suggest.js'
      - 'apps/web/functions/_lib/apply-extension-pairing.js'
      - 'apps/web/functions/_lib/apply-profile-sync.js'
      - 'apps/web/d1/0014_apply_profile_sync.sql'
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
      - 'apps/web/src/services/pdfProfile.mjs'
      - 'apps/web/src/services/pdfProfile.d.mts'
      - 'apps/web/scripts/apply-pdf-local.contract.test.mjs'
      - 'apps/web/scripts/pdf-browser-e2e.py'
      - 'apps/web/src/services/docxProfile.mjs'
      - 'apps/web/src/services/docxProfile.d.mts'
      - 'apps/web/src/components/ApplyResumeSync.tsx'
      - 'apps/web/src/styles/apply-resume-sync.css'
      - 'apps/web/scripts/apply-profile-sync.contract.test.mjs'
      - 'apps/web/scripts/apply-edge-sync-http.contract.test.mjs'
      - 'apps/web/scripts/apply-pairing-real-flow.contract.test.mjs'
      - 'apps/web/scripts/apply-profile-janitor.contract.test.mjs'
      - 'apps/web/workers/apply-profile-transfer-janitor.js'
      - 'apps/web/scripts/apply-docx-local.contract.test.mjs'
      - 'apps/web/d1/0012_apply_extension_pairing.sql'
      - 'apps/web/scripts/apply-pairing.contract.test.mjs'
      - 'apps/web/d1/0010_apply_refund_requests.sql'
      - 'apps/web/d1/0011_apply_ai_requests.sql'
      - 'apps/web/scripts/apply-payments-v2.contract.test.mjs'
      - 'apps/web/scripts/apply-ai-v05.contract.test.mjs'
      - 'apps/browser-extension/**'
      - 'apps/web/d1/0009_apply_credits_orders.sql'
      - 'apps/web/scripts/apply-credits*'
      - 'apps/web/scripts/apply_credits_schema_test.py'
      - 'apps/web/scripts/candidate-apply-assistant-workbench.contract.test.mjs'
      - '.github/workflows/hhba-apply-credits-product.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-commerce-foundations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked web packages
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Check APIs, payment signature rules and workbench links
        working-directory: apps/web
        run: |
          node --check 'functions/_lib/apply-billing.js'
          node --check 'functions/_lib/apply-credit-ledger.js'
          node --check 'functions/_lib/apply-payment-reconciliation.js'
          node --check 'functions/_lib/apply-ai-suggest.js'
          node --check 'functions/_lib/apply-extension-pairing.js'
          node --check 'functions/_lib/apply-profile-sync.js'
          node --check 'workers/apply-profile-transfer-janitor.js'
          node --check 'src/services/pdfProfile.mjs'
          node --check 'functions/api/apply/[[path]].js'
          node --test scripts/apply-credits.contract.test.mjs scripts/apply-payments-v2.contract.test.mjs scripts/apply-ai-v05.contract.test.mjs scripts/apply-pairing.contract.test.mjs scripts/apply-profile-sync.contract.test.mjs scripts/apply-edge-sync-http.contract.test.mjs scripts/apply-pairing-real-flow.contract.test.mjs scripts/apply-profile-janitor.contract.test.mjs scripts/apply-docx-local.contract.test.mjs scripts/apply-pdf-local.contract.test.mjs scripts/candidate-apply-assistant-workbench.contract.test.mjs
      - name: Verify the additive D1 schema with SQLite
        working-directory: apps/web
        run: python3 scripts/apply_credits_schema_test.py
      - name: Compile TypeScript and build the current UI
        working-directory: apps/web
        run: npm run build

  verify-browser-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify extension JavaScript and low-risk autofill contracts
        working-directory: apps/browser-extension
        run: |
          node --check content.js
          node --check popup.js
          node --check account.mjs
          node --check core.mjs
          node --test tests/core.test.mjs tests/quickfill.contract.test.mjs tests/account.contract.test.mjs tests/ai-map.contract.test.mjs tests/edge-preview-stage.test.mjs
      - name: Audit Microsoft Edge manifest, icons and permission scope
        working-directory: apps/browser-extension
        run: node scripts/edge-package-audit.mjs
      - name: Package exact reviewed extension sources for store pre-submission testing
        working-directory: apps/browser-extension
        run: |
          zip -q -j "$RUNNER_TEMP/hhba-edge-extension-p0-review.zip" manifest.json popup.html popup.css popup.js core.mjs content.js account.mjs
          zip -q "$RUNNER_TEMP/hhba-edge-extension-p0-review.zip" icons/icon16.png icons/icon32.png icons/icon48.png icons/icon128.png
          unzip -t "$RUNNER_TEMP/hhba-edge-extension-p0-review.zip"
          unzip -l "$RUNNER_TEMP/hhba-edge-extension-p0-review.zip" | grep 'icons/icon128.png'
      - name: Upload P0 review-only extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: hhba-edge-extension-p0-review
          path: ${{ runner.temp }}/hhba-edge-extension-p0-review.zip
          if-no-files-found: error
          retention-days: 14
      - name: Install Chromium and Playwright for actual DOM acceptance
        run: |
          python3 -m pip install --quiet --disable-pip-version-check 'playwright>=1.55,<2'
          python3 -m playwright install --with-deps chromium
      - name: Install locked web packages for real Chromium PDF.js worker acceptance
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Verify real Chromium and Vite local PDF worker
        working-directory: apps/web
        run: timeout 95s python3 -u scripts/pdf-browser-e2e.py
      - name: Verify synthetic recruitment page fill, events, sensitive-field skips, undo
        working-directory: apps/browser-extension
        run: timeout 90s python3 -u tests/browser_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hhba-apply-v05-browser-acceptance
          path: /tmp/hhba-domestic-apply-browser.png
          if-no-files-found: ignore
          retention-days: 7
