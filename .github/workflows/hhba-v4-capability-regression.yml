name: HHBA V4 capability regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/functions/_lib/v4-*.js'
      - 'services/match-background/**'
      - 'apps/web/functions/_lib/simple-match-v4.js'
      - 'apps/web/functions/api/match-v4/**'
      - 'apps/web/src/components/MatchResearchPanels.tsx'
      - 'apps/web/functions/_lib/ai-token-usage.js'
      - 'apps/web/scripts/ai-token-usage.test.mjs'
      - 'apps/web/scripts/simple-match-v4.contract.test.mjs'
      - 'apps/web/scripts/v4-session-match-task.test.mjs'
      - 'apps/web/scripts/v4-search-expansion.test.mjs'
      - 'apps/web/scripts/v4-parallel-discovery.test.mjs'
      - 'apps/web/scripts/v4-job-work-queue.test.mjs'
      - 'apps/web/scripts/v4-job-executor.test.mjs'
      - 'apps/web/scripts/v4-job-locator.test.mjs'
      - 'apps/web/scripts/v4-independent-job-delivery.test.mjs'
      - 'apps/web/scripts/v4-readonly-progress.test.mjs'
      - 'apps/web/src/services/resumeMatch.ts'
      - 'apps/web/scripts/v4-job-ops-metrics.test.mjs'
      - 'apps/web/d1/20261127_v4_job_ops_daily.sql'
      - 'apps/web/functions/api/admin/metrics.js'
      - 'apps/admin-preview/dashboard.js'
      - 'apps/admin-preview/index.html'
      - 'apps/web/scripts/v4-search-speed.test.mjs'
      - 'apps/web/d1/20261126_v4_job_work_queue.sql'
      - 'apps/web/d1/20261127_v4_search_speed_runs.sql'
      - '.github/workflows/hhba-v4-capability-regression.yml'
permissions:
  contents: read
jobs:
  v4-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test apps/web/scripts/ai-token-usage.test.mjs apps/web/scripts/v4-search-expansion.test.mjs apps/web/scripts/v4-parallel-discovery.test.mjs apps/web/scripts/simple-match-v4.contract.test.mjs apps/web/scripts/v4-session-match-task.test.mjs apps/web/scripts/v4-stage-workflows.test.mjs apps/web/scripts/v4-job-work-queue.test.mjs apps/web/scripts/v4-job-executor.test.mjs apps/web/scripts/v4-job-locator.test.mjs apps/web/scripts/v4-independent-job-delivery.test.mjs apps/web/scripts/v4-readonly-progress.test.mjs apps/web/scripts/v4-job-ops-metrics.test.mjs apps/web/scripts/v4-search-speed.test.mjs services/match-background/runner.test.mjs
      - working-directory: apps/web
        run: npm ci --ignore-scripts && npm run build
