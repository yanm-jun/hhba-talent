name: HHBA All Companies Verified Registry
on:
  push:
    branches: [feat/all-companies-registry-profiles-20261020]
    paths:
      - 'apps/web/**'
      - 'ops/legacy-marketplace/**'
      - '.github/workflows/hhba-all-companies-registry.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'ops/legacy-marketplace/**'
      - '.github/workflows/hhba-all-companies-registry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Locked dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Company identity, source verification, review queue and navigation contracts
        working-directory: apps/web
        run: |
          node --test scripts/all-companies-registry.contract.test.mjs
          node --test scripts/complete-50-company-profiles.test.mjs
          node --test scripts/company-visual-media.contract.test.mjs
          node --test scripts/company-profiles.contract.test.mjs
          node --test scripts/job-origin-navigation.contract.test.mjs
          node --test scripts/white-market-detail.contract.test.mjs
      - name: Build production Railway UI with typed dynamic routes
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '0'
          VITE_HHBA_VERIFIED_SNAPSHOT: '1'
          VITE_HHBA_ACCOUNT_API_ENABLED: '0'
        run: |
          npm run build
          test -s dist/index.html
          test -s dist/brands/openai.svg
          test -s dist/brands/claude.svg
          test -s dist/brands/spacex.svg
