name: Chongqing V5.1 independent verification
on:
  push:
    branches: [feature/talent-chongqing]
  pull_request:
    paths:
      - 'apps/web/src/data/chongqing*.ts'
      - 'apps/web/scripts/test-chongqing-city-v51.mjs'
      - 'apps/web/src/pages/TalentServiceRoutes.tsx'
      - '.github/workflows/hhba-chongqing-branch-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-chongqing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Test Chongqing city V5.1
        working-directory: apps/web
        run: node --experimental-strip-types scripts/test-chongqing-city-v51.mjs
      - name: National V5.1 contract regression
        working-directory: apps/web
        run: node --experimental-strip-types scripts/test-talent-city-contract-v51.mjs
      - name: Build HHBA static web
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
          HHBA_PAGES_BASE: '/hhba-talent/'
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: chongqing-v51-static
          path: apps/web/dist/
          retention-days: 14
          if-no-files-found: error
