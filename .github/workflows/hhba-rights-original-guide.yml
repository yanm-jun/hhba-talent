name: HHBA original labor-rights knowledge and workplace guide
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/pages/LegalAidLandingPage.tsx'
      - 'apps/web/src/pages/WorkValueGuidePage.tsx'
      - 'apps/web/src/data/hhbaWorkValueGuide.ts'
      - 'apps/web/src/data/laborRightsSubtopics.json'
      - 'apps/web/src/data/laborRightsBrowseGroups.json'
      - 'apps/web/src/data/laborRightsSearchIntents.json'
      - 'apps/web/src/data/laborRightsQueryFixtures.json'
      - 'apps/web/src/pages/LegalAidTopicPage.tsx'
      - 'apps/web/src/pages/LegalAidSubtopicPage.tsx'
      - 'apps/web/src/styles/hhba-work-value-guide.css'
      - 'apps/web/src/main.tsx'
      - 'apps/web/src/components/Shell.tsx'
      - 'apps/web/src/services/siteSearchIndex.ts'
      - 'apps/web/scripts/hhba-rights-guide.contract.test.mjs'
      - 'apps/web/scripts/hhba-rights-guide-v2.contract.test.mjs'
      - 'apps/web/scripts/rights-v2-intent-deeplink.contract.test.mjs'
      - 'apps/web/scripts/rights-query-quality.contract.test.mjs'
      - 'apps/web/scripts/rights-knowledge-categories.contract.test.mjs'
      - 'apps/web/scripts/rights_guide_browser_acceptance.py'
      - 'apps/web/scripts/audit-labor-rights-topics.mjs'
      - '.github/workflows/hhba-rights-original-guide.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-rights-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Audit eight full topics and twelve source-backed detailed topics
        working-directory: apps/web
        run: node scripts/audit-labor-rights-topics.mjs
      - name: Test 200 guide entries, twenty knowledge topics and safe local search
        working-directory: apps/web
        run: |
          node --test scripts/hhba-rights-guide-v2.contract.test.mjs \
            scripts/rights-v2-intent-deeplink.contract.test.mjs \
            scripts/rights-query-quality.contract.test.mjs \
            scripts/rights-knowledge-categories.contract.test.mjs \
            scripts/home-workplace-promise.contract.test.mjs \
            scripts/membership-rules.contract.test.mjs \
            scripts/site-search.contract.test.mjs
      - name: Verify production TypeScript and Vite build
        working-directory: apps/web
        run: npm run build
      - name: Install browser for real public knowledge acceptance
        run: |
          python3 -m pip install 'playwright>=1.55,<2'
          python3 -m playwright install --with-deps chromium
      - name: Exercise public rights and guide on desktop and mobile
        working-directory: apps/web
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/hhba-rights-v2-preview.log 2>&1 &
          python3 scripts/rights_guide_browser_acceptance.py
      - name: Save public knowledge mobile and desktop snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hhba-rights-guide-browser-acceptance
          path: apps/web/tmp/rights-guide-screens/*.png
          if-no-files-found: warn
          retention-days: 14
