name: HHBA Admin-Owned DeepSeek Resume Match Browser Acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hhba-platform-resume-ai-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-disabled-public-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/github-pages-white-preview-20261019
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium browser runner
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Verify latest white HHBA Pages uses admin-owned DeepSeek only with safe disabled uploads
        run: python scripts/check_platform_resume_matching_preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hhba-platform-deepseek-resume-mobile
          path: /tmp/hhba-ai-resume-matching-mobile.png
          retention-days: 14
          if-no-files-found: ignore
