name: HHBA Broadex 038 isolated four-panel preview
on:
  push:
    branches: [feature/employer-broadex-038]
    paths:
      - 'apps/web/src/data/employerProfiles/cn-autumn-038.json'
      - 'apps/web/src/pages/UnifiedV2CompanyPage.tsx'
      - 'apps/web/scripts/broadex038-v2.contract.test.mjs'
      - 'apps/web/scripts/prepare-broadex038-media.py'
      - '.github/workflows/hhba-broadex038-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out only the company branch
        uses: actions/checkout@v4
        with:
          ref: feature/employer-broadex-038
          persist-credentials: true
      - name: Install image audit dependencies
        run: python -m pip install pillow beautifulsoup4 cairosvg
      - name: Package current genuine logo and two independent historical business photos
        run: python apps/web/scripts/prepare-broadex038-media.py
      - name: Pin audited local assets and hashes to feature branch, never main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/images/employer-profiles/cn-autumn-038
          if ! git diff --cached --quiet; then
            git commit -m "assets(broadex038): pin verified EverProX logo and two real photographs"
            git push origin HEAD:feature/employer-broadex-038
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install exact production dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Enforce all four panels, role matching and verified local photos
        working-directory: apps/web
        run: node scripts/broadex038-v2.contract.test.mjs
      - name: Diagnose inherited global factory failures (separate legacy media issue)
        working-directory: apps/web
        continue-on-error: true
        run: node scripts/employer-factory-check.mjs
      - name: Compile the entire HHBA V2 static site without modifying design
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
          HHBA_PAGES_BASE: '/hhba-talent/'
          VITE_HHBA_DOMESTIC_REBUILD_V2: '1'
        run: npm run build
      - name: Verify complete separate binary files inside built static site
        run: |
          test -s apps/web/dist/index.html
          test -s apps/web/dist/images/employer-profiles/cn-autumn-038/logo.png
          test -s apps/web/dist/images/employer-profiles/cn-autumn-038/photo1.jpg
          test -s apps/web/dist/images/employer-profiles/cn-autumn-038/photo2.jpg
      - name: Upload isolated full-site static preview artifact (never deploy main Pages)
        uses: actions/upload-artifact@v4
        with:
          name: hhba-broadex-038-four-panel-static-preview
          path: apps/web/dist/
          retention-days: 14
          if-no-files-found: error
