name: HHBA employers 099-101 V2 source-backed static review
on:
  push:
    branches: [feature/employers-099-101-v2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hhba-employers-099-101-independent-review
  cancel-in-progress: true
jobs:
  static-review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image-source auditing dependency
        run: python -m pip install --quiet Pillow
      - name: Audit historic corporate photographs and keep non-real fallback if sources fail
        working-directory: apps/web
        run: python scripts/prepare-employers-099-101-evidence-media.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install reproducible dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Verify 099-101 exact sources, professional job filtering, no fake claims
        working-directory: apps/web
        run: |
          node scripts/employers-099-101-v2.contract.test.mjs
          node scripts/employer-job-level-search.contract.test.mjs
          node scripts/major-direct-role-results.contract.test.mjs
          node scripts/recruitment-market-source-invalid.regression.test.mjs
          node scripts/hhba-unified-static.contract.test.mjs
      - name: Build existing V2 site and create per-company deep links, never touch production Pages
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
          HHBA_PAGES_BASE: '/hhba-talent/'
          VITE_HHBA_DOMESTIC_REBUILD_V2: '1'
        run: |
          npm run build
          node scripts/materialize-company-route-entries.mjs
      - name: Verify public static artifact and correct local image paths
        run: |
          test -s apps/web/dist/index.html
          for id in 099 100 101; do
            test -s "apps/web/dist/companies/autumn/cn-autumn-$id/index.html"
            test -s "apps/web/dist/images/employer-profiles/cn-autumn-$id/logo.svg"
            test -s "apps/web/dist/images/employer-profiles/cn-autumn-$id/media-sources.json"
            test -s "apps/web/dist/images/employer-profiles/cn-autumn-$id/photo1.svg"
            test -s "apps/web/dist/images/employer-profiles/cn-autumn-$id/photo2.svg"
          done
      - name: Upload complete reviewable branch static website without GitHub Pages deployment
        uses: actions/upload-artifact@v4
        with:
          name: hhba-employers-099-101-independent-static-review
          path: apps/web/dist/
          retention-days: 14
          if-no-files-found: error
      - name: Upload photo copyright and historical evidence manifests
        uses: actions/upload-artifact@v4
        with:
          name: hhba-employers-099-101-photo-source-audit
          path: |
            apps/web/public/images/employer-profiles/cn-autumn-099/media-sources.json
            apps/web/public/images/employer-profiles/cn-autumn-100/media-sources.json
            apps/web/public/images/employer-profiles/cn-autumn-101/media-sources.json
            docs/HHBA_EMPLOYERS_099_101_SOURCE_AUDIT_20261103.md
          retention-days: 30
          if-no-files-found: error
