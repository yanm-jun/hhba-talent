      - name: Verify Taian V5.1 city policy, rental eligibility and official process guides
        working-directory: apps/web
        run: node --experimental-strip-types scripts/test-taian-city-v51.mjs
      - name: Verify Dezhou V5.1 current policies, historical settlement, housing programs and unverified apartments
        working-directory: apps/web
