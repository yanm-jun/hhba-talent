      - name: Enforce 95-record unified talent template, truthful quality grades and Laoshan complete application workflow
        working-directory: apps/web
        run: node --experimental-strip-types scripts/test-talent-standard-v5.mjs
      - name: Verify Linyi V5.1 city policies and expired housing inventory
        working-directory: apps/web
        run: node --experimental-strip-types scripts/test-linyi-city-v51.mjs
      - name: Verify Zibo V5.1 official policy, 2026 housing batches and shared guides
        working-directory: apps/web
