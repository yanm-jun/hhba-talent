name: HHBA White Site GitHub Pages Preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hhba-github-pages-preview.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 0,12 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: hhba-github-pages-preview
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/github-pages-white-preview-20261019
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Enforce white-only current/archive cards, internal JD reader, and verified Apply button
        working-directory: apps/web
        run: node --test scripts/white-market-detail.contract.test.mjs
      - name: Build HHBA with consent-first candidate applications, employer review progress and separate official ATS listings
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
          # Public HTTPS backend ORIGIN only. Never put a DeepSeek credential here.
          VITE_HHBA_MATCH_API_ORIGIN: ${{ vars.HHBA_MATCH_API_ORIGIN }}
        run: npm run build
      - name: Verify public HHBA join-us page, application demo privacy and career disclosure
        working-directory: apps/web
        run: node --test scripts/join-us.contract.test.mjs
      - name: Refresh complete white HHBA job index from 50 verified official ATS boards
        working-directory: apps/web
        run: node scripts/prepare-pages-jobs.mjs
      - name: Verify official JD and Chinese structured search regression cases
        working-directory: apps/web
        run: node --test scripts/audit-all-official-jds.test.mjs scripts/job-search-facets.test.mjs
      - name: Audit ALL jobs, compare official JD changes and verify requirements
        working-directory: apps/web
        run: node scripts/audit-all-official-jds.mjs
      - name: Validate all-job source-grounded search metadata and its exact feed timestamp
        working-directory: apps/web
        run: |
          node -e "
          const fs=require('fs');
          const feed=JSON.parse(fs.readFileSync('dist/data/jobs.json','utf8'));
          const facets=JSON.parse(fs.readFileSync('dist/data/job-search-facets.json','utf8'));
          if(facets.kind!=='HHBA_OFFICIAL_JD_SEARCH_FACETS_V1'||facets.indexed_as_of!==feed.updated)
            throw Error('SEARCH_METADATA_SNAPSHOT_MISMATCH');
          if(facets.total_indexed_jobs!==feed.total||facets.jobs.length!==facets.extracted_count)
            throw Error('SEARCH_METADATA_INCOMPLETE');
          if(facets.extracted_count<8000)throw Error('MISSING_GLOBAL_ATS_SEARCH_FACETS');
          if(facets.jobs.some(j=>typeof j.original_source_hash!=='string'||j.original_source_hash.length!==64))
            throw Error('INVALID_OFFICIAL_JD_EVIDENCE_HASH');
          console.log('HHBA_REAL_GLOBAL_SEARCH_FACETS',JSON.stringify({
            indexed:feed.total,officialJdFacets:facets.extracted_count,updated:feed.updated
          }));
          "
      - name: Preserve per-job evidence states without copying copyrighted JD
        uses: actions/upload-artifact@v4
        with:
          name: hhba-full-jd-sync-report
          path: |
            apps/web/dist/data/job-sync-status.json
            apps/web/dist/data/job-sync-summary.json
            apps/web/dist/data/job-search-facets.json
          retention-days: 30
          if-no-files-found: error
      - name: Verify Airtable official JD and the green Chinese reader bridge
        working-directory: apps/web
        run: node scripts/verify-official-jd.mjs
      - name: Verify stale or withdrawn official jobs cannot appear in active results
        run: |
          node -e "const fs=require('fs');const x=fs.readFileSync('apps/web/src/services/liveRecruitment.ts','utf8');if(!x.includes('MISSING_FROM_OFFICIAL_BOARD')||!x.includes('OFFICIAL_URL_CHANGED')||!x.includes('loadPublicJobAudit'))process.exit(1)"
      - name: Check Chinese/English and original entry routes
        run: node scripts/verify-dual-entry.mjs
      - name: Enable deep-link reload fallback
        working-directory: apps/web
        run: cp dist/index.html dist/404.html
      - name: Checkout admin UI from the dedicated, non-production preview branch
        uses: actions/checkout@v4
        with:
          ref: feat/admin-investor-console-phase2-20261021
          path: _hhba_admin_source
          persist-credentials: false
      - name: Check admin static preview security and functional contracts
        run: |
          node --check _hhba_admin_source/apps/admin-preview/dashboard.js
          node --check _hhba_admin_source/apps/admin-preview/metrics.mjs
          node --check _hhba_admin_source/apps/admin-preview/phase2-metrics.mjs
          node --test _hhba_admin_source/apps/admin-preview/tests/*.test.mjs
      - name: Embed public-only admin static preview at /hhba-talent/admin-preview/
        run: |
          mkdir -p apps/web/dist/admin-preview/data
          cp _hhba_admin_source/apps/admin-preview/index.html \
             _hhba_admin_source/apps/admin-preview/styles.css \
             _hhba_admin_source/apps/admin-preview/dashboard.js \
             _hhba_admin_source/apps/admin-preview/favicon.svg \
             apps/web/dist/admin-preview/
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const root='apps/web/dist/admin-preview/';
          let html=readFileSync(root+'index.html','utf8');
          for(const [oldPath,newPath] of [
            ['href="/styles.css"','href="./styles.css"'],
            ['src="/dashboard.js"','src="./dashboard.js"'],
            ['href="/favicon.svg"','href="./favicon.svg"']
          ]){
            if(!html.includes(oldPath))throw Error('ADMIN_ASSET_REFERENCE_CHANGED');
            html=html.replaceAll(oldPath,newPath);
          }
          // The local-only development copy must never be labelled as protected on public Pages.
          html=html.replaceAll('本地只读开发预览','GitHub Pages 公开只读演示')
            .replaceAll('内部开发预览','公开静态演示')
            .replaceAll('本地开发模式','公开只读模式')
            .replaceAll('本地预览','静态预览');
          writeFileSync(root+'index.html',html);
          let js=readFileSync(root+'dashboard.js','utf8');
          if(!js.includes("fetch('/api/overview'"))throw Error('ADMIN_ENDPOINT_CHANGED');
          js=js.replace("fetch('/api/overview'","fetch('./data/overview.json'");
          writeFileSync(root+'dashboard.js',js);
          if(!js.includes("fetch('./data/overview.json'"))throw Error('ADMIN_STATIC_TRANSFORM_FAILED');
          NODE
      - name: Capture phase 2 metrics from SAME built public listing and official JD audit
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {buildPhase2Overview} from './_hhba_admin_source/apps/admin-preview/phase2-metrics.mjs';
          const root='apps/web/dist/data/';
          let result;
          try {
            const feed=JSON.parse(readFileSync(root+'jobs.json','utf8'));
            const audit=JSON.parse(readFileSync(root+'job-sync-status.json','utf8'));
            result=buildPhase2Overview(feed,audit);
          } catch(error) {
            console.warn('ADMIN_PHASE2_SOURCE_UNAVAILABLE',error.message);
            result={kind:'HHBA_PUBLIC_RECRUITMENT_OVERVIEW_V2',
              sourceType:'PUBLIC_PAGES_FEED_AND_OFFICIAL_JD_AUDIT',
              quality:'unavailable',asOf:null,observedAt:new Date().toISOString(),
              auditCheckedAt:null,counts:{indexedJobs:null,displayableJobs:null,
                auditedJobRequirements:null,distinctIndexedCompanies:null,
                checkedAtsSources:null,failedAtsSources:null,
                unclassifiedOrUnverifiedJobs:null},
              definitions:{},future:{totalRegisteredUsers:null,activeUsers30d:null,
                applyOutboundClicks:null,revenueCny:null,retention30d:null,trafficSeries:null}};
          }
          // Public snapshot: allow only safe, aggregated metrics (never user data).
          const allowed=new Set(['kind','source','sourceType','asOf','observedAt','auditCheckedAt',
            'quality','counts','definitions','future']);
          for(const key of Object.keys(result))if(!allowed.has(key))throw Error('UNEXPECTED_ADMIN_FIELD');
          writeFileSync('apps/web/dist/admin-preview/data/overview.json',JSON.stringify(result));
          NODE
          node --check apps/web/dist/admin-preview/dashboard.js
          test -s apps/web/dist/admin-preview/index.html
          test -s apps/web/dist/admin-preview/data/overview.json
      - name: Verify newest unified admin preview is truly public-safe and fully static
        run: |
          node --check apps/web/dist/preview-admin/dashboard.js
          node --check apps/web/dist/preview-admin/unified-workbench.js
          node --input-type=module <<'NODE'
          import {readFileSync,existsSync} from 'node:fs';
          const root='apps/web/dist/preview-admin/';
          for (const file of ['index.html','styles.css','unified-workbench.css',
              'favicon.svg','dashboard.js','unified-workbench.js',
              'data/jobs.json','data/growth.json','data/workspace.json']) {
            if (!existsSync(root+file)) throw Error('MISSING_ADMIN_PREVIEW_FILE:'+file);
          }
          const html=readFileSync(root+'index.html','utf8');
          const dashboard=readFileSync(root+'dashboard.js','utf8');
          const workspaceUi=readFileSync(root+'unified-workbench.js','utf8');
          if (!html.includes('GitHub Pages 静态预览') ||
              html.includes('action="/management/logout"') ||
              !dashboard.includes("fetch('./data/jobs.json'") ||
              !dashboard.includes("fetch('./data/growth.json?'+params") ||
              !workspaceUi.includes("fetch('./data/workspace.json'") ||
              dashboard.includes("fetch('/api/admin/") ||
              workspaceUi.includes("fetch('/api/admin/"))
            throw Error('ADMIN_PREVIEW_PRIVATE_SERVICE_LEAK');
          for(const file of ['jobs.json','growth.json','workspace.json']){
            const data=JSON.parse(readFileSync(root+'data/'+file,'utf8'));
            if(file==='jobs.json'&&(data.quality!=='unavailable'||
               data.counts.displayableJobs!==null))throw Error('FAKE_JOB_TOTAL');
            if(file==='growth.json'&&(data.traffic.quality!=='unavailable'||
               data.bookmarks.quality!=='unavailable'))throw Error('FAKE_PRIVATE_METRICS');
            if(file==='workspace.json'&&(data.productionReviewerAuth!=='not_connected'||
               !data.modules.every(x=>x.pending===null&&!x.reviewAllowed)))
              throw Error('UNAUTHORIZED_REVIEWER_STATE');
          }
          console.log('HHBA_PUBLIC_STATIC_ADMIN_PREVIEW_VERIFIED',root);
          NODE
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload exactly the public built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the white HHBA site
        id: deployment
        uses: actions/deploy-pages@v4
