      - name: Verify Heze V5.1 talent, historic home grants and six source-qualified housing leads
        working-directory: apps/web
        run: node --experimental-strip-types scripts/test-heze-city-v51.mjs
      - name: Lock future city template, certify full policy guides and protect 95 historical record IDs
        working-directory: apps/web
        run: node --experimental-strip-types scripts/test-talent-city-contract-v51.mjs
      - name: Test four-municipality talent policy matching, deadlines, exclusions and privacy
