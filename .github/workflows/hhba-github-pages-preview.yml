          test -s apps/web/public/images/employer-profiles/cn-autumn-031/photo1.jpg
          test -s apps/web/public/images/employer-profiles/cn-autumn-031/photo2.jpg
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Validate source-backed talent policies and housing records
        working-directory: apps/web
        run: node scripts/audit-talent-service.mjs
      - name: Validate nationwide 297 city codes, province filters and city-search aliases
