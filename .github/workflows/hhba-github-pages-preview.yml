      - name: Validate detailed Shandong 16-city guides, historical rules and payment subjects
        working-directory: apps/web
        run: node --experimental-strip-types scripts/test-talent-shandong-depth.mjs
      - name: Validate Jinan-only compact policy layout preview and A/B isolation
        working-directory: apps/web
