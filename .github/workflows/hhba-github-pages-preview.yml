name: HHBA Unified Static Site GitHub Pages
# Domestic V2: legacy domestic job/channel entries removed from the public MARKET; 100 overseas curated roles preserved.
# Old employer content and original photos remain archived in Git for rebuilding one company at a time.
# KPMG + Schneider Electric: four-block pages, exact logos and two independently generated labeled AI images per company.
# 2026-10-29: Schneider alt text repaired, rerun full static build and source-backed logo checks.
# KPMG first-employer logo and two labelled independent AI photo assets; QA alt text verified.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hhba-github-pages-preview.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 0,12 * * *'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: hhba-github-pages-preview
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hhba-unified-static-20261025
          # 2026-10-27 branding preview: source now contains user-approved original HHBA SVG and role login UI.
          # The homepage marquee now uses only HHBA local domestic media and exact domestic company profile routes.
          # Public entry cards restored to compact layout; keep three identity paths unchanged.
          # Navigation copy refresh: 企业发现 (without the 200-company count in the tab)
          # 2026-10-28: rebuild static preview with consolidated 200-company discovery navigation.
      - name: Import the first employer's source-backed KPMG trademark SVG
        run: |
          python - <<'PY'
          import pathlib, re, urllib.request, xml.etree.ElementTree as ET
          url='https://upload.wikimedia.org/wikipedia/commons/d/db/KPMG_blue_logo.svg'
          req=urllib.request.Request(url, headers={'User-Agent':'HHBA-Brand-Reference/1.0 (static catalog, educational use)'})
          with urllib.request.urlopen(req,timeout=40) as resp:
              svg=resp.read(100000)
          text=svg.decode('utf-8-sig')
          assert len(svg)>1000 and '<svg' in text and '</svg>' in text, 'KPMG SVG not retrieved'
          assert not re.search(r'<script|<foreignObject|onload\\s*=|onerror\\s*=|javascript:',text,re.I), 'Unsafe source SVG'
          root=ET.fromstring(svg)
          assert root.tag.endswith('svg'), 'Incorrect file type for KPMG logo'
          target=pathlib.Path('apps/web/public/images/autumn-real-logos/cn-autumn-001.svg')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(svg)
          print('KPMG_SOURCE_BACKED_LOGO_READY',len(svg),url)
          PY
      - name: Import source-backed Schneider Electric complete wordmark
        run: |
          python - <<'PY'
          import pathlib, re, urllib.request, xml.etree.ElementTree as ET
          url='https://upload.wikimedia.org/wikipedia/commons/9/95/Schneider_Electric_2007.svg'
          request=urllib.request.Request(url,headers={'User-Agent':'HHBA-Brand-Reference/1.0 (static enterprise identification)'})
          with urllib.request.urlopen(request,timeout=45) as resp:
              svg=resp.read(100000)
          text=svg.decode('utf-8-sig')
          assert 8000<len(svg)<60000 and '<svg' in text and '</svg>' in text,'Full Schneider Electric wordmark missing'
          assert not re.search(r'<script|<foreignObject|onload\s*=|onerror\s*=|javascript:',text,re.I),'Unsafe SVG'
          tree=ET.fromstring(svg)
          assert tree.tag.endswith('svg')
          target=pathlib.Path('apps/web/public/images/autumn-real-logos/cn-autumn-002.svg')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(svg)
          print('SCHNEIDER_SOURCE_BACKED_WORDMARK_READY',len(svg))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Check HHBA people-first homepage float (photo, close, responsive)
        working-directory: apps/web
        run: node --test scripts/home-people-banner.contract.test.mjs
      - name: Check opening envelope, complete public letter and shareable social entry
        working-directory: apps/web
        run: node --test scripts/home-open-letter.contract.test.mjs
      - name: Verify recruitment responsibility, loading truth, and existing applicant and admin flows
        working-directory: apps/web
        run: node --test scripts/recruitment-responsibility.contract.test.mjs
      - name: Protect 200 company identities, original photographs, personal center and employer governance routes
        working-directory: apps/web
        run: |
          node scripts/audit-domestic-company200.mjs
          node scripts/company200-integration.contract.test.mjs
          node scripts/domestic-autumn-market.contract.test.mjs
          node scripts/autumn-company-profiles.contract.test.mjs
          node scripts/autumn-dossier-content.contract.test.mjs
          node scripts/kpmg-deep-editorial.contract.test.mjs
          node scripts/kpmg-recruitment-first.contract.test.mjs
          node scripts/schneider-recruitment-first.contract.test.mjs
          node scripts/domestic-rebuild-v2.contract.test.mjs
          # Retain photo evidence in source for audit; no legacy gallery is rendered in company profiles.
          node scripts/autumn-approved-industry-images.contract.test.mjs
          # Preserve source-backed logos and only genuine per-employer or labeled AI pictures.
          # Batch regression: 156 distinct employer routes + 10 source-backed introductions; preserve registration gate.
          node scripts/audit-labor-rights-topics.mjs
          node --test scripts/hhba-unified-static.contract.test.mjs \
            scripts/home-company-marquee.contract.test.mjs \
            scripts/strict-auth-no-photo-outlinks.behavior.test.mjs \
            scripts/official-recruitment-gate-photos.contract.test.mjs \
            scripts/three-entry-experience.contract.test.mjs \
            scripts/employer-growth.contract.test.mjs \
            scripts/employer-evidence.contract.test.mjs \
            scripts/employee-feedback.contract.test.mjs \
            scripts/employer-scoring.contract.test.mjs \
            scripts/employer-appeals.contract.test.mjs \
            scripts/employer-improvements.contract.test.mjs \
            scripts/employer-publication.contract.test.mjs \
            scripts/employer-aid-commercial.contract.test.mjs
      - name: Retain original recruitment reader, ATS links and authenticated apply guards
        working-directory: apps/web
        run: node --test scripts/white-market-detail.contract.test.mjs scripts/curated-offline.contract.test.mjs scripts/overseas-curated100-unified.contract.test.mjs
      - name: "Build unified HHBA - 200 companies, applicant center, employer governance previews and brand pages"
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
          # Overseas only: use the original 10-company / 100-role JSON catalogue.
          # All domestic jobs, listings, profiles and protected employer modules are unchanged.
          VITE_HHBA_OVERSEAS_CURATED_100: '1'
          # New public market: retain overseas 100; publish only reviewed domestic V2 jobs.
          VITE_HHBA_DOMESTIC_REBUILD_V2: '1'
          VITE_HHBA_ACCOUNT_API_ENABLED: '0'
          VITE_HHBA_RECRUITMENT_RESPONSIBILITY_API_ENABLED: '0'
          VITE_HHBA_EVIDENCE_API_ENABLED: '0'
          VITE_HHBA_EMPLOYEE_FEEDBACK_API_ENABLED: '0'
          VITE_HHBA_SCORING_API_ENABLED: '0'
          VITE_HHBA_APPEALS_API_ENABLED: '0'
          VITE_HHBA_IMPROVEMENTS_API_ENABLED: '0'
          VITE_HHBA_PUBLICATION_API_ENABLED: '0'
          VITE_HHBA_AID_COMMERCIAL_API_ENABLED: '0'
          # Public HTTPS backend ORIGIN only. Never put a DeepSeek credential here.
          VITE_HHBA_MATCH_API_ORIGIN: ${{ vars.HHBA_MATCH_API_ORIGIN }}
        run: npm run build
      - name: Strip obsolete industry-stock galleries from the public Pages bundle
        run: |
          rm -rf apps/web/dist/images/autumn-photo-research
          rm -rf apps/web/dist/images/autumn-industry-references
          rm -f apps/web/dist/data/domestic-autumn-photo-research.json
          rm -f apps/web/dist/data/domestic-autumn-industry-photos.json
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/web/src/pages/AutumnCompanyProfilePage.tsx').read_text()
          assert 'data-company-template="openai"' in p
          assert 'AutumnIndustryReferenceGallery' not in p
          root=Path('apps/web/dist')
          for fragment in ['images/autumn-photo-research','images/autumn-industry-references',
                           'data/domestic-autumn-photo-research.json','data/domestic-autumn-industry-photos.json']:
              assert not (root/fragment).exists(),fragment
          print('HHBA_156_OPENAI_TEMPLATE_AND_NO_LEGACY_PHOTO_GALLERIES_OK')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify server-only recruitment workdays, tenant RBAC, and idempotent canonical event replay
        run: |
          python -m pip install --quiet --disable-pip-version-check -r apps/api/requirements-evidence-dev.txt
          python -m unittest apps.api.tests.test_recruitment_responsibility -v
      - name: Package self-hosted OFL Chinese xingshu font for HHBA homepage
        working-directory: apps/web
        run: |
          python -m pip install --quiet --disable-pip-version-check 'fonttools[woff]' brotli
          python scripts/prepare-home-xingshu-font.py
          python - <<'PY'
          from pathlib import Path
          from fontTools.ttLib import TTFont
          font = Path('dist/fonts/hhba-people-xingshu.woff2')
          license = Path('dist/fonts/OFL-Zhi-Mang-Xing.txt')
          assert font.is_file() and font.read_bytes()[:4] == b'wOF2'
          assert license.is_file() and 'SIL OPEN FONT LICENSE' in license.read_text()
          missing = {ord(ch) for ch in '从人民中来 到人民中去'} - set(TTFont(font).getBestCmap())
          assert not missing, f'Chinese calligraphy glyphs missing: {missing}'
          print('HHBA_XINGSHU_LOCAL_FONT_AND_OFL_OK',font.stat().st_size)
          PY
      - name: Confirm public letter is packaged at a standalone shareable URL
        run: |
          test -s apps/web/dist/letter/index.html
          grep -q 'og:title' apps/web/dist/letter/index.html
          grep -q 'og:image' apps/web/dist/letter/index.html
          grep -q '../?letter=1' apps/web/dist/letter/index.html
          node -e "const fs=require('fs');const html=fs.readFileSync('apps/web/dist/letter/index.html','utf8');if(!html.includes('致每一个认真生活的人')||!html.includes('yanm-jun.github.io/hhba-talent/letter/'))process.exit(1);console.log('HHBA_SHAREABLE_PUBLIC_LETTER_READY')"
      - name: Verify old 100 overseas curated jobs were published without changing domestic source
        working-directory: apps/web
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const j=JSON.parse(fs.readFileSync('dist/curated/v1/jobs.json','utf8'));
          const companies=new Set(j.jobs.map(x=>x.company));
          if(j.jobs.length!==100||companies.size!==10||
            j.jobs.some(x=>!x.editorial?.responsibilities?.length||!x.editorial?.requirements?.length))
            throw Error('CURATED_OVERSEAS_JOBS_OR_DETAILS_MISSING');
          const source=fs.readFileSync('src/services/liveRecruitment.ts','utf8');
          if(!source.includes("const combined=[...overseas,...campus,...existing]")||
             !source.includes("(!OVERSEAS_CURATED_100||job.domestic)"))
            throw Error('DOMESTIC_AND_OVERSEAS_ISOLATION_LOST');
          console.log('HHBA_CURATED_OVERSEAS_100_AND_DOMESTIC_UNCHANGED');
          NODE
      - name: Verify public HHBA join-us page, application demo privacy and career disclosure
        working-directory: apps/web
        run: |
          node --test scripts/hhba-unified-static.contract.test.mjs
          grep -q '为什么是 HHBA？' src/pages/JoinUsPage.tsx
          grep -q '连接更广阔的机会' src/pages/JoinUsPage.tsx
          grep -q 'to="/vision"' src/pages/JoinUsPage.tsx
          grep -q '一个更好的商业社会' src/pages/VisionPage.tsx
          grep -q 'THE WORLD WE ENVISION' src/pages/VisionPage.tsx
          grep -q "route==='/vision'" src/main.tsx
          grep -q '技术负责人 / 全栈架构工程师' src/pages/JoinUsPage.tsx
          grep -q '企业治理与劳动权益研究伙伴' src/pages/JoinUsPage.tsx
          grep -q '薪酬与权益现状' src/pages/JoinUsPage.tsx
          ! grep -q '团队协作场景示意 · 非 HHBA 实际团队成员' src/pages/JoinUsPage.tsx
          ! grep -q '<figcaption>' src/pages/JoinUsPage.tsx
      - name: Confirm selected team photograph is packaged for public Pages
        run: |
          test -s apps/web/dist/images/hhba-people-group-hd.avif
          test -s apps/web/dist/images/hhba-people-group.webp
          node -e "const fs=require('fs');const a=fs.readFileSync('apps/web/dist/images/hhba-people-group-hd.avif');const w=fs.readFileSync('apps/web/dist/images/hhba-people-group.webp');if(a.length<100000||a.toString('ascii',4,12)!=='ftypavif'||w.length<150000||w.toString('ascii',0,4)!=='RIFF')process.exit(1);console.log('HHBA_HIGH_DEFINITION_WORKERS_PHOTO_OK')"
          test -s apps/web/dist/images/hhba-join-team.webp
          node -e "const fs=require('fs');const p='apps/web/dist/images/hhba-join-team.webp';const x=fs.readFileSync(p);if(x.toString('ascii',0,4)!=='RIFF'||x.toString('ascii',8,12)!=='WEBP'||x.length<20000)process.exit(1);console.log('HHBA_REAL_JOIN_PHOTO',x.length)"
      - name: Verify founder letter and the handwritten signature asset are in the public build
        run: |
          test -s apps/web/dist/images/hhba-founder-signature.webp
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const photo=fs.readFileSync('apps/web/dist/images/hhba-founder-signature.webp');
          if(photo.length<12000||photo.toString('ascii',0,4)!=='RIFF'||
             photo.toString('ascii',8,12)!=='WEBP')throw Error('INVALID_HHBA_FOUNDER_SIGNATURE');
          const page=fs.readFileSync('apps/web/src/pages/JoinUsPage.tsx','utf8');
          if(!page.includes('<BrandManifesto />')||!page.includes('A NOTE FROM HHBA')||
             !page.includes('images/hhba-founder-signature.webp')||
             page.includes('images/hhba-brand-manifesto.webp'))
            throw Error('HHBA_FOUNDER_LETTER_NOT_CURRENT');
          console.log('HHBA_FOUNDER_LETTER_OK',photo.length);
          NODE
      - name: Refresh official ATS index while preserving 200-company directory
        working-directory: apps/web
        run: node scripts/prepare-pages-jobs.mjs
      - name: Verify official JD and Chinese structured search regression cases
        working-directory: apps/web
        run: node --test scripts/audit-all-official-jds.test.mjs scripts/job-search-facets.test.mjs
      - name: Audit ALL jobs, compare official JD changes and verify requirements
        working-directory: apps/web
        run: node scripts/audit-all-official-jds.mjs
      - name: Validate all-job source-grounded search metadata and its exact feed timestamp
        working-directory: apps/web
        run: |
          node -e "
          const fs=require('fs');
          const feed=JSON.parse(fs.readFileSync('dist/data/jobs.json','utf8'));
          const facets=JSON.parse(fs.readFileSync('dist/data/job-search-facets.json','utf8'));
          if(facets.kind!=='HHBA_OFFICIAL_JD_SEARCH_FACETS_V1'||facets.indexed_as_of!==feed.updated)
            throw Error('SEARCH_METADATA_SNAPSHOT_MISMATCH');
          if(facets.total_indexed_jobs!==feed.total||facets.jobs.length!==facets.extracted_count)
            throw Error('SEARCH_METADATA_INCOMPLETE');
          if(facets.extracted_count<8000)throw Error('MISSING_GLOBAL_ATS_SEARCH_FACETS');
          if(facets.jobs.some(j=>typeof j.original_source_hash!=='string'||j.original_source_hash.length!==64))
            throw Error('INVALID_OFFICIAL_JD_EVIDENCE_HASH');
          console.log('HHBA_REAL_GLOBAL_SEARCH_FACETS',JSON.stringify({
            indexed:feed.total,officialJdFacets:facets.extracted_count,updated:feed.updated
          }));
          "
      - name: Preserve per-job evidence states without copying copyrighted JD
        uses: actions/upload-artifact@v4
        with:
          name: hhba-full-jd-sync-report
          path: |
            apps/web/dist/data/job-sync-status.json
            apps/web/dist/data/job-sync-summary.json
            apps/web/dist/data/job-search-facets.json
          retention-days: 30
          if-no-files-found: error
      - name: Verify Airtable official JD and the green Chinese reader bridge
        working-directory: apps/web
        run: node scripts/verify-official-jd.mjs
      - name: Verify stale or withdrawn official jobs cannot appear in active results
        run: |
          node -e "const fs=require('fs');const x=fs.readFileSync('apps/web/src/services/liveRecruitment.ts','utf8');if(!x.includes('MISSING_FROM_OFFICIAL_BOARD')||!x.includes('OFFICIAL_URL_CHANGED')||!x.includes('loadPublicJobAudit'))process.exit(1)"
      - name: Verify dual-entry home, unified deep links and complete enterprise function routing
        working-directory: apps/web
        run: node --test scripts/hhba-unified-static.contract.test.mjs
      - name: Enable deep-link reload fallback
        working-directory: apps/web
        run: |
          cp dist/index.html dist/404.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const index=fs.readFileSync('dist/index.html','utf8');
          const fallback=fs.readFileSync('dist/404.html','utf8');
          if(index!==fallback)throw Error('SPA_DEEP_LINK_FALLBACK_MISMATCH');
          const main=fs.readFileSync('src/main.tsx','utf8');
          if(!main.includes("route==='/vision'"))throw Error('DEDICATED_VISION_ROUTE_MISSING');
          console.log('HHBA_VISION_DIRECT_LINK_READY');
          NODE
      - name: Checkout admin UI from the dedicated, non-production preview branch
        uses: actions/checkout@v4
        with:
          ref: feat/admin-investor-console-phase2-20261021
          path: _hhba_admin_source
          persist-credentials: false
      - name: Check admin static preview security and functional contracts
        run: |
          node --check _hhba_admin_source/apps/admin-preview/dashboard.js
          node --check _hhba_admin_source/apps/admin-preview/metrics.mjs
          node --check _hhba_admin_source/apps/admin-preview/phase2-metrics.mjs
          node --test _hhba_admin_source/apps/admin-preview/tests/*.test.mjs
      - name: Embed public-only admin static preview at /hhba-talent/admin-preview/
        run: |
          mkdir -p apps/web/dist/admin-preview/data
          cp _hhba_admin_source/apps/admin-preview/index.html \
             _hhba_admin_source/apps/admin-preview/styles.css \
             _hhba_admin_source/apps/admin-preview/dashboard.js \
             _hhba_admin_source/apps/admin-preview/favicon.svg \
             apps/web/dist/admin-preview/
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const root='apps/web/dist/admin-preview/';
          let html=readFileSync(root+'index.html','utf8');
          for(const [oldPath,newPath] of [
            ['href="/styles.css"','href="./styles.css"'],
            ['src="/dashboard.js"','src="./dashboard.js"'],
            ['href="/favicon.svg"','href="./favicon.svg"']
          ]){
            if(!html.includes(oldPath))throw Error('ADMIN_ASSET_REFERENCE_CHANGED');
            html=html.replaceAll(oldPath,newPath);
          }
          // The local-only development copy must never be labelled as protected on public Pages.
          html=html.replaceAll('本地只读开发预览','GitHub Pages 公开只读演示')
            .replaceAll('内部开发预览','公开静态演示')
            .replaceAll('本地开发模式','公开只读模式')
            .replaceAll('本地预览','静态预览');
          writeFileSync(root+'index.html',html);
          let js=readFileSync(root+'dashboard.js','utf8');
          if(!js.includes("fetch('/api/overview'"))throw Error('ADMIN_ENDPOINT_CHANGED');
          js=js.replace("fetch('/api/overview'","fetch('./data/overview.json'");
          writeFileSync(root+'dashboard.js',js);
          if(!js.includes("fetch('./data/overview.json'"))throw Error('ADMIN_STATIC_TRANSFORM_FAILED');
          NODE
      - name: Capture phase 2 metrics from SAME built public listing and official JD audit
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {buildPhase2Overview} from './_hhba_admin_source/apps/admin-preview/phase2-metrics.mjs';
          const root='apps/web/dist/data/';
          let result;
          try {
            const feed=JSON.parse(readFileSync(root+'jobs.json','utf8'));
            const audit=JSON.parse(readFileSync(root+'job-sync-status.json','utf8'));
            result=buildPhase2Overview(feed,audit);
          } catch(error) {
            console.warn('ADMIN_PHASE2_SOURCE_UNAVAILABLE',error.message);
            result={kind:'HHBA_PUBLIC_RECRUITMENT_OVERVIEW_V2',
              sourceType:'PUBLIC_PAGES_FEED_AND_OFFICIAL_JD_AUDIT',
              quality:'unavailable',asOf:null,observedAt:new Date().toISOString(),
              auditCheckedAt:null,counts:{indexedJobs:null,displayableJobs:null,
                auditedJobRequirements:null,distinctIndexedCompanies:null,
                checkedAtsSources:null,failedAtsSources:null,
                unclassifiedOrUnverifiedJobs:null},
              definitions:{},future:{totalRegisteredUsers:null,activeUsers30d:null,
                applyOutboundClicks:null,revenueCny:null,retention30d:null,trafficSeries:null}};
          }
          // Public snapshot: allow only safe, aggregated metrics (never user data).
          const allowed=new Set(['kind','source','sourceType','asOf','observedAt','auditCheckedAt',
            'quality','counts','definitions','future']);
          for(const key of Object.keys(result))if(!allowed.has(key))throw Error('UNEXPECTED_ADMIN_FIELD');
          writeFileSync('apps/web/dist/admin-preview/data/overview.json',JSON.stringify(result));
          NODE
          node --check apps/web/dist/admin-preview/dashboard.js
          test -s apps/web/dist/admin-preview/index.html
          test -s apps/web/dist/admin-preview/data/overview.json
      - name: Verify full employer governance and safe public preview
        run: |
          test -s apps/web/dist/images/hhba-founder-signature.webp
          test -s apps/web/dist/images/hhba-join-team.webp
          test -s apps/web/dist/preview-admin/data/workspace.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source=fs.readFileSync('apps/web/src/main.tsx','utf8');
          for (const text of ['EmployerAidApplicationPage','AdminAppealsReviewPage','AdminEmployerEvidencePage','EmployerScoringPage','EmployerImprovementsPage','Company200PreviewPage','PersonalCenterPage'])
            if(!source.includes(text))throw Error('LOST_UNIFIED_MODULE_'+text);
          const state=JSON.parse(fs.readFileSync('apps/web/dist/preview-admin/data/workspace.json','utf8'));
          if(state.productionReviewerAuth!=='not_connected'||!state.modules.every(x=>!x.reviewAllowed))
            throw Error('STATIC_PREVIEW_MUST_NOT_HAVE_LIVE_APPROVAL');
          console.log('HHBA_COMPLETE_SOURCE_AND_SAFE_PREVIEW_OK');
          NODE
      - name: Verify newest unified admin preview is truly public-safe and fully static
        run: |
          node --check apps/web/dist/preview-admin/dashboard.js
          node --check apps/web/dist/preview-admin/unified-workbench.js
          node --input-type=module <<'NODE'
          import {readFileSync,existsSync} from 'node:fs';
          const root='apps/web/dist/preview-admin/';
          for (const file of ['index.html','styles.css','unified-workbench.css',
              'favicon.svg','dashboard.js','unified-workbench.js',
              'data/jobs.json','data/growth.json','data/workspace.json']) {
            if (!existsSync(root+file)) throw Error('MISSING_ADMIN_PREVIEW_FILE:'+file);
          }
          const html=readFileSync(root+'index.html','utf8');
          const dashboard=readFileSync(root+'dashboard.js','utf8');
          const workspaceUi=readFileSync(root+'unified-workbench.js','utf8');
          if (!html.includes('GitHub Pages 静态预览') ||
              html.includes('action="/management/logout"') ||
              !dashboard.includes("fetch('./data/jobs.json'") ||
              !dashboard.includes("fetch('./data/growth.json?'+params") ||
              !workspaceUi.includes("fetch('./data/workspace.json'") ||
              dashboard.includes("fetch('/api/admin/") ||
              workspaceUi.includes("fetch('/api/admin/"))
            throw Error('ADMIN_PREVIEW_PRIVATE_SERVICE_LEAK');
          for(const file of ['jobs.json','growth.json','workspace.json']){
            const data=JSON.parse(readFileSync(root+'data/'+file,'utf8'));
            if(file==='jobs.json'&&(data.quality!=='unavailable'||
               data.counts.displayableJobs!==null))throw Error('FAKE_JOB_TOTAL');
            if(file==='growth.json'&&(data.traffic.quality!=='unavailable'||
               data.bookmarks.quality!=='unavailable'))throw Error('FAKE_PRIVATE_METRICS');
            if(file==='workspace.json'&&(data.productionReviewerAuth!=='not_connected'||
               !data.modules.every(x=>x.pending===null&&!x.reviewAllowed)))
              throw Error('UNAUTHORIZED_REVIEWER_STATE');
          }
          console.log('HHBA_PUBLIC_STATIC_ADMIN_PREVIEW_VERIFIED',root);
          NODE
      - name: Verify old bulk snapshot is excluded from V2 market but kept for legacy company directory
        run: |
          # Other identity-directory routes still rely on these source files.
          # V2 listJobs/getJob never read them for new China listings.
          test -s apps/web/dist/data/jobs.json
          test -s apps/web/dist/curated/v1/jobs.json
          test -s apps/web/dist/images/autumn-ai-scenes/cn-autumn-002-01.avif
          test -s apps/web/dist/images/autumn-ai-scenes/cn-autumn-002-02.avif
          grep -q "DOMESTIC_REBUILD_V2" apps/web/src/services/liveRecruitment.ts
          echo HHBA_V2_LEGACY_SNAPSHOT_COMPATIBILITY_RETAINED_MARKET_V2_ISOLATED
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload exactly the public built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the white HHBA site
        id: deployment
        uses: actions/deploy-pages@v4
