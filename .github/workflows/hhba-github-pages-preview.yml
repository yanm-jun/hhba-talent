name: HHBA Unified Static Site GitHub Pages
# Domestic V2: legacy domestic job/channel entries removed from the public MARKET; 100 overseas curated roles preserved.
# KPMG now joins the shared market with 6 source-traceable historical Moka job details.
# Huayu Vision third rebuild: 16 individual official campus role descriptions, original photos/logo reused; ATS detail links currently lead to official job listing.
# Fourth employer Huaan Securities: ten expired but individually described 2026 roles, original media, shared jobs UI; do not mix Huaan Fund.
# Fifth employer GF Securities: 10 sourced 2027 campus role records, archived after September 30; reuses existing visual assets, shared V2 details.
# Sixth employer CITIC Securities: five individual 2027 graduate trainee postings from separate branches; nonrestrictive majors; official application status unverified.
# CITIC employer-identity contract updated to verify actual branch entities, not the disclaimer listing excluded companies.
# Final CITIC QA: use the independently verified Jilin University Shanghai branch job source and check university evidence hostnames.
# Huayu role source QA: keep genuine concise qualifications; do not pad employer text to satisfy arbitrary minimum length.
# Old employer content and original photos remain archived in Git for rebuilding one company at a time.
# KPMG + Schneider Electric: four-block pages, exact logos and two independently generated labeled AI images per company.
# 2026-10-29: Schneider alt text repaired, rerun full static build and source-backed logo checks.
# KPMG first-employer logo and two labelled independent AI photo assets; QA alt text verified.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 0,12 * * *'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: hhba-github-pages-preview
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        # One source branch only: triggering main commit.
      - name: Import the first employer's source-backed KPMG trademark SVG
        run: |
          python - <<'PY'
          import pathlib, re, urllib.request, xml.etree.ElementTree as ET
          url='https://upload.wikimedia.org/wikipedia/commons/d/db/KPMG_blue_logo.svg'
          req=urllib.request.Request(url, headers={'User-Agent':'HHBA-Brand-Reference/1.0 (static catalog, educational use)'})
          with urllib.request.urlopen(req,timeout=40) as resp:
              svg=resp.read(100000)
          text=svg.decode('utf-8-sig')
          assert len(svg)>1000 and '<svg' in text and '</svg>' in text, 'KPMG SVG not retrieved'
          assert not re.search(r'<script|<foreignObject|onload\\s*=|onerror\\s*=|javascript:',text,re.I), 'Unsafe source SVG'
          root=ET.fromstring(svg)
          assert root.tag.endswith('svg'), 'Incorrect file type for KPMG logo'
          target=pathlib.Path('apps/web/public/images/autumn-real-logos/cn-autumn-001.svg')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(svg)
          print('KPMG_SOURCE_BACKED_LOGO_READY',len(svg),url)
          PY
      - name: Import source-backed Schneider Electric complete wordmark
        run: |
          python - <<'PY'
          import pathlib, re, urllib.request, xml.etree.ElementTree as ET
          url='https://upload.wikimedia.org/wikipedia/commons/9/95/Schneider_Electric_2007.svg'
          request=urllib.request.Request(url,headers={'User-Agent':'HHBA-Brand-Reference/1.0 (static enterprise identification)'})
          with urllib.request.urlopen(request,timeout=45) as resp:
              svg=resp.read(100000)
          text=svg.decode('utf-8-sig')
          assert 8000<len(svg)<60000 and '<svg' in text and '</svg>' in text,'Full Schneider Electric wordmark missing'
          assert not re.search(r'<script|<foreignObject|onload\s*=|onerror\s*=|javascript:',text,re.I),'Unsafe SVG'
          tree=ET.fromstring(svg)
          assert tree.tag.endswith('svg')
          target=pathlib.Path('apps/web/public/images/autumn-real-logos/cn-autumn-002.svg')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(svg)
          print('SCHNEIDER_SOURCE_BACKED_WORDMARK_READY',len(svg))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify employer cards show only individual role matches for major searches
        working-directory: apps/web
        run: node scripts/employer-job-level-search.contract.test.mjs
      - name: Verify mechanical-major families and applicant education hierarchy
        working-directory: apps/web
        run: node scripts/major-eligibility.contract.test.mjs
      - name: Verify bundled V2 employers and search aliases
        working-directory: apps/web
        run: node scripts/v2-market-search.contract.test.mjs
      - name: Prepare Guangzhilv three static assets inside the main checkout
