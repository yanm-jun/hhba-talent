name: HHBA Domestic Employer Portal Verification
on:
  push:
    branches: [feat/dual-entry-recruitment-integration]
    paths:
      - 'deploy/railway/probe_domestic_employer_portals.mjs'
      - '.github/workflows/hhba-domestic-portals.yml'
  pull_request:
    paths:
      - 'deploy/railway/probe_domestic_employer_portals.mjs'
      - 'deploy/railway/domestic_employer_directory_20261018.json'
      - '.github/workflows/hhba-domestic-portals.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runtime
        run: npm install --prefix .browser-test --no-package-lock --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium
        run: .browser-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify employer career portals, without crawling jobs
        run: node deploy/railway/probe_domestic_employer_portals.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hhba-domestic-portals-verification
          path: domestic-portal-evidence/
          if-no-files-found: ignore
          retention-days: 30
