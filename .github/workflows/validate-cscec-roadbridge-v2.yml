name: HHBA V2 enterprise validation on main
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/src/data/employerProfiles/**'
      - 'apps/web/src/services/employerProfiles.ts'
      - 'apps/web/src/services/employerJobSearch.mjs'
      - 'apps/web/src/pages/UnifiedV2CompanyPage.tsx'
      - 'apps/web/src/components/V2EmployerSearchResults.tsx'
      - 'apps/web/src/main.tsx'
      - 'apps/web/scripts/prepare-zhongjian-luqiao-media.py'
      - 'apps/web/scripts/prepare-power-invest-media.py'
      - 'apps/web/scripts/prepare-weipu-media.py'
      - 'apps/web/scripts/prepare-bodor-media.py'
      - 'apps/web/scripts/bodor-v2.contract.test.mjs'
      - 'apps/web/scripts/weipu-v2.contract.test.mjs'
      - 'apps/web/scripts/v2-market-search.contract.test.mjs'
      - 'apps/web/scripts/employer-job-level-search.contract.test.mjs'
      - 'apps/web/scripts/mainline-v2-browser.mjs'
      - '.github/workflows/validate-cscec-roadbridge-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-main-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media verifier
        run: python -m pip install --quiet Pillow
      - name: Restore shared Guangzhilv source-backed media used by the same browser regression
        run: python apps/web/scripts/prepare-guangzhilv-media.py
      - name: Package sourced Zhongjian Luqiao 3 independent assets
        run: python apps/web/scripts/prepare-zhongjian-luqiao-media.py
      - name: Package Power Investment image assets for the same unified V2 browser test
        run: python apps/web/scripts/prepare-power-invest-media.py
      - name: Package WEIPU corporate brand and 2 independent source photos
        run: python apps/web/scripts/prepare-weipu-media.py
      - name: Package Bodor 033 independent corporate logo and two real photos
        run: python apps/web/scripts/prepare-bodor-media.py
      - name: Inspect actual media provenance and access
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          folder=Path('apps/web/public/images/employer-profiles/cn-autumn-028')
          audit=json.loads((folder/'media-audit.json').read_text())
          assert set(audit)=={'logo.png','photo1.jpg','photo2.jpg'}
          for name,v in audit.items():
              assert (folder/name).stat().st_size>1500,name
              print('ZJ_LUQIAO_ASSET',name,'REAL_SOURCE' if v['verified'] else 'LABELED_PLACEHOLDER',v.get('source'))
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          folder=Path('apps/web/public/images/employer-profiles/cn-autumn-029')
          audit=json.loads((folder/'media-audit.json').read_text())
          assert set(audit)=={'logo.png','photo1.jpg','photo2.jpg'}
          assert all(v['verified'] for v in audit.values()),'029 official photos/logo are required, not placeholder images'
          assert len({v['sha256'] for v in audit.values()})==3
          for name,entry in audit.items():
              assert (folder/name).stat().st_size>1500
              print('POWER_INVEST_029_MEDIA',name,'VERIFIED' if entry['verified'] else 'HONEST_PLACEHOLDER',entry.get('source'))
          PY
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Verify entire V2 company index and individual role filtering
        working-directory: apps/web
        run: |
          node scripts/v2-market-search.contract.test.mjs
          node scripts/weipu-v2.contract.test.mjs
          node scripts/bodor-v2.contract.test.mjs
          node scripts/employer-job-level-search.contract.test.mjs
          node scripts/major-eligibility.contract.test.mjs
      - name: Build exact GitHub Pages frontend from one main source
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
          HHBA_PAGES_BASE: '/hhba-talent/'
          VITE_HHBA_OVERSEAS_CURATED_100: '1'
          VITE_HHBA_DOMESTIC_REBUILD_V2: '1'
          VITE_HHBA_ACCOUNT_API_ENABLED: '0'
        run: npm run build
      - name: Install Chromium and test actual employer search on desktop and mobile
        working-directory: apps/web
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test ONE real market and all existing company regressions
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
          HHBA_PAGES_BASE: '/hhba-talent/'
          HHBA_TEST_BASE: 'http://127.0.0.1:4173/hhba-talent/'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/hhba-roadbridge-v2.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS "$HHBA_TEST_BASE" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS "$HHBA_TEST_BASE"
          node scripts/mainline-v2-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hhba-zj-roadbridge-main-v2-qa
          path: |
            apps/web/mainline-v2-browser-proof/
            apps/web/public/images/employer-profiles/cn-autumn-028/media-audit.json
            apps/web/public/images/employer-profiles/cn-autumn-029/media-audit.json
            apps/web/public/images/employer-profiles/cn-autumn-032/media-audit.json
            apps/web/public/images/employer-profiles/cn-autumn-033/media-audit.json
          retention-days: 14
          if-no-files-found: ignore
