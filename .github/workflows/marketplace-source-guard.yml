name: Marketplace function source guard
on:
  push:
    paths:
      - "ops/railway/jobs-marketplace/**"
      - ".github/workflows/marketplace-source-guard.yml"
  pull_request:
    paths:
      - "ops/railway/jobs-marketplace/**"
      - ".github/workflows/marketplace-source-guard.yml"
jobs:
  source-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test ops/railway/jobs-marketplace/source.test.mjs
