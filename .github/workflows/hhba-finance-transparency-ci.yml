name: HHBA financial transparency - build and safeguards
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/pages/TransparencyPage.tsx'
      - 'apps/web/src/styles/transparency*.css'
      - 'apps/web/src/main.tsx'
      - 'apps/web/src/components/HomeWorkplacePromise.tsx'
      - 'apps/web/src/components/Shell.tsx'
      - 'apps/web/functions/api/transparency/**'
      - 'apps/web/functions/transparency/manage.js'
      - 'apps/web/functions/_lib/transparency*.js'
      - 'apps/web/functions/_lib/admin-access.js'
      - 'apps/web/d1/0020_financial_transparency.sql'
      - 'apps/web/scripts/financial-transparency.contract.test.mjs'
      - '.github/workflows/hhba-finance-*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Finance API safety, opt-in, revision and homepage tests
        working-directory: apps/web
        run: |
          node --test scripts/financial-transparency.contract.test.mjs scripts/home-workplace-promise.contract.test.mjs scripts/admin-access-audiences.test.mjs
      - name: Verify TypeScript and website build
        working-directory: apps/web
        run: npm run build
