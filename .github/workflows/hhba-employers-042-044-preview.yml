name: HHBA V2 employers 042-044 3-company full static preview
on:
  push:
    branches: [feature/employers-042-044-v2]
    paths:
      - 'apps/web/src/data/employerProfiles/cn-autumn-042.json'
      - 'apps/web/src/data/employerProfiles/cn-autumn-043.json'
      - 'apps/web/src/data/employerProfiles/cn-autumn-044.json'
      - 'apps/web/src/pages/UnifiedV2CompanyPage.tsx'
      - 'apps/web/scripts/prepare-employers-042-044-media.py'
      - 'apps/web/scripts/employers-042-044-v2.contract.test.mjs'
      - '.github/workflows/hhba-employers-042-044-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hhba-employers-042-044-v2-batch
  cancel-in-progress: true
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out company branch only
        uses: actions/checkout@v4
        with:
          ref: feature/employers-042-044-v2
          persist-credentials: true
      - name: Install image processing dependencies
        run: python -m pip install pillow beautifulsoup4 cairosvg
      - name: Download nine separate authentic company assets
        run: python apps/web/scripts/prepare-employers-042-044-media.py
      - name: Commit local media and hashes ONLY to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/images/employer-profiles/cn-autumn-042 \
                  apps/web/public/images/employer-profiles/cn-autumn-043 \
                  apps/web/public/images/employer-profiles/cn-autumn-044
          if ! git diff --cached --quiet; then
            git commit -m "assets(042-044): vendor three logos and six unique branded product images"
            git push origin HEAD:feature/employers-042-044-v2
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - name: Validate 3 x 4 panels and independent images
        working-directory: apps/web
        run: node scripts/employers-042-044-v2.contract.test.mjs
      - name: Diagnose pre-existing other-company image gaps separately
        working-directory: apps/web
        continue-on-error: true
        run: node scripts/employer-factory-check.mjs
      - name: Build unmodified HHBA front-end into independent static artifact
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
          HHBA_PAGES_BASE: '/hhba-talent/'
          VITE_HHBA_DOMESTIC_REBUILD_V2: '1'
        run: npm run build
      - name: Verify all nine local media files and website package
        run: |
          test -s apps/web/dist/index.html
          for num in 042 043 044; do
            test -s apps/web/dist/images/employer-profiles/cn-autumn-$num/logo.png
            test -s apps/web/dist/images/employer-profiles/cn-autumn-$num/photo1.jpg
            test -s apps/web/dist/images/employer-profiles/cn-autumn-$num/photo2.jpg
          done
      - name: Upload isolated static full-site preview, do NOT deploy GitHub Pages main
        uses: actions/upload-artifact@v4
        with:
          name: hhba-employers-042-044-full-static-preview
          path: apps/web/dist/
          retention-days: 14
          if-no-files-found: error
