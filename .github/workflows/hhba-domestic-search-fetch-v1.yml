name: HHBA Domestic Search Fetch stage 1
on:
  pull_request:
    paths:
      - 'apps/web/functions/_lib/domestic-search-fetch.js'
      - 'apps/web/functions/api/match/discover.js'
      - 'apps/web/scripts/domestic-search-fetch.*'
      - 'apps/web/d1/0018_external_search_usage.sql'
      - '.github/workflows/hhba-domestic-search-fetch-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts
      - name: Backend syntax and mock provider tests
        working-directory: apps/web
        run: |
          node --check functions/_lib/domestic-search-fetch.js
          node --check functions/api/match/discover.js
          node --test scripts/domestic-search-fetch.contract.test.mjs scripts/domestic-search-fetch.route.test.mjs
      - name: Existing HHBA production bundle regression
        working-directory: apps/web
        run: npm run build
