name: HHBA Guangdong V5.1 branch validation
on:
  push:
    branches:
      - feature/talent-guangdong
  pull_request:
    paths:
      - 'apps/web/src/data/guangdong*'
      - 'apps/web/src/data/talentPolicyRecords.ts'
      - 'apps/web/src/data/talentHousingRecords.ts'
      - 'apps/web/scripts/test-guangdong-city-v51.mjs'
      - '.github/workflows/hhba-guangdong-branch-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Guangdong index and quality checks
        working-directory: apps/web
        run: |
          node scripts/test-guangdong-city-v51.mjs
          node --experimental-strip-types scripts/test-talent-city-contract-v51.mjs
      - name: Production static build (no deployment)
        working-directory: apps/web
        run: npm run build
      - name: Share isolated downloadable preview build
        uses: actions/upload-artifact@v4
        with:
          name: guangdong-v51-static-build
          path: apps/web/dist/
          if-no-files-found: error
