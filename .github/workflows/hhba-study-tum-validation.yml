name: HHBA TUM Informatics Deep Profile Validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hhba-study-tum-validation.yml'
      - 'apps/web/src/data/studyTum.ts'
      - 'apps/web/src/components/TumUniversityPage.tsx'
      - 'apps/web/src/components/StudyUniversityDirectory.tsx'
      - 'apps/web/src/styles/study-tum.css'
      - 'apps/web/scripts/package-tum-campus-photos.py'
      - 'apps/web/scripts/tum.contract.test.mjs'
      - 'apps/web/scripts/tum.browser.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hhba-tum-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    name: Verify TUM real source / campus photography / advanced MSc / desktop-mobile UX
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Verify TUM entry requirements, real fees, original homepage and source provenance
        working-directory: apps/web
        run: node --experimental-strip-types --test scripts/tum.contract.test.mjs scripts/study-universities.contract.test.mjs scripts/study-abroad.contract.test.mjs
      - name: Retrieve and credit 3 licensed true Garching photos
        run: python apps/web/scripts/package-tum-campus-photos.py
      - name: Compile original HHBA React site
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
          HHBA_PAGES_BASE: '/hhba-talent/'
        run: npm run build
      - name: Install Chromium
        working-directory: apps/web
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Real clickable school and postgraduate details desktop/mobile
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
          HHBA_PAGES_BASE: '/hhba-talent/'
          HHBA_TEST_BASE: 'http://127.0.0.1:4173/hhba-talent/'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/hhba-tum.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS "$HHBA_TEST_BASE" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS "$HHBA_TEST_BASE" >/dev/null
          node scripts/tum.browser.mjs
      - name: Save desktop/mobile screenshots and proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hhba-tum-real-university-proof
          path: apps/web/mainline-v2-browser-proof/
          retention-days: 14
          if-no-files-found: ignore
