name: HHBA precomputed bilingual JD acceptance
on:
  push:
    branches: [feat/precomputed-bilingual-jd-20261020]
    paths:
      - 'ops/legacy-marketplace/**'
      - 'apps/web/**'
      - 'Dockerfile.hhba'
      - '.github/workflows/hhba-precomputed-bilingual-jd.yml'
  pull_request:
    paths:
      - 'ops/legacy-marketplace/**'
      - 'apps/web/**'
      - 'Dockerfile.hhba'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity-and-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Run source-version and completeness tests in ephemeral SQLite
        run: bun test ops/legacy-marketplace/test/precomputed-bilingual-jd.test.mjs
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Ensure white page cannot trigger 16 on-demand translations
        working-directory: apps/web
        run: |
          node --test scripts/white-market-detail.contract.test.mjs
          node --test scripts/featured-brand-jobs.contract.test.mjs
      - name: Build white site with exact Railway settings
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '0'
          VITE_HHBA_VERIFIED_SNAPSHOT: '1'
          VITE_HHBA_ACCOUNT_API_ENABLED: '0'
        run: npm run build
      - name: Build full Railway Bun + white site Docker image
        run: docker build -f Dockerfile.hhba -t hhba-bilingual-prepared:test .
