name: HHBA National Talent Main Audit
on:
  pull_request:
    paths:
      - 'apps/web/src/data/**'
      - 'apps/web/src/components/talent/**'
      - 'apps/web/scripts/audit-talent-national-main.mjs'
      - '.github/workflows/hhba-talent-national-main-audit.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/src/data/**'
      - 'apps/web/src/components/talent/**'
      - 'apps/web/scripts/audit-talent-national-main.mjs'
  workflow_dispatch:
jobs:
  national-talent-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Strict nationwide data/route audit
        run: node --experimental-strip-types scripts/audit-talent-national-main.mjs
      - name: Existing nationwide regression suite
        run: |
          node --experimental-strip-types scripts/test-talent-cities.mjs
          node --experimental-strip-types scripts/test-talent-city-contract-v51.mjs
      - name: Validate Hainan government-backed records and housing separation
        run: node --experimental-strip-types scripts/test-hainan-sourced-v51.mjs
      - name: Check sourced Shenyang 2026 housing record
        run: node --experimental-strip-types scripts/test-shenyang-housing-gap-v51.mjs
      - name: Verify new prefecture-level administrative catalog
        run: node --experimental-strip-types scripts/test-talent-prefecture-25-v51.mjs
      - name: Verify Leshan High-Tech Zone official 2024 policy and housing scope
        run: node --experimental-strip-types scripts/test-leshan-policy-v51.mjs
      - name: Check all four Hainan regions and complete B-grade guides
        run: node --experimental-strip-types scripts/test-hainan-full-v51.mjs
      - name: Sichuan source-backed regional policy and housing V5.1 regression
        run: node --experimental-strip-types scripts/test-sichuan-city-v51.mjs
      - name: Audit all 337 city UI counters and known Sichuan/Hainan records
        run: node --experimental-strip-types scripts/audit-talent-city-ui.mjs
      - name: Verify screenshot's 15 provinces against merged main city records
        run: node --experimental-strip-types scripts/test-screenshot-province-coverage.mjs
      - name: Restore Guizhou 9 regional policies and independent housing source
        run: node --experimental-strip-types scripts/test-guizhou-city-v51.mjs
      - name: Audit rebuilt Guiyang 2026 talent programs, deadlines, housing and routes
        run: node --experimental-strip-types scripts/test-guiyang-2026-complete.mjs
      - name: Audit Gansu 14 regions V6 policy, housing, city UI and guides
        run: node --experimental-strip-types scripts/test-gansu-v6.mjs
      - name: Confirm static build
        run: npm run build
