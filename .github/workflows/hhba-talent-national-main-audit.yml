name: HHBA National Talent Main Audit
on:
  pull_request:
    paths:
      - 'apps/web/src/data/**'
      - 'apps/web/src/components/talent/**'
      - 'apps/web/scripts/audit-talent-national-main.mjs'
      - '.github/workflows/hhba-talent-national-main-audit.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/src/data/**'
      - 'apps/web/src/components/talent/**'
      - 'apps/web/scripts/audit-talent-national-main.mjs'
  workflow_dispatch:
jobs:
  national-talent-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Strict nationwide data/route audit
        run: node --experimental-strip-types scripts/audit-talent-national-main.mjs
      - name: Existing nationwide regression suite
        run: |
          node --experimental-strip-types scripts/test-talent-cities.mjs
          node --experimental-strip-types scripts/test-talent-city-contract-v51.mjs
      - name: Validate Hainan government-backed records and housing separation
        run: node --experimental-strip-types scripts/test-hainan-sourced-v51.mjs
      - name: Check sourced Shenyang 2026 housing record
        run: node --experimental-strip-types scripts/test-shenyang-housing-gap-v51.mjs
      - name: Verify new prefecture-level administrative catalog
        run: node --experimental-strip-types scripts/test-talent-prefecture-25-v51.mjs
      - name: Verify Leshan High-Tech Zone official 2024 policy and housing scope
        run: node --experimental-strip-types scripts/test-leshan-policy-v51.mjs
      - name: Check all four Hainan regions and complete B-grade guides
        run: node --experimental-strip-types scripts/test-hainan-full-v51.mjs
      - name: Sichuan source-backed regional policy and housing V5.1 regression
        run: node --experimental-strip-types scripts/test-sichuan-city-v51.mjs
      - name: Audit all 337 city UI counters and known Sichuan/Hainan records
        run: node --experimental-strip-types scripts/audit-talent-city-ui.mjs
      - name: Verify screenshot's 15 provinces against merged main city records
        run: node --experimental-strip-types scripts/test-screenshot-province-coverage.mjs
      - name: Restore Guizhou 9 regional policies and independent housing source
        run: node --experimental-strip-types scripts/test-guizhou-city-v51.mjs
      - name: Audit rebuilt Guiyang 2026 talent programs, deadlines, housing and routes
        run: node --experimental-strip-types scripts/test-guiyang-2026-complete.mjs
      - name: Ningxia 5-city V6 policy and housing evidence audit
        run: node --experimental-strip-types scripts/test-ningxia-v6.mjs
      - name: Guard official city names and Ningxia live-page counts
        run: node --experimental-strip-types scripts/test-ningxia-pages-sync.mjs
      - name: Tibet V6 seven-region complete catalog and guides
        run: node --experimental-strip-types scripts/test-xizang-v6.mjs
      - name: Shanxi V5.1 current main policy and housing guide regression
        run: node --experimental-strip-types scripts/test-shanxi-current-guide-20261106.mjs
      - name: Shaanxi V6 full ten-city policy housing and guide regression
        run: node --experimental-strip-types scripts/test-shaanxi-v6.mjs
      - name: Audit Gansu 14 regions V6 policy, housing, city UI and guides
        run: node --experimental-strip-types scripts/test-gansu-v6.mjs
      - name: Gansu 14-prefecture expanded 2026 full source and guide coverage
        run: node --experimental-strip-types scripts/test-gansu-expansion-20261101.mjs
      - name: Xinjiang fourteen-prefecture V6 housing and Corps boundary
        run: node --experimental-strip-types scripts/test-xinjiang-v6.mjs
      - name: Validate Qinghai five 2026 locally sourced policy guides without false cash claims
        run: node --experimental-strip-types scripts/test-qinghai-2026-five-prefectures.mjs
      - name: Verify 2026 Sichuan eleven-region sourced policy data without false certification
        run: node --experimental-strip-types scripts/test-sichuan-2026-policy-gap.mjs
      - name: Guard two source-backed Sichuan housing programs and nationwide integration
        run: node --experimental-strip-types scripts/test-sichuan-housing-gap-2026.mjs
      - name: Validate 26 Sichuan Guangxi Guizhou housing evidence and 2026 Luding local program
        run: node --experimental-strip-types scripts/test-housing-26-regions-20261101.mjs
      - name: Audit six Sichuan housing gaps against formal and clearly marked research data
        run: node --experimental-strip-types scripts/test-sichuan-six-housing-20261101.mjs
      - name: Ten missing-city housing evidence quality and false-live-availability regression
        run: node --experimental-strip-types scripts/test-ten-housing-gaps-2026.mjs
      - name: Confirm static build
        run: npm run build
