name: HHBA Taiji 21 source images
on:
  push:
    branches: [feat/employer-factory-pilot-taiji-21-20261030]
    paths: ['.github/workflows/hhba-taiji-21-media.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/employer-factory-pilot-taiji-21-20261030
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download independently sourced Taiji branding and photos
        shell: bash
        run: |
          set -euo pipefail
          python -m pip -q install requests pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          import requests,json
          p=Path('apps/web/public/images/employer-profiles/cn-autumn-017')
          p.mkdir(parents=True,exist_ok=True)
          sources={
            'logo.png':['https://iguopin-company.oss-cn-beijing.aliyuncs.com/10685711949965164/logo/20230630/9db3015b9a1c2f82ae75a2bbc2055223.jpg'],
            'photo1.webp':['https://q3.itc.cn/q_70/images03/20240507/6b693593f9764eb59c540784258fb01b.jpeg'],
            'photo2.webp':['https://p3.itc.cn/q_70/images03/20201011/fc6844a040ce45f5a673bd0b7f3ebbc0.jpeg']}
          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128.0 Safari/537.36','Referer':'https://www.sohu.com/'})
          manifest={}
          for name,urls in sources.items():
            done=False
            for url in urls:
              try:
                response=session.get(url,timeout=22);response.raise_for_status()
                im=Image.open(BytesIO(response.content));im.load()
                print(name,'from',url,'dimension',im.size,flush=True)
                if im.width<240 or im.height<100:raise ValueError('Not an enterprise photo')
                if name=='logo.png':
                  im=im.convert('RGBA');im.thumbnail((900,600))
                  im.save(p/name,'PNG',optimize=True)
                else:
                  im=im.convert('RGB');im.thumbnail((1600,1080))
                  im.save(p/name,'WEBP',quality=85,method=6)
                if not 100<(p/name).stat().st_size<5_000_000:raise ValueError('Image too small or large')
                manifest[name]=url;done=True;break
              except Exception as err:
                print('SOURCE_DOWNLOAD_FAILED',name,url,str(err)[:150],flush=True)
            if not done:raise SystemExit('Cannot verify '+name+'; refusing placeholder')
          if len(set(manifest.values()))!=3:raise SystemExit('Non-independent sources')
          (p/'source-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          print('TAIJI_MEDIA_READY',manifest,flush=True)
          PY
      - name: Commit original brand and two local scene photos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/public/images/employer-profiles/cn-autumn-017/
          git diff --cached --quiet && exit 0
          git commit -m 'assets(taiji): store three independent company images'
          git pull --rebase origin feat/employer-factory-pilot-taiji-21-20261030
          git push origin HEAD:refs/heads/feat/employer-factory-pilot-taiji-21-20261030
