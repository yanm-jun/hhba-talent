name: HHBA Career Library — major-first automotive pilot
on:
  pull_request:
    paths:
      - 'apps/web/d1/0024_major_industry_library_v1.sql'
      - 'apps/web/d1/0025_major_industry_library_employers_v1.sql'
      - 'apps/web/d1/0026_major_specific_automotive_paths_v1.sql'
      - 'apps/web/functions/_lib/hhba-library-classification-v1.js'
      - 'apps/web/functions/_lib/hhba-career-library-v1.js'
      - 'apps/web/functions/api/career-library/**'
      - 'apps/web/scripts/career-library-v1.contract.test.mjs'
      - 'apps/web/src/data/hhbaLibraryCompanyMapV1.json'
      - 'apps/web/src/pages/AutomotiveLibraryPage.tsx'
      - 'apps/web/src/styles/career-library-preview.css'
      - 'apps/web/src/main.tsx'
      - 'apps/web/src/router.tsx'
      - '.github/workflows/hhba-career-library-preview.yml'
  workflow_dispatch:
jobs:
  automotive-library-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Career library classification, privacy & major search safety
        run: node --test apps/web/scripts/career-library-v1.contract.test.mjs
  preview-web-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked web dependencies
        run: npm ci
      - name: Typecheck and create preview bundle
        run: npm run build
