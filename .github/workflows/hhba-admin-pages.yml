name: HHBA Admin Static Preview Safety Check
on:
  push:
    branches: [feat/admin-investor-console-phase1-20261021]
    paths:
      - 'apps/admin-preview/**'
      - '.github/workflows/hhba-admin-pages.yml'
  pull_request:
    paths:
      - 'apps/admin-preview/**'
      - '.github/workflows/hhba-admin-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check static console without publishing over the original HHBA website
        run: |
          node --check apps/admin-preview/dashboard.js
          node --check apps/admin-preview/metrics.mjs
          node --test apps/admin-preview/tests/*.test.mjs
          test -s apps/admin-preview/index.html
          test -s apps/admin-preview/styles.css
      # The main HHBA Pages workflow stages these files at /admin-preview/.
      # Never deploy a second Pages artifact containing only this directory.
