name: HHBA Heilongjiang V5.1 isolated branch QA
on:
  push:
    branches: [feature/talent-heilongjiang]
  pull_request:
    paths:
      - 'apps/web/src/data/heilongjiang*'
      - 'apps/web/src/data/talentCityRegistry.ts'
      - 'apps/web/src/data/talentPolicyRecords.ts'
      - 'apps/web/src/data/talentHousingRecords.ts'
      - 'apps/web/src/pages/TalentServiceRoutes.tsx'
      - 'apps/web/src/components/talent/UnifiedPolicyList.tsx'
      - 'apps/web/scripts/test-heilongjiang-v51.mjs'
      - '.github/workflows/hhba-heilongjiang-branch-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Heilongjiang 13 regions and national V5.1 regressions
        working-directory: apps/web
        run: |
          node --experimental-strip-types scripts/test-heilongjiang-v51.mjs
          node --experimental-strip-types scripts/test-talent-cities.mjs
          node --experimental-strip-types scripts/test-yunnan-city-v51.mjs
          node --experimental-strip-types scripts/test-talent-city-contract-v51.mjs
      - name: Build standalone static preview
        working-directory: apps/web
        run: npm run build
      - name: Upload only isolated static build
        uses: actions/upload-artifact@v4
        with:
          name: hhba-heilongjiang-v51-static-preview
          path: apps/web/dist/
          if-no-files-found: error
