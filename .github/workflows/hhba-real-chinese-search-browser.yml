name: HHBA Real Chinese Global Search Browser Acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hhba-real-chinese-search-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-official-queries:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/github-pages-white-preview-20261019
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check real source-aligned job search index and natural query examples
        run: node scripts/check_live_chinese_job_search.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real Chromium browser
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Test real Chinese queries, optional unknown-degree fallback and all structured filters
        run: python scripts/check_live_chinese_global_search_browser.py
      - name: Upload screenshot evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hhba-real-chinese-global-search-mobile
          path: /tmp/hhba-chinese-global-search-mobile.png
          retention-days: 14
          if-no-files-found: ignore
