name: HHBA admin library D1 budget checks
on:
  pull_request:
    branches:
      - feat/admin-password-console-20261112
    paths:
      - 'apps/admin-preview/**'
      - 'apps/web/functions/admin-preview/api/library.js'
      - 'apps/web/functions/admin-preview/api/health.js'
      - 'apps/web/functions/admin-preview/api/public-jobs.js'
      - 'apps/web/scripts/admin-real-diagnostics.test.mjs'
      - 'apps/web/scripts/admin-market-authenticity.test.mjs'
      - 'apps/web/scripts/build-standalone-admin.py'
      - 'apps/web/functions/_lib/library-snapshot-cache.js'
      - 'apps/web/scripts/admin-recruitment-library.test.mjs'
      - 'apps/web/scripts/admin-library-snapshot-cache.test.mjs'
      - '.github/workflows/hhba-admin-library-budget.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-library:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check apps/web/functions/admin-preview/api/library.js
          node --check apps/web/functions/_lib/library-snapshot-cache.js
          node --check apps/admin-preview/library.js
          node --check apps/admin-preview/dashboard.js
          node --check apps/admin-preview/server.mjs
          node --check apps/admin-preview/market.js
          node --check apps/web/functions/admin-preview/api/health.js
          node --check apps/web/functions/admin-preview/api/public-jobs.js
          node --check apps/admin-preview/library-file-ui.js
      - name: Admin library behavior and security
        run: |
          node --test apps/web/scripts/admin-recruitment-library.test.mjs
          node --test apps/web/scripts/admin-library-snapshot-cache.test.mjs
          node --test apps/web/scripts/admin-library-excel.test.mjs
          node --test apps/web/scripts/admin-password-console.test.mjs
          node --test apps/web/scripts/admin-real-diagnostics.test.mjs
          node --test apps/web/scripts/admin-market-authenticity.test.mjs
          node --test apps/admin-preview/tests/*.test.mjs
      - name: Build isolated admin static assets
        run: |
          cd apps/web
          CF_PAGES_BRANCH=feat/admin-password-console-20261112 python3 scripts/build-standalone-admin.py
          test -s dist/admin-preview/dashboard.js
          test -s dist/admin-preview/market.js
          grep -q '岗位与企业' dist/admin-preview/index.html
          test -s dist/admin-preview/index.html
          grep -q '运营监控' dist/admin-preview/index.html
          grep -q 'users-load-private' dist/admin-preview/index.html
          test -s dist/_routes.json
