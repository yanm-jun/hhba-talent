name: HHBA AI Company Search Phase1
on:
  push:
    branches:
      - feat/ai-company-search-phase1-20261023
  pull_request:
    branches:
      - feat/domestic-weekly-cache-pages-20261022
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s apps/company-match-api -p 'test_*.py' -v
      - run: python -m py_compile apps/company-match-api/server.py

      - run: python -m unittest discover -s apps/job-discovery-api -p 'test_*.py' -v
      - run: python -m py_compile apps/job-discovery-api/server.py

  media-preview:
    name: Persist genuine company media and refresh isolated Pages preview
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: hhba-ai-company-preview-build
      cancel-in-progress: false
    environment:
      name: ai-company-preview
      url: https://yanm-jun.github.io/hhba-talent/ai-company-preview/
    steps:
      - name: Checkout exact reviewed feature branch (not the synthetic PR merge ref)
        uses: actions/checkout@v4
        with:
          ref: feat/ai-company-search-phase1-20261023
          persist-credentials: true
      - name: Checkout original domestic job market separately
        uses: actions/checkout@v4
        with:
          ref: feat/domestic-weekly-cache-pages-20261022
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install application and bounded image codecs
        run: |
          npm ci --prefix apps/web
          npm install --prefix apps/web --no-save --no-package-lock @resvg/resvg-js@2.6.2 sharp@0.34.4
      - name: Check all media pipeline source scripts
        working-directory: apps/web
        run: |
          node --check scripts/discover-official-company-media.mjs
          node --check scripts/discover-official-brand-candidates.mjs
          node --check scripts/prepare-domestic-company-media.mjs
          node --check scripts/import-domestic-company-media.mjs
          node --test scripts/import-domestic-company-media.test.mjs
      - name: Discover first-party photos and official-site brand candidates
        working-directory: apps/web
        run: |
          node scripts/discover-official-company-media.mjs
          node scripts/discover-official-brand-candidates.mjs
          node scripts/prepare-domestic-company-media.mjs
      - name: Import user-provided JPG/PNG office photos and screenshot assets
        working-directory: apps/web
        run: node scripts/import-domestic-company-media.mjs
      - name: Verify exact hiring sites and six dimensions without fake completion
        working-directory: apps/web
        run: |
          node --test scripts/audit-company-complete-50.mjs
          node --test scripts/audit-domestic-recruitment.mjs
          node --test scripts/audit-domestic-company-media.mjs
      - name: Publish individual evidence and failures as reviewable run artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fifty-company-media-and-evidence
          path: |
            apps/web/preview-reports/
            apps/web/src/data/domesticMediaBundle.json
            apps/web/src/data/domesticOfficialSceneBundle.json
            apps/web/public/domestic-media/
          retention-days: 30
      - name: Persist source-tagged image assets back to development branch
        shell: bash
        run: |
          set -euo pipefail
          image_kb="$(du -sk apps/web/public/domestic-media 2>/dev/null | cut -f1 || echo 0)"
          if [ "$image_kb" -gt 102400 ]; then
            echo "::warning::Media exceeds 100 MB; skip pushing and preserve review artifact."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f apps/web/public/domestic-media/ \
              apps/web/src/data/domesticMediaBundle.json \
              apps/web/src/data/domesticOfficialSceneBundle.json \
              apps/web/src/data/domesticCareerProfiles.json
            if ! git diff --cached --quiet; then
              git commit -m "assets(company-discovery): persist first-party media candidates and exact provenance"
              if ! git push origin "HEAD:refs/heads/feat/ai-company-search-phase1-20261023"; then
                echo "::warning::Branch advanced during media job; preview still uses checked media, review asset artifact for reconciliation."
              fi
            else
              echo "No new media files or source records."
            fi
          fi
      - name: Build company preview from current verified source and bundled media
        env:
          HHBA_GITHUB_PAGES: '1'
          HHBA_PAGES_BASE: '/hhba-talent/ai-company-preview/'
          VITE_HHBA_COMPANY_PREVIEW: '1'
          VITE_HHBA_DOMESTIC_STATIC_ONLY: '0'
          VITE_HHBA_OFFICIAL_THREE_ONLY: '1'
        run: npm run build --prefix apps/web
      - name: Build original domestic positions page separately
        run: |
          npm ci --prefix baseline/apps/web
          HHBA_GITHUB_PAGES=1 npm run build --prefix baseline/apps/web
          test -f baseline/apps/web/dist/data/domestic-jobs.json
      - name: Package both existing home and isolated company preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p combined/ai-company-preview
          cp -a baseline/apps/web/dist/. combined/
          cp -a apps/web/dist/. combined/ai-company-preview/
          cp combined/index.html combined/404.html
          test -f combined/index.html
          test -f combined/ai-company-preview/index.html
          test -f combined/ai-company-preview/data/domestic-complete-50-progress.json
          test -f combined/data/domestic-jobs.json
          if grep -R -E 'DEEPSEEK_API_KEY|sk-[a-zA-Z0-9]{18,}' combined/ai-company-preview/assets/; then
            echo "Possible credential leak"; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: combined
      - name: Deploy additive preview, NOT Railway production
        uses: actions/deploy-pages@v4
