name: HHBA employers 111-113 V2 isolated static review
on:
  push:
    branches: [feature/employers-111-113-v2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hhba-employers-111-113-static-review
  cancel-in-progress: true
jobs:
  static-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install exact dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Validate three employers, evidence level and search filters
        working-directory: apps/web
        run: |
          node scripts/employers-111-113-v2.contract.test.mjs
          node scripts/employer-job-level-search.contract.test.mjs
          node scripts/major-direct-role-results.contract.test.mjs
          node scripts/recruitment-market-source-invalid.regression.test.mjs
      - name: Compile existing V2 static site with materialized company entry points
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
          HHBA_PAGES_BASE: '/hhba-talent/'
          VITE_HHBA_DOMESTIC_REBUILD_V2: '1'
        run: |
          npm run build
          node scripts/materialize-company-route-entries.mjs
      - name: Assert 3 direct company routes and branded non-real provenance
        run: |
          test -s apps/web/dist/index.html
          for id in 111 112 113; do
            test -s "apps/web/dist/companies/autumn/cn-autumn-$id/index.html"
            test -s "apps/web/dist/images/employer-profiles/cn-autumn-$id/logo.svg"
            test -s "apps/web/dist/images/employer-profiles/cn-autumn-$id/photo1.svg"
            test -s "apps/web/dist/images/employer-profiles/cn-autumn-$id/photo2.svg"
            test -s "apps/web/dist/images/employer-profiles/cn-autumn-$id/media-sources.json"
          done
      - name: Publish independently downloadable static preview Artifact, NOT GitHub Pages
        uses: actions/upload-artifact@v4
        with:
          name: hhba-employers-111-113-independent-static-review
          path: apps/web/dist/
          retention-days: 14
          if-no-files-found: error
      - name: Publish source and photo copyright audit Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hhba-employers-111-113-evidence-audit
          path: |
            apps/web/public/images/employer-profiles/cn-autumn-111/media-sources.json
            apps/web/public/images/employer-profiles/cn-autumn-112/media-sources.json
            apps/web/public/images/employer-profiles/cn-autumn-113/media-sources.json
            docs/HHBA_EMPLOYERS_111_113_SOURCE_AUDIT_20261103.md
          retention-days: 30
          if-no-files-found: error
