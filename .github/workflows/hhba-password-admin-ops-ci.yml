name: HHBA password-admin V4 ops monitor regression
on:
  pull_request:
    branches: [feat/admin-password-console-20261112]
    paths:
      - 'apps/admin-preview/dashboard.js'
      - 'apps/admin-preview/index.html'
      - 'apps/web/functions/api/admin/metrics.js'
      - 'apps/web/functions/_lib/v4-phase-ops-metrics.js'
      - 'apps/web/scripts/v4-admin-ops-panel.contract.test.mjs'
      - '.github/workflows/hhba-password-admin-ops-ci.yml'
  push:
    branches: [feat/admin-password-console-20261112]
permissions: {contents: read}
jobs:
  admin-ops:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check apps/admin-preview/dashboard.js
          node --check apps/web/functions/api/admin/metrics.js
          node --check apps/web/functions/_lib/v4-phase-ops-metrics.js
          node --test apps/web/scripts/v4-admin-ops-panel.contract.test.mjs
      - name: Preserve standalone authenticated admin build
        run: CF_PAGES_BRANCH=feat/admin-password-console-20261112 python3 apps/web/scripts/build-standalone-admin.py
