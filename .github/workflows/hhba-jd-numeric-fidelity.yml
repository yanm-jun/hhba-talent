name: HHBA Official Numeric Fidelity JD Fix Build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hhba-jd-numeric-fidelity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numeric:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jd-numeric-fidelity-20261019
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Install existing Bun dependencies
        working-directory: ops/legacy-marketplace
        run: bun install
      - name: Verify safe fallback plus reject contradictory numeric translations
        working-directory: ops/legacy-marketplace
        run: |
          cp railway-function-20261018.ts server.ts
          sed -i 's/"html-to-text@9"/"html-to-text"/;s/"sanitize-html@2"/"sanitize-html"/' server.ts
          bun build --target=bun server.ts --outdir /tmp/hhba-number-fidelity
          timeout 8s bun run server.ts > /tmp/hhba-number-smoke.log 2>&1 || test "$?" -eq 124
          cat /tmp/hhba-number-smoke.log | grep 'HHBA_OFFICIAL_JD_NUMBER_GUARD'
