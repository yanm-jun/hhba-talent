name: HHBA recruitment market source-invalid regression
on:
  push:
    branches: [fix/recruitment-market-source-invalid-20261031]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Audit all approved job IDs, Moka hash URLs and source hosts
        working-directory: apps/web
        run: |
          node scripts/recruitment-market-source-invalid.regression.test.mjs
          node scripts/employer-factory-check.mjs
      - name: Build entire HHBA V2 static site with original Pages routing
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
          HHBA_PAGES_BASE: '/hhba-talent/'
          VITE_HHBA_DOMESTIC_REBUILD_V2: '1'
        run: |
          npm run build
          node scripts/materialize-company-route-entries.mjs
      - name: Install Chromium for real error reproduction on desktop and mobile
        working-directory: apps/web
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start same-site static server and test default market and both historical source IDs
        working-directory: apps/web
        env:
          HHBA_TEST_BASE: 'http://127.0.0.1:4173/hhba-talent/'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/hhba-recruitment-source-verify.log 2>&1 &
          for n in $(seq 1 40); do
            if curl -fsS "$HHBA_TEST_BASE" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS "$HHBA_TEST_BASE"
          node scripts/recruitment-market-source-invalid.browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hhba-fixed-recruitment-market-preview
          path: apps/web/dist/
          retention-days: 7
          if-no-files-found: error
