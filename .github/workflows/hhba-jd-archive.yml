name: HHBA JD archive evidence and model integration
on:
  pull_request:
    paths:
      - '.github/workflows/hhba-jd-archive.yml'
      - 'apps/web/d1/0027_job_jd_archive.sql'
      - 'apps/web/functions/_lib/job-jd-archive.js'
      - 'apps/web/functions/_lib/official-job-evidence.js'
      - 'apps/web/functions/api/job-jd.js'
      - 'apps/web/functions/api/resume-optimize.js'
      - 'apps/web/functions/api/resume-rewrite.js'
      - 'apps/web/functions/api/resume-rewrite-step.js'
      - 'apps/web/src/services/jobJdArchive.ts'
      - 'apps/web/src/services/resumeOptimizationApi.ts'
      - 'apps/web/src/services/resumeWholeRewriteApi.ts'
      - 'apps/web/src/components/TargetedResumeOptimization.tsx'
      - 'apps/web/src/services/stablePostingScope.mjs'
      - 'apps/web/src/services/stablePostingScope.d.mts'
      - 'apps/web/scripts/posting-scope.contract.test.mjs'
      - 'apps/web/scripts/job-jd-archive.contract.test.mjs'
      - 'apps/web/functions/_lib/public-ats-jd.js'
      - 'apps/web/d1/0028_public_ats_jd_versions.sql'
      - 'apps/web/scripts/public-ats-jd.contract.test.mjs'
      - 'apps/web/functions/_lib/resume-reassessment.js'
      - 'apps/web/functions/api/resume-reassess.js'
      - 'apps/web/scripts/verified-jd-reassessment.contract.test.mjs'
      - 'apps/web/functions/_lib/match-jd-enrichment.js'
      - 'apps/web/functions/_lib/domestic-job-research.js'
      - 'apps/web/functions/_lib/autonomous-mainland-search.js'
      - 'apps/web/functions/_lib/ai-owned-job-research.js'
      - 'apps/web/functions/_lib/native-deepsearch-job-research.js'
      - 'apps/web/functions/_lib/hybrid-mainland-job-research.js'
      - 'apps/web/functions/_lib/clean-match-v2.js'
      - 'apps/web/functions/_lib/clean-match-v2-jd-bridge.js'
      - 'apps/web/functions/api/match-next/**'
      - 'apps/web/functions/_lib/domestic-employer-index.js'
      - 'apps/web/functions/_lib/agent-score-feedback.js'
      - 'apps/web/functions/_lib/ai-research-checkpoint.js'
      - 'apps/web/functions/_lib/agent-quality-metrics.js'
      - 'apps/web/d1/0030_ai_research_checkpoints.sql'
      - 'apps/web/scripts/agent-score-feedback.contract.test.mjs'
      - 'apps/web/scripts/ai-research-checkpoint.contract.test.mjs'
      - 'apps/web/scripts/agent-quality-metrics.contract.test.mjs'
      - 'apps/web/scripts/ai-owned-job-research.contract.test.mjs'
      - 'apps/web/scripts/native-deepsearch-job-research.contract.test.mjs'
      - 'apps/web/scripts/hybrid-mainland-job-research.contract.test.mjs'
      - 'apps/web/scripts/clean-match-v2.contract.test.mjs'
      - 'apps/web/scripts/clean-match-v2-jd-bridge.contract.test.mjs'
      - 'apps/web/scripts/domestic-employer-index.contract.test.mjs'
      - 'apps/web/scripts/match-live-recovery.contract.test.mjs'
      - 'apps/web/scripts/match-deep-research-experience.contract.test.mjs'
      - 'apps/web/scripts/match-production-failure-regression.contract.test.mjs'
      - 'apps/web/functions/_lib/match-provider-preflight.js'
      - 'apps/web/scripts/match-preflight-resilience.contract.test.mjs'
      - 'apps/web/scripts/autonomous-mainland-search.contract.test.mjs'
      - 'apps/web/functions/_lib/deepseek-search-match.js'
      - 'apps/web/functions/_lib/match-employer-source.js'
      - 'apps/web/scripts/domestic-job-research.contract.test.mjs'
      - 'apps/web/scripts/match-experience-regression.contract.test.mjs'
      - 'apps/web/src/styles/resume-match-dialog.css'
      - 'apps/web/src/pages/CandidateMatchPage.tsx'
      - 'apps/web/scripts/match-search-first.contract.test.mjs'
      - 'apps/web/functions/_lib/match-history.js'
      - 'apps/web/functions/api/match-native/**'
      - 'apps/web/src/services/resumeMatch.ts'
      - 'apps/web/src/services/resumeMatching.ts'
      - 'apps/web/src/services/matchHistory.ts'
      - 'apps/web/src/components/CandidateMatchNativeDialog.tsx'
      - 'apps/web/src/components/CandidateMatchHistory.tsx'
      - 'apps/web/scripts/match-jd-enrichment.contract.test.mjs'
      - 'apps/web/scripts/match-jd-identity-recovery.contract.test.mjs'
      - 'apps/web/scripts/match-search-retry.contract.test.mjs'
      - 'apps/web/scripts/match-ats-verified-only.contract.test.mjs'
      - 'apps/web/d1/0029_jd_posting_lifecycle.sql'
      - 'apps/web/functions/_lib/jd-posting-lifecycle.js'
      - 'apps/web/functions/_lib/jd-lifecycle-maintenance.js'
      - 'apps/web/ops/jd-lifecycle-cron-worker.mjs'
      - 'apps/web/scripts/jd-lifecycle.contract.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-contract-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify JD archive and mock R2/D1 integrity
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          node --test scripts/job-jd-archive.contract.test.mjs
          node --test scripts/public-ats-jd.contract.test.mjs
          node --test scripts/verified-jd-reassessment.contract.test.mjs
          node --test scripts/match-jd-enrichment.contract.test.mjs
          node --test scripts/match-jd-identity-recovery.contract.test.mjs
          node --test scripts/match-search-retry.contract.test.mjs
          node --test scripts/match-ats-verified-only.contract.test.mjs
          node --test scripts/domestic-job-research.contract.test.mjs
          node --test scripts/match-experience-regression.contract.test.mjs
          node --test scripts/match-search-first.contract.test.mjs
          node --test scripts/autonomous-mainland-search.contract.test.mjs
          node --test scripts/ai-owned-job-research.contract.test.mjs
          node --test scripts/native-deepsearch-job-research.contract.test.mjs
          node --test scripts/hybrid-mainland-job-research.contract.test.mjs
          node --test scripts/clean-match-v2.contract.test.mjs
          node --test scripts/clean-match-v2-jd-bridge.contract.test.mjs
          node --test scripts/domestic-employer-index.contract.test.mjs
          node --test scripts/match-live-recovery.contract.test.mjs
          node --test scripts/match-deep-research-experience.contract.test.mjs
          node --test scripts/match-production-failure-regression.contract.test.mjs
          node --test scripts/match-preflight-resilience.contract.test.mjs
          node --test scripts/agent-score-feedback.contract.test.mjs
          node --test scripts/ai-research-checkpoint.contract.test.mjs
          node --test scripts/agent-quality-metrics.contract.test.mjs
          node --test scripts/posting-scope.contract.test.mjs
          node --test scripts/jd-lifecycle.contract.test.mjs
          node --test scripts/match-history.contract.test.mjs
          node --test scripts/match-native-web.contract.test.mjs
          node --test scripts/official-jd-extraction.route.test.mjs || test ! -f scripts/official-jd-extraction.route.test.mjs
      - name: Full frontend TypeScript and Vite build
        working-directory: apps/web
        run: npm run build
