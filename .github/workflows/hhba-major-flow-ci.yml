name: HHBA Professional Matching Contract
on:
  push:
    branches: [feat/major-company-job-flow-20261029]
  pull_request:
    branches: [feat/hhba-unified-static-20261025]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Preserve historical reviewed employers and new major navigation
        working-directory: apps/web
        run: |
          node scripts/major-company-job-flow.contract.test.mjs
          node scripts/kpmg-recruitment-first.contract.test.mjs
          node scripts/schneider-recruitment-first.contract.test.mjs
          node scripts/domestic-rebuild-v2.contract.test.mjs
      - name: Verify production static site builds without API secrets
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
          VITE_HHBA_OVERSEAS_CURATED_100: '1'
          VITE_HHBA_DOMESTIC_REBUILD_V2: '1'
          VITE_HHBA_ACCOUNT_API_ENABLED: '0'
        run: npm run build
