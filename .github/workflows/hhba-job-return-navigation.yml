name: HHBA Job Detail Return Navigation
on:
  push:
    branches: [fix/job-detail-origin-navigation-20261020]
  pull_request:
    paths: ['apps/web/**']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Build all routes with Railway configuration
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '0'
          VITE_HHBA_VERIFIED_SNAPSHOT: '1'
          VITE_HHBA_ACCOUNT_API_ENABLED: '0'
        run: npm run build
      - name: Check return destinations and existing JD regressions
        working-directory: apps/web
        run: |
          node --test scripts/job-origin-navigation.contract.test.mjs
          node --test scripts/white-market-detail.contract.test.mjs
