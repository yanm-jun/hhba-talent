name: HHBA Official Brand Favicon Inspection
on:
  push:
    branches: [feat/remaining-verified-brand-logos-20261020]
    paths: ['.github/workflows/hhba-official-logo-probe.yml','apps/web/scripts/official-logo-probe.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Probe official websites for explicitly declared native brand icon assets only
        run: python apps/web/scripts/official-logo-probe.py
