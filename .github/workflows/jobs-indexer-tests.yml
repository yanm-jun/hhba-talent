name: HHBA jobs indexer tests
on:
  push:
    branches:
      - feat/chinese-job-search-20261020
    paths:
      - "ops/jobs-indexer/**"
      - ".github/workflows/jobs-indexer-tests.yml"
  pull_request:
    paths:
      - "ops/jobs-indexer/**"
      - ".github/workflows/jobs-indexer-tests.yml"
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops/jobs-indexer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript modules
        run: |
          node --check app.js
          node --check page.mjs
          node --check locale.mjs
          node --check query.mjs
          node --check store.mjs
          node --check server.mjs
      - name: Run unit tests
        run: npm test
