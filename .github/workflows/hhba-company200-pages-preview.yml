name: HHBA 200-company GitHub Pages isolated preview

on:
  push:
    branches: [feat/domestic-company200-20261024]
    paths:
      - '.github/workflows/hhba-company200-pages-preview.yml'
      - 'apps/web/src/pages/Company200PreviewPage.tsx'
      - 'apps/web/src/components/DomesticCompanyResults.tsx'
      - 'apps/web/src/main.tsx'
      - 'apps/web/src/pages/HomePage.tsx'
      - 'apps/web/src/components/Shell.tsx'
      - 'apps/web/src/components/CandidateAccountDropdown.tsx'
      - 'apps/web/src/pages/LegalAidLandingPage.tsx'
      - 'apps/web/src/pages/PersonalCenterPage.tsx'
      - 'apps/web/src/styles/candidate-account-dropdown.css'
      - 'apps/web/src/styles/legal-aid-landing.css'
      - 'apps/web/src/components/UnifiedJobMarket.tsx'
      - 'apps/web/src/router.tsx'
      - 'apps/web/scripts/prepare-pages-jobs.mjs'
      - 'apps/web/scripts/audit-all-official-jds.mjs'
      - 'apps/web/src/pages/DomesticCompanyPage.tsx'
      - 'apps/web/src/services/domesticCompanySearch.ts'
      - 'apps/web/src/services/domesticCompany200Data.ts'
      - 'apps/web/src/services/domesticMajors.ts'
      - 'apps/web/src/data/domesticComplete200Target.json'
      - 'apps/web/src/data/domesticCompanyExpansion200Profiles.json'
      - 'apps/web/src/data/domesticCompany200VerifiedEditorial.json'
      - 'apps/web/src/data/domesticRecruitment200Registry.json'
      - 'apps/web/src/data/domesticMedia200Bundle.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hhba-company200-pages-preview
  cancel-in-progress: true

jobs:
  static-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated 200-company source (never touch main or Railway)
        uses: actions/checkout@v4
        with:
          ref: feat/domestic-company200-20261024
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefix apps/web --no-audit --no-fund
      - name: Verify 200 curated identities and UI integration
        working-directory: apps/web
        run: |
          node scripts/audit-domestic-company200.mjs
          node scripts/company200-integration.contract.test.mjs
      - name: Build original HHBA job market plus additive 200-company discovery

        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
          VITE_HHBA_ACCOUNT_API_ENABLED: '0'
          VITE_DEMO_ACCOUNT_ENABLED: '0'
        run: |
          npm run build
      - name: Refresh real public job index from existing official ATS source
        working-directory: apps/web
        run: node scripts/prepare-pages-jobs.mjs
      - name: Validate source-backed JD audit and generate accurate searchable job facets
        working-directory: apps/web
        run: |
          node --test scripts/audit-all-official-jds.test.mjs scripts/job-search-facets.test.mjs
          node scripts/audit-all-official-jds.mjs
      - name: Check published market data is current and tied to its audit
        working-directory: apps/web
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const json=n=>JSON.parse(readFileSync('dist/data/'+n,'utf8'));
          const jobs=json('jobs.json'),audit=json('job-sync-status.json'),facets=json('job-search-facets.json');
          if(jobs.total!==jobs.jobs.length||jobs.total<1||jobs.failures!==0||
              Date.now()-Date.parse(jobs.updated)>24*3600000||
              audit.summary.indexed_as_of!==jobs.updated||
              audit.jobs.length!==jobs.total||
              facets.indexed_as_of!==jobs.updated||
              facets.total_indexed_jobs!==jobs.total||
              facets.jobs.length!==facets.extracted_count)
            throw Error('PUBLIC_JOB_MARKET_NOT_READY');
          const names=new Set(jobs.jobs.map(j=>j.company));
          const existing=['OpenAI','Anthropic','SpaceX'];
          const found=existing.filter(n=>names.has(n));
          if(found.length!==3)throw Error('CORE_OFFICIAL_EMPLOYERS_MISSING '+found.join(','));
          console.log('HHBA_INTEGRATED_PAGES_MARKET',{jobs:jobs.total,employers:found,companyDirectory:200,updated:jobs.updated});
          NODE
      - name: Finalize SPA deep-link reload and static routes
        working-directory: apps/web
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: Verify artifact is a subpath-safe SPA and contains compiled company data
        working-directory: apps/web
        run: |
          test -s dist/index.html
          test -s dist/404.html
          test -s dist/data/jobs.json
          test -s dist/data/job-sync-status.json
          test -s dist/data/job-search-facets.json
          test -f dist/.nojekyll
          grep -q '/hhba-talent/assets/' dist/index.html
          ! grep -R -E 'BEGIN (RSA|OPENSSH) PRIVATE KEY' dist
          find dist/assets -name '*.js' -print -quit | grep -q .
      - name: Upload reusable build artifact for independent review
        uses: actions/upload-artifact@v4
        with:
          name: hhba-company200-static-preview
          path: apps/web/dist/
          include-hidden-files: true
          retention-days: 14
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy-preview:
    needs: static-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: hhba-company200-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure existing GitHub Pages publishing source
        uses: actions/configure-pages@v5
      - name: Publish isolated static preview to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment

  candidate-menu-browser:
    needs: deploy-preview
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout current candidate UI test
        uses: actions/checkout@v4
        with:
          ref: feat/domestic-company200-20261024
      - name: Install browser tooling
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for headless navigation test
        run: |
          npm install --no-save --no-package-lock --prefix apps/web playwright@1.56.1 --no-audit --no-fund
          cd apps/web
          npx playwright install --with-deps chromium
      - name: Verify hover, keyboard, touch and all seven routes online
        working-directory: apps/web
        run: |
          mkdir -p preview-reports/candidate-menu
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const origin='https://yanm-jun.github.io/hhba-talent';
          const expected=[
            ['工作台','/candidate/account'],
            ['我的收藏','/candidate/saved'],
            ['个人资料','/candidate/account/profile'],
            ['求职偏好','/candidate/account/preferences'],
            ['我的简历','/candidate/account/resume'],
            ['求职记录','/candidate/account/applications'],
            ['法律援助','/candidate/account/legal-aid']
          ];
          try{
            const page=await browser.newPage({viewport:{width:1440,height:950},locale:'zh-CN'});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto(origin+'/',{waitUntil:'domcontentloaded',timeout:50000});
            const trigger=page.getByRole('button',{name:/个人中心/}).first();
            await trigger.waitFor({timeout:20000});
            await trigger.hover();
            const menu=page.getByRole('navigation',{name:'个人中心快速导航'});
            await menu.waitFor({timeout:8000});
            if(await trigger.getAttribute('aria-expanded')!=='true')throw Error('HOVER_NOT_OPEN');
            const links=menu.locator('.hhba-account-dropdown-item');
            if(await links.count()!==7)throw Error('EXPECTED_SEVEN_LINKS');
            // Regression: the global ".topbar nav" flex rule must never affect the nested disclosure.
            const panelBox=await menu.boundingBox();
            const triggerBox=await trigger.boundingBox();
            if(!panelBox||!triggerBox)throw Error('DROPDOWN_BOUNDING_BOX_MISSING');
            console.log('HHBA_MENU_POSITION_DEBUG',JSON.stringify({triggerX:triggerBox.x,triggerWidth:triggerBox.width,menuX:panelBox.x,menuWidth:panelBox.width,viewportWidth:page.viewportSize().width}));
            if(panelBox.width<220||panelBox.width>280)throw Error('DROPDOWN_WIDTH_BAD '+panelBox.width);
            if(Math.abs(panelBox.x-(triggerBox.x-12))>5)throw Error('MENU_NOT_ANCHORED_TO_TRIGGER '+JSON.stringify({panelBox,triggerBox}));
            if(panelBox.x+panelBox.width>page.viewportSize().width+1)throw Error('MENU_CLIPPED_AT_VIEWPORT_RIGHT');
            if(await menu.locator('.hhba-account-dropdown-heading').count()!==0)throw Error('DUPLICATE_PERSONAL_CENTER_HEADING');
            if((await menu.innerText()).match(/个人中心/))throw Error('DUPLICATE_PERSONAL_CENTER_TEXT');
            const bounds=[];
            const icons=[];
            for(let n=0;n<7;n++){
              const row=links.nth(n);
              const b=await row.boundingBox();
              const icon=await row.locator('svg').first().boundingBox();
              const label=await row.locator('.hhba-account-dropdown-copy').boundingBox();
              const arrow=await row.locator('.hhba-account-dropdown-chevron').boundingBox();
              if(!b||!icon||!label||!arrow)throw Error('DROPDOWN_ROW_MISSING_'+n);
              if(Math.abs(icon.x-triggerBox.x)>22)throw Error('ICON_NOT_ALIGNED_WITH_TOP_PERSONAL_CENTER '+n+': '+JSON.stringify({icon,triggerBox}));
              if(label.x<=icon.x+icon.width||label.x>=arrow.x-18)throw Error('LABEL_POSITION_BAD '+n);
              if(arrow.x+arrow.width>panelBox.x+panelBox.width-8)throw Error('ARROW_OUT_OF_PANEL '+n);
              icons.push(Math.round(icon.x));bounds.push(b);
            }
            if(bounds[0].y-panelBox.y>32)throw Error('FIRST_ROW_NOT_AT_TOP');
            for(let n=0;n<bounds.length;n++){
              if(bounds[n].width<panelBox.width-35)throw Error('ROW_SQUEEZED '+n);
              if(bounds[n].x<panelBox.x-2||bounds[n].x>panelBox.x+25)throw Error('ROW_NOT_LEFT_ALIGNED '+n);
              if(n&&bounds[n].y<=bounds[n-1].y+bounds[n-1].height-2)throw Error('ROWS_NOT_VERTICAL '+n);
            }
            if((await menu.innerText()).includes('/candidate/'))throw Error('TECHNICAL_ROUTES_VISIBLE');
            console.log('HHBA_MENU_LAYOUT_OK',JSON.stringify({panelX:panelBox.x,triggerX:triggerBox.x,iconXs:icons,panelWidth:panelBox.width,alignedToTrigger:true,duplicateHeading:false,sevenVerticalRows:true,technicalPathsHidden:true}));
            for(const [label,path]of expected){
              const link=menu.getByRole('link',{name:new RegExp(label)}).first();
              const url=await link.getAttribute('href');
              if(url!==('/hhba-talent'+path))throw Error('BAD_MENU_LINK '+label+': '+url);
            }
            await menu.getByRole('link',{name:/工作台/}).hover();
            await menu.waitFor({timeout:4000});
            if(await links.count()!==7)throw Error('HOVER_MOVEMENT_CLOSED_MENU');
            await page.screenshot({path:'preview-reports/candidate-menu/desktop-hover-dropdown.png',fullPage:false});
            await page.keyboard.press('Escape');
            if(await menu.count()!==0||await trigger.getAttribute('aria-expanded')!=='false')
              throw Error('ESCAPE_NOT_CLOSED');
            await trigger.focus();
            await menu.waitFor({timeout:7000});
            await menu.getByRole('link',{name:/法律援助/}).click();
            await page.getByRole('heading',{name:'法律援助'}).waitFor({timeout:10000});
            await page.getByText('服务筹备中 · 暂未开放案件受理').waitFor({timeout:6000});
            if(await page.locator('input[type="file"]').count()!==0)throw Error('EVIDENCE_UPLOAD_MUST_NOT_BE_OPEN');
            await page.screenshot({path:'preview-reports/candidate-menu/legal-aid-placeholder.png',fullPage:true});
            // Preserve the original job market when entering and leaving the account menu.
            await page.goto(origin+'/',{waitUntil:'domcontentloaded'});
            await page.locator('.unified-job-card').first().waitFor({timeout:50000});
            const brands=await page.locator('.unified-job-card .unified-company-brand strong').allTextContents();
            for(const n of ['OpenAI','Anthropic','SpaceX'])
              if(!brands.some(v=>v.includes(n)))throw Error('ORIGINAL_MARKET_LOST '+n);
            if(errors.length)throw Error('JS_PAGE_ERRORS '+errors.join(' | '));
            const mobile=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true,locale:'zh-CN'});
            await mobile.goto(origin+'/',{waitUntil:'domcontentloaded',timeout:50000});
            const mTrigger=mobile.getByRole('button',{name:/个人中心/}).first();
            await mTrigger.click();
            await mobile.getByRole('navigation',{name:'个人中心快速导航'}).waitFor({timeout:8000});
            await mobile.screenshot({path:'preview-reports/candidate-menu/mobile-tap-dropdown.png',fullPage:false});
            await mobile.getByRole('navigation',{name:'个人中心快速导航'}).getByRole('link',{name:/求职偏好/}).click();
            await mobile.getByText('求职偏好',{exact:true}).first().waitFor({timeout:10000});
            console.log('HHBA_CANDIDATE_ACCOUNT_MENU_OK',JSON.stringify({
              sevenPathsVerified:true,hover:true,escape:true,keyboardFocus:true,
              mobileTap:true,legalPlaceholder:true,noEvidenceUpload:true,
              jobsRetained:['OpenAI','Anthropic','SpaceX']
            }));
          }finally{await browser.close();}
          NODE
      - name: Retain navigation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hhba-candidate-personal-center-dropdown
          path: apps/web/preview-reports/candidate-menu/
          retention-days: 14
          if-no-files-found: warn
