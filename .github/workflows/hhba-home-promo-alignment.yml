name: HHBA homepage AI banner alignment and Railway web build
on:
  push:
    branches: [fix/home-match-promo-market-alignment-20261020]
    paths:
      - 'apps/web/**'
      - '.github/workflows/hhba-home-promo-alignment.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/hhba-home-promo-alignment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  home-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Validate exact market and promo geometry contracts
        working-directory: apps/web
        run: node --test scripts/home-promo-alignment.contract.test.mjs
      - name: TypeScript and production Vite build
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '0'
          VITE_HHBA_VERIFIED_SNAPSHOT: '1'
          VITE_HHBA_ACCOUNT_API_ENABLED: '0'
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -s dist/index.html
