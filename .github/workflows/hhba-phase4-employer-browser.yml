name: HHBA Phase 4 Employer Browser Proof
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hhba-phase4-employer-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  employer-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/github-pages-white-preview-20261019
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser automation
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Browser check using synthetic recruiter only (no real company or resume writes)
        run: python scripts/check_phase4_employer_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hhba-phase4-employer-mobile-preview
          path: /tmp/hhba-phase4-employer-mobile.png
          retention-days: 14
          if-no-files-found: ignore
