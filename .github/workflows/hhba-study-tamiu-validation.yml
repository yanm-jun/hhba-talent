name: HHBA TAMIU University Deep Profile Validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hhba-study-tamiu-validation.yml'
      - 'apps/web/src/data/studyTamiu.ts'
      - 'apps/web/src/components/TamiuUniversityPage.tsx'
      - 'apps/web/src/components/StudyUniversityDirectory.tsx'
      - 'apps/web/src/styles/study-tamiu.css'
      - 'apps/web/scripts/package-tamiu-campus-photos.py'
      - 'apps/web/scripts/tamiu.contract.test.mjs'
      - 'apps/web/scripts/tamiu.browser.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hhba-tamiu-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Real TAMIU content, real campus photos and desktop/mobile interaction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install HHBA React app dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Check official-source MBA depth, international student cautions and image rights
        working-directory: apps/web
        run: node --experimental-strip-types --test scripts/tamiu.contract.test.mjs scripts/study-universities.contract.test.mjs scripts/study-abroad.contract.test.mjs
      - name: Package 3 rights-cleared actual Texas A&M International campus photos
        run: python apps/web/scripts/package-tamiu-campus-photos.py
      - name: Compile the actual existing HHBA Pages site
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
          HHBA_PAGES_BASE: '/hhba-talent/'
        run: npm run build
      - name: Install real Chromium
        working-directory: apps/web
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test real campus photos, university details, MBA, application and cost, mobile and desktop
        working-directory: apps/web
        env:
          HHBA_GITHUB_PAGES: '1'
          HHBA_PAGES_BASE: '/hhba-talent/'
          HHBA_TEST_BASE: 'http://127.0.0.1:4173/hhba-talent/'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/hhba-tamiu.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS "$HHBA_TEST_BASE" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS "$HHBA_TEST_BASE" >/dev/null
          node scripts/tamiu.browser.mjs
      - name: Save actual desktop/mobile screenshots for user review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hhba-tamiu-deep-profile-browser-proof
          path: apps/web/mainline-v2-browser-proof/
          if-no-files-found: ignore
          retention-days: 14
